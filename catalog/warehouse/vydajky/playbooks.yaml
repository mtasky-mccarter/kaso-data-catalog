  proves_sk: Current VYD header/line stav vrátane invoice linku a state kódov.
  does_not_prove_sk: Current row samostatne nepreukazuje session bypass alebo úplný mutation path.
  next_step_sk: Prever T_VYD_O_REZ, T_VYD_O_DEL, T_VYD_O_ID_SZ_KONTROLA, T_VYD_O_KONTROLA_NA_FAK a session režim.
    Normálne spracované riadky majú guardy proti delete; swap/replikácia/inventory majú špeciálne bypassy.
  flow_refs:
  - vyd.flow.t_vyd_o_rez
  - vyd.flow.t_vyd_o_del
  - vyd.flow.t_vyd_o_id_sz_kontrola
  - vyd.flow.t_vyd_o_kontrola_na_fak
  dependency_or_boundary_refs:
