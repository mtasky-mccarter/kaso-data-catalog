  - vyd.flow.t_vratky_vyd_l
  dependency_or_boundary_refs:
  - vyd.rel.line_source_polymorphic
  temporal_boundary_sk: Current diagnostika; rešpektovať explicitné history boundaries.
- playbook_id: vyd.playbook.04
  symptom_sk: Rezervácia nesedí
  first_sql_ref: vyd.sql.02
  proves_sk: Current P_REZ a ostatné quantity bucket-y na VYD_O.
  does_not_prove_sk: Nulový snapshot ani P_REZ<>0 anomaly výsledok neurčuje platnosť alebo používanie reservation
    mechanizmu.
  next_step_sk: P_REZ na VYD_O môže byť transient a aktuálne je globálne 0. Source of behavior je T_VYD_O_REZ +
    C_SZ. Pri 019 linku prever OBJ_ODB_O.P_REZ a session flags; neporovnávaj iba dva stĺpce bez mutation path.
