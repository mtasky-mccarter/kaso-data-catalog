  - vyd.flow.t_sz_p_vyd_l
  dependency_or_boundary_refs:
  - mc.object.vyd_l
  - mc.object.vyd_o
  temporal_boundary_sk: Current diagnostika; rešpektovať explicitné history boundaries.
- playbook_id: vyd.playbook.02
  symptom_sk: Nesedí OBJ.P_VYD vs. výdajka
  first_sql_ref: vyd.sql.03
  proves_sk: 019 trace z order lines na zodpovedajúce issue lines.
  does_not_prove_sk: P_VYD ani issue-side fulfilment nie je proof of delivery.
  next_step_sk: Na OBJ side nájdi order line. Potom trace 019 cez VYD_O.RID_V = RID_O||!||ID_R a vylúč KOD_ID=204.
    Počítaj s 1:N fan-out. P_VYD znamená issue-side fulfilment, nie proof of delivery.
  flow_refs: []
  dependency_or_boundary_refs:
  - vyd.rel.line_source_polymorphic
  temporal_boundary_sk: Current diagnostika; rešpektovať explicitné history boundaries.
- playbook_id: vyd.playbook.03
  symptom_sk: Vratka / P_PRIJ nesedí
  first_sql_ref: vyd.sql.05
  proves_sk: Rozdiel medzi VYD_O.P_PRIJ a predagregovanými helper linkmi.
  does_not_prove_sk: Helper quantity nie je univerzálne totožná s P_PRIJ.
  next_step_sk: Rozlíš P_PRIJ na VYD_O od helper VYD_O_P_PRIJ. Pre 003 traceuj VYD_O.RID_V -> PRIJEMKY_OBSAH.RID_R.
    Helper agreguj po RID+ID_R. Ak ide o 021, pokračuj do RekO domény.
  flow_refs:
