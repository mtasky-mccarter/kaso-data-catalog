  symptom_sk: Výdajka stojí vo vyskladnení
  first_sql_ref: vyd.sql.01
  proves_sk: Current header, lines, state kódy a quantity bucket-y.
  does_not_prove_sk: DATUM_OK samostatne nepreukazuje warehouse state.
  next_step_sk: Najprv načítaj VYD_L + GetS_STAV_V + VYD_O quantity bucket-y. Ak state <2, kontroluj remaining_to_pick_qty.
    Ak state >=2 a WMS/UI nesedí, pokračuj WMS_QUE a T_S_VYD_L/D_VYDAJ_L flow. Nevyvodzuj stav z DATUM_OK.
  flow_refs:
