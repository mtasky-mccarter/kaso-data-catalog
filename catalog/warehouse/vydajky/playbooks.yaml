  does_not_prove_sk: Snapshot 0..1 nie je dôkaz historickej unikátnosti alebo event histórie.
  next_step_sk: Porovnaj VYD_L.MIESTO_DOD a WMS_QUE. T_VYD_L_AFTER volá C_WMS_QUE.NastavMiestoDod mimo replikácie.
