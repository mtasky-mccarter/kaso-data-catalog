    description_sk: Bind parameter :issue_rid.
    datatype_raw: null
    required: true
  result_grain_sk: Jeden VYD_L header s current WMS_QUE snapshotom.
  fanout_warning_sk: V potvrdenom snapshot-e bola cardinalita 0..1; query nepreukazuje historickú unikátnosť ani
