- sql_id: vyd.sql.07
  title_sk: CP bridge agregovaný
  sql_file: sql/diagnostic/vydajky/07-cp-bridge-agregovany.sql
  purpose_sk: CP bridge agregovaný
  input_parameters:
  - name: issue_rid
    description_sk: Bind parameter :issue_rid.
    datatype_raw: null
    required: true
  result_grain_sk: Jeden VYD_L header s agregovanými CP bridge count-mi.
  fanout_warning_sk: Agregácia CESTOVNE_PR_O po RID_V je povinná, pretože 1 454 VYD malo viac bridge riadkov.
