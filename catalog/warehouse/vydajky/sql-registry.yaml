- sql_id: vyd.sql.08
  title_sk: Anomaly detector
  sql_file: sql/diagnostic/vydajky/08-anomaly-detector.sql
  purpose_sk: Anomaly detector
  input_parameters: []
  result_grain_sk: Jeden VYD_O riadok, ktorý spĺňa aspoň jednu anomaly podmienku.
  fanout_warning_sk: Výsledok môže obsahovať viac typov odchýlok na tom istom riadku; nejde o kategorizovaný event
    log.
  proves_sk: Current snapshot odchýlok quantity bucketov a P_REZ, s KOD_ID=204 vylúčeným z P_PRIJ kontroly.
  does_not_prove_sk: P_REZ<>0 je odchýlka od testovaného snapshotu, nie dôkaz, že reservation mechanizmus je neplatný
    alebo nepoužívaný.
  evidence_refs:
