schema_version: '1.0'
kind: do-not-assume
id: op.registry.do_not_assume
records:
- rule_id: op.do_not_assume.01
  scope_refs:
  - op.object.obch_partneri
  statement_sk: ICO, DIC, DIC_NEW, EDIFACT_EAN ani NAZOV nie sú potvrdené ako unikátne identity partnera.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.02
  scope_refs:
  - op.object.obch_partneri
  statement_sk: RID nie je potvrdený ako globálne unikátny alebo replikačne stabilný medzi MC/MCCZ/TEST/TESTCZ.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.03
  scope_refs:
  - op.object.obch_partneri
  statement_sk: S_STAMP a STAV sú odlišné lifecycle/state osi.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.04
  scope_refs:
  - op.object.obch_partneri
  statement_sk: S_STAMP='0' AND ID>0 je odporúčaný bežný analytický filter, nie univerzálny application predicate.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.05
  scope_refs:
  - op.object.obch_partneri
  statement_sk: Current lookup label nie je historický snapshot labelu.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.06
  scope_refs:
  - op.object.obch_partneri
  statement_sk: Krajinu partnera neodvodzovať z krajiny mesta.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.07
  scope_refs:
  - op.object.obch_partneri
  statement_sk: MENY.NAZOV nepomenovať ako currency_name; pre kód meny používať MENY.SKRATKA.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.08
  scope_refs:
  - op.object.obch_partneri
  statement_sk: NAKUPCA nemá FK na B_USERS; soft enrichment musí byť LEFT JOIN a no-match zostáva viditeľný.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.09
  scope_refs:
  - op.object.obch_partneri
  statement_sk: OBCH_PARTNERI.DEALER_P nie je zamestnanec; ide o self-reference na partner master.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.10
  scope_refs:
  - op.object.obch_partneri
  statement_sk: PREF_KONTAKT, PREF_BANKA a PREF_MIESTO_DOD nemusia vlastniť rovnaký ID_PARTNER ako source partner;
    ownership semantics sú boundary.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.11
  scope_refs:
  - op.object.obch_partneri
  statement_sk: ZALOH_OBCH_PARTNERI nie je potvrdená kompletná autoritatívna história partnera.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.12
  scope_refs:
  - op.object.obch_partneri
  statement_sk: DATUM_VZNIKU nepoužívať na current reporting; snapshot je 100 % NULL.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.13
  scope_refs:
  - op.object.obch_partneri
  statement_sk: Oracle comment sám o sebe nepotvrdzuje business pravdu.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.14
  scope_refs:
  - op.object.obch_partneri
  statement_sk: Grant alebo synonymum je access capability, nie runtime flow.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.15
  scope_refs:
  - op.object.obch_partneri
  statement_sk: ALL_DEPENDENCIES záznam nie je automaticky reader/writer/caller rola.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.16
  scope_refs:
  - op.object.obch_partneri
  statement_sk: Lookup identity JOIN nefiltruje target cez S_STAMP='0', pokiaľ query zámerne nechce iba current
    target population.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
- rule_id: op.do_not_assume.17
  scope_refs:
  - op.object.obch_partneri
  statement_sk: OBCH_PARTNERI.ZASTUPCA a MIESTA_DODANIA.DEALER sú odlišné osi a nesmú sa zlučovať do jedného pojmu.
  consequence_sk: 'Approved status: POTVRDENÉ'
  evidence_refs:
  - op.evidence.semantic_approval.20260927
