    \ null then\n\n1005:     c_exc.raiseerrormsgid(3544); -- Nezadané parametre ! \\\\38731\n\n1006:   end if;\n\
    \n1007: \n\n1008:   if MozemZapisatCeny(pnKodID=>pnKodID, pnUser=>c_session.getuser) = 0 then\n\n1009:     return;\n\
