    \n911: \n\n912: procedure MozemVlozitSarzuNaPolohu(psPoloha varchar2, pnKodID number, psSarza varchar2, psSarzaPovolena\
    \ out varchar2, pnStav out number) is\n\n913:   sSarza varchar2(254);\n\n914:   nRozneSarzeNaPolohu number;\n\
    \n915:   SARZA_Null constant varchar2(254) := 'AFGHnjkhjkhaHKHgFGalXXXopo764565';\n\n916:   STAV_OK constant\
    \ number(1,0) := 0;\n\n917:   STAV_Chyba constant number(1,0) := 1;\n\n918: begin\n\n919:   if psPoloha is null\
    \ or pnKodID is null then\n\n920:     c_exc.raiseerrormsg('Nezadané parametre !');\n\n921:   end if;\n\n922:\
    \   -- pozriem aka sarza tovaru uz je na polohe\n\n923:   select sarza, rozne_sarze into sSarza, nRozneSarzeNaPolohu\
    \ from (\n\n924:     select distinct(sarza) sarza, (select c_flags.fgetflagsstate(psFlags=>sp.flags_b, nIndex=>4)\
    \ from sklad_polohy sp where sp.rid = lu.exp_poloha) rozne_sarze\n\n925:     from sk_log_udaje lu where lu.s_stamp\
    \ = '0' and lu.kod_id = pnKodID and lu.exp_poloha = psPoloha and lu.exp_poloha != c_const.NULA_Poloha\n\n926:\
    \     order by sarza )\n\n927:   where rownum = 1;\n\n928:   --\n\n929:   psSarzaPovolena := sSarza;\n\n930:\
    \   --\n\n931:   if nRozneSarzeNaPolohu = 0 then\n\n932:     if nvl(sSarza, SARZA_Null) = nvl(psSarza, SARZA_Null)\
    \ then\n\n933:       pnStav := STAV_OK;\n\n934:       return; -- ok mam tu istu sarzu\n\n935:     else\n\n936:\
    \       pnStav := STAV_Chyba;\n\n937:       return; -- chyba, nemozem dat inu sarzu\n\n938:     end if;\n\n\
    939:   else\n\n940:     pnStav := STAV_OK;\n\n941:     return; -- mozem dat na polohu rozne sarze tovaru\n\n\
    942:   end if;\n\n943:   exception when no_data_found then\n\n944:     pnStav := STAV_OK;\n\n945:     return;\
    \ -- ok este nemam zaznam za danu polohu a tovar\n\n946: end MozemVlozitSarzuNaPolohu;\n\n947: \n\n948: procedure\
    \ ValidT(pnState out number, psMessage out varchar2, psFieldName varchar2, psFieldValue varchar2, psPK varchar2,\
    \ psFieldParams varchar2, psFieldsSetup out varchar2) is\n\n949:     nKodId number;\n\n950:     sPoloha varchar2(254);\n\
    \n951:     sSarza varchar2(254);\n\n952:     sSortSkupina varchar2(16);\n\n953:     nStav number;\n\n954:  \
    \   nExist number;\n\n955:     sWarning varchar2(2000);\n\n956: \t\tnSkladP number;\n\n957: \t\tsTypVP_polohy\
    \ typy_velkosti_poz.id%type;\n\n958: \n\n959:     function KontrolaExpPoloha(psPoloha varchar2, pnKodId number)\
    \ return varchar2 is\n\n960:         nSkladKarta number;\n\n961:         cx xc;\n\n962:         nSirkaVyuzita\
    \ number;\n\n963:         nSirkaPolohy number;\n\n964:         nZostavaVolne number;\n\n965:     begin\n\n966:\
    \         open CX for select kod_id from sk_log_udaje where exp_poloha = psPoloha and kod_id != pnKodID and\
    \ exp_poloha != '219000000' and s_stamp = '0';\n\n967:         fetch CX into nSkladKarta;\n\n968: \n\n969: \
    \        if CX%notfound then\n\n970:             close cx;\n\n971:         else\n\n972:             close cx;\n\
    \n973:             begin\n\n974:                 select sirka_v, sirka_p, decode(sign(sirka_p-sirka_v),-1,0,sirka_p-sirka_v)\
    \ into nSirkaVyuzita, nSirkaPolohy, nZostavaVolne\n\n975:                 from (select (select sum(lu.sirka_vyuzitia)\
    \ from sk_log_udaje lu where lu.exp_poloha=sp.rid and lu.s_stamp = '0') sirka_v,\n\n976:                   \
    \           (select nvl(sum(trm.sirka),0) from typy_reg_modulov trm where trm.id = sp.typ_reg_modulu and trm.s_stamp\
    \ = '0') sirka_p\n\n977:                         from sklad_polohy sp where sp.s_stamp = '0' and sp.rid = psPoloha);\n\
    \n978:                 return GetResPar2(psKeyword=>34926, psDefaultText=>'Na skladovej karte č.: %s sa nachádza\
    \ rovnaká expedičná poloha !\\nTáto poloha má šírku %s, využitú šírku %s a voľný zostatok %s.',\n\n979:    \
    \                               psParams=>nSkladKarta || ';' || nSirkaPolohy || ';' || nSirkaVyuzita || ';'||\
    \ nZostavaVolne);\n\n980:             exception when no_data_found then\n\n981:                 null;\n\n982:\
    \             end;\n\n983:         end if;\n\n984: \n\n985:         return null;\n\n986:     end KontrolaExpPoloha;\n\
    \n987: \n\n988:     procedure KontrolaSarzaNaPolohe(psPoloha varchar2, pnKodId number, psSarza varchar2) is\n\
    \n989:         sSarzaPovolena varchar2(254);\n\n990:         nStav number;\n\n991:     begin\n\n992:       \
