    \n1080: \t\t\t\tKontrolaNaVlozenieLU(pnKodID=>nKodId, pnSkladP=>nSkladP, psSarza=>sSarza, pnRaise=>0, psWarning=>sWarning);\n\
    \n1081: \t\t\t\tif sWarning is not null then\n\n1082:           psMessage := sWarning;\n\n1083:           pnState\
    \ := c_const.VALIDATION_STATE_Warning;\n\n1084:           return;\n\n1085:         end if;\n\n1086: \t\t\tend\
    \ if;\n\n1087: \t\t\tpnState := C_CONST.VALIDATION_STATE_Ok;\n\n1088: \t\telsif psFieldName = 'SF_BALI_KUS_CAST_SKLAD'\
    \ then\n\n1089: \t\t\tif psFieldValue is not null then\n\n1090: \t\t\t\tif to_number(psFieldValue) = 1 then\n\
    \n1091: \t\t\t\t\tc_cis.SetValidTValue(psValues=>psFieldsSetup, psFieldName=>'SORT_SKUPINA_KSSetup', psFieldValue=>'M:E',\
