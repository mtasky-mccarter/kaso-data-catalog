    974: function MozemZapisatCeny(pnKodID number, pnUser number default c_session.getuser) return number is\n\n\
    975:   nINI_UrovenProdManagera number;\n\n976:   nProductManager number; nZastupca number; nJeNadriadeny number;\
    \ nJeNadriadenyZ number;\n\n977: begin\n\n978:   nINI_UrovenProdManagera := c_ini.getininum(615);\n\n979:  \
    \ if nINI_UrovenProdManagera > 0 then\n\n980:     begin\n\n981:       select id_prod_man, zastupca, c_user_vazba.JeNadriadeny(id_prod_man,\
    \ pnUser, 0), c_user_vazba.JeNadriadeny(zastupca, pnUser, 0)\n\n982:         into nProductManager, nZastupca,\
    \ nJeNadriadeny, nJeNadriadenyZ\n\n983:         from sklad_karta where id=pnKodID;\n\n984:       exception when\
    \ no_data_found then\n\n985:         return 0;\n\n986:     end;\n\n987: \n\n988:     if nProductManager = pnUser\
    \ or nZastupca = pnUser or c_user.isadmin(pnUser) > 0 or ((nJeNadriadeny = 1 or nJeNadriadenyZ = 1) and nINI_UrovenProdManagera=1)\
    \ then\n\n989:       return 1;\n\n990:     else\n\n991:       return 0;\n\n992:     end if;\n\n993:   end if;\n\
    \n994:   return 1;\n\n995: end MozemZapisatCeny;\n\n996: \n\n997: procedure ZapisObstaravaciuCenu(psID varchar2,\
    \ pnKodID number) is\n\n998:   nNakupVMene number;\n\n999:   nPocet number;\n\n1000:   nCenaM number;\n\n1001:\
