    \n1069:                 if nExist != 0 then\n\n1070:                     KontrolaSarzaNaPolohe(sPoloha, nKodId,\
    \ psFieldValue);\n\n1071:                 end if;\n\n1072:             end if;\n\n1073:         end if;\n\n\
    1074:         pnState := C_CONST.VALIDATION_STATE_Ok;\n\n1075: \t\telsif psFieldName = 'SKLAD_P' then\n\n1076:\
    \ \t\t\tif psFieldValue is not null then\n\n1077: \t\t\t\tnSkladP := to_number(psFieldValue);\n\n1078: \t\t\t\
    \tc_cis.getfieldvaluenum(psfieldname=>'KOD_ID',psvalues=>psFieldParams, pnexist=>nExist, pnvalue=>nKodId);\n\
