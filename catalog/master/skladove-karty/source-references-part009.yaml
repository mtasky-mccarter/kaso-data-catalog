    \n1030:             then\n\n1031:                 c_cis.SetValidTValue(psValues=>psFieldsSetup, psFieldName=>'SORT_SKUPINASetup',\
    \ psFieldValue=>'M:E', pnNoValid=>0);\n\n1032:                 c_cis.SetValidTValue(psValues=>psFieldsSetup,\
    \ psFieldName=>'SORT_SKUPINA', psFieldValue=>c_const.NULA_Sort_Skupina, pnNoValid=>0);\n\n1033:            \
    \     c_cis.SetValidTValue(psValues=>psFieldsSetup, psFieldName=>'TYP_VP_POLOHY', psFieldValue=>c_const.NULA_Typ_VP_Polohy,\
    \ pnNoValid=>0);\n\n1034:             else\n\n1035:                 select sort_skupina, typ_vp into sSortSkupina,\
    \ sTypVP_polohy from sklad_polohy where rid = psFieldValue;\n\n1036:                 c_cis.SetValidTValue(psValues=>psFieldsSetup,\
    \ psFieldName=>'SORT_SKUPINASetup', psFieldValue=>'M:Z', pnNoValid=>0);\n\n1037:                 c_cis.SetValidTValue(psValues=>psFieldsSetup,\
    \ psFieldName=>'SORT_SKUPINA', psFieldValue=>sSortSkupina, pnNoValid=>0);\n\n1038:                 c_cis.SetValidTValue(psValues=>psFieldsSetup,\
    \ psFieldName=>'TYP_VP_POLOHY', psFieldValue=>sTypVP_polohy, pnNoValid=>0);\n\n1039:             end if;\n\n\
    1040: \n\n1041:             sWarning := KontrolaExpPoloha(psFieldValue, nKodId);\n\n1042:             if sWarning\
    \ is not null then\n\n1043:                 psMessage := sWarning;\n\n1044:                 pnState := c_const.VALIDATION_STATE_Warning;\n\
    \n1045:                 return;\n\n1046:             end if;\n\n1047: \n\n1048:         end if;\n\n1049:   \
    \      pnState := C_CONST.VALIDATION_STATE_Ok;\n\n1050:     elsif psFieldName = 'SARZA' then\n\n1051:      \
