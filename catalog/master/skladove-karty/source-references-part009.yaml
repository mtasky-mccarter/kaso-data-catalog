    \ null then\n\n1015:           psMessage := sWarning;\n\n1016:           pnState := c_const.VALIDATION_STATE_Warning;\n\
    \n1017:           return;\n\n1018:         end if;\n\n1019: \t\t\tend if;\n\n1020:       pnState := C_CONST.VALIDATION_STATE_Ok;\n\
    \n1021:     elsif psFieldName = 'EXP_POLOHA' then\n\n1022:         c_cis.GetFieldValueNum(psfieldname=>'KOD_ID',psvalues=>psFieldParams,pnexist=>nExist,pnvalue=>nKodId);\n\
    \n1023:         if nExist != 0 then\n\n1024:             c_cis.GetFieldValue(psfieldname=>'SARZA',psvalues=>psFieldParams,pnexist=>nExist,psvalue=>sSarza);\n\
    \n1025:             if nExist != 0 then\n\n1026:                 KontrolaSarzaNaPolohe(psFieldValue, nKodId,\
