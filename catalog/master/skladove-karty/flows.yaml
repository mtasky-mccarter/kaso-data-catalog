  - pm.evidence.handoff
  - pm.evidence.pm-04f_0eff0ebf
  calls: []
  direct_mutations:
  - scope_refs:
    - pm.object.sk_nakl_polozky
    description_sk: 'Uses component HMOTNOST_NETTO times BOM POCET (can include norm loss), DU7 split and CZ;SK
      tokens. Deletes product+NK_ID then inserts per component/token: overwrite instead of aggregation. DQ-COEF-001..006
      remain incidents; do not normalize away.'
