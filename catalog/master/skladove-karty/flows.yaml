- flow_id: pm.flow.end_of_sale
  trigger_or_procedure_ref: pm.oracle.mc.t_sklad_karta_stav_after_mc.trigger
  event_sk: AFTER UPDATE OF STAV
  condition_sk: OLD.STAV <> 8 AND NEW.STAV = 8
  session_or_bypass_sk: 'C_Session.GetReplikacia: replication returns early.'
  business_effect_sk: 'Calls MCCARTER_PLAN.MC_UKONCENY_PREDAJ_SK(NEW.ID). Current/future OBCH_PL_O forecast types
    OPTyp_Prognoza / OPTyp_PrognPartn: PLAN_POCET2=0 and POZN beginning Ukončený predaj with date and original quantity.
    POZN is part of the executable bypass contract.'
  evidence_refs:
  - pm.evidence.handoff
  - pm.evidence.pm-12a
  calls:
  - callee_ref: pm.oracle.mc.mccarter_plan.package_body
    sequence: 1
  side_effects:
  - scope_refs:
    - pm.boundary_field.obch_pl_o.plan_pocet2
    - pm.boundary_field.obch_pl_o.pozn
    description_sk: 'Calls MCCARTER_PLAN.MC_UKONCENY_PREDAJ_SK(NEW.ID). Current/future OBCH_PL_O forecast types
      OPTyp_Prognoza / OPTyp_PrognPartn: PLAN_POCET2=0 and POZN beginning Ukončený predaj with date and original
      quantity. POZN is part of the executable bypass contract.'
- flow_id: pm.flow.forecast_lock
  trigger_or_procedure_ref: pm.oracle.mc.t_obch_pl_lock_mc.trigger
  event_sk: AFTER INSERT OR UPDATE OF PLAN_POCET2
  condition_sk: Changed PLAN_POCET2; NVL(OLD.POZN,'xyz') != NVL(NEW.POZN,'xyz') AND NEW.POZN LIKE '%Ukončený predaj%'
    recognizes specific marker.
  session_or_bypass_sk: Simultaneous changed POZN marker only; lock not removed.
  business_effect_sk: POTVRDENÉ — VYRIEŠENÉ as of 2026-09-16 MC. Dedicated note exception bypasses this guard; ordinary
    changed PLAN_POCET2 on BITAND(NEW.STAV,2)=2 still raises locked-period error. Existing (+%)/(-%) transfer exceptions
    and insert-time protection unchanged. Not a global lock bypass.
  evidence_refs:
  - pm.evidence.handoff
  - pm.evidence.pm-12a
  calls: []
  direct_mutations: []
  exceptions:
  - scope_refs:
    - pm.boundary_field.obch_pl_o.plan_pocet2
    description_sk: POTVRDENÉ — VYRIEŠENÉ as of 2026-09-16 MC. Dedicated note exception bypasses this guard; ordinary
      changed PLAN_POCET2 on BITAND(NEW.STAV,2)=2 still raises locked-period error. Existing (+%)/(-%) transfer
      exceptions and insert-time protection unchanged. Not a global lock bypass.
- flow_id: pm.flow.end_of_sale_reset
  trigger_or_procedure_ref: pm.oracle.mc.mccarter_plan.package_body
  event_sk: MC_UKONCENY_PREDAJ_SK(SK.ID)
  condition_sk: Matching SKU; current week-period forward; OBCH_PL_L.TYP_PLANU in OPTyp_Prognoza / OPTyp_PrognPartn.
  session_or_bypass_sk: null
  business_effect_sk: Directly sets OBCH_PL_O.PLAN_POCET2=0 and POZN beginning Ukončený predaj with date and original
    quantity; the simultaneous note change is required by the dedicated lock exception.
  evidence_refs:
  - pm.evidence.handoff
  - pm.evidence.pm-12a
  calls: []
  direct_mutations:
  - scope_refs:
    - pm.boundary_field.obch_pl_o.plan_pocet2
    - pm.boundary_field.obch_pl_o.pozn
    description_sk: Directly sets OBCH_PL_O.PLAN_POCET2=0 and POZN beginning Ukončený predaj with date and original
      quantity; the simultaneous note change is required by the dedicated lock exception.
- flow_id: pm.flow.bom_coefficients
  trigger_or_procedure_ref: pm.oracle.mc.mccarter.package_body
  event_sk: imp_SK_NAKL_POL_VYR
  condition_sk: Active BOM rows; executable finished-product INT_KOD prefix 3; DU8/DU9 tokens.
  session_or_bypass_sk: null
  business_effect_sk: 'Uses component HMOTNOST_NETTO times BOM POCET (can include norm loss), DU7 split and CZ;SK
    tokens. Deletes product+NK_ID then inserts per component/token: overwrite instead of aggregation. DQ-COEF-001..006
    remain incidents; do not normalize away.'
