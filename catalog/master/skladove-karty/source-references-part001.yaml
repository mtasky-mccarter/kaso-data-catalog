    \ end GetCenaVP;\n\n3148: \n\n3149: function GetCenaFIX(pnKod_id number, pnU_typ number default null, pdtDatCeny\
    \ date default c_session.getdtsysdate, psID_SZ varchar default '0000',\n\n3150:   pnRaise number default 1)\
    \ return number\n\n3151: is\n\n3152:   --  fixna cena prebija ine ceny\n\n3153:     --  vrati null ak - nie\
    \ je povolena fixna cena - nenaslo ju v cenniku - neexistuje validny cennik z validneho uctovneho typu na validnej\
    \ skladovej karte\n\n3154:   nCena number; nCennikID number; nU_typ number;\n\n3155:   sExc varchar2(254) :=\
    \ getres2('Prerušené hľadanie fixnej ceny!'||c_const.t||'38914')||chr(13);\n\n3156: begin\n\n3157: \n\n3158:\
    \   if c_session.GetFixCenaZCennikaUTypu = 1 then -- cennik z uct_typu SK\n\n3159:     begin\n\n3160:      \
    \ select u.id,\n\n3161:         u.cennik_prijem as CennikID,\n\n3162:         (select c_cennik_popis.getcenucennika_c(pnidcennik=>c.id,\n\
    \n3163:             p_nkodid=>pnKod_id, p_sid_sz=>psID_SZ, p_dtdatceny=>pdtDatCeny, pr_nmenain=>0,\n\n3164:\
    \             p_nkurzin=>1, p_bpodlacennikaround=>1, p_bpodlacennikasdph=>0, pndodavatel=>0)--, pnrekurzia=>?,\
    \ pnsklad=>?\n\n3165:           from cenniky_popis c where u.cennik_prijem = c.id and c.s_stamp='0' and c.id>0)\
    \ as Cena\n\n3166:         into nU_typ, nCennikID, nCena from sklad_karta sk, ucty_sk u\n\n3167:         where\
    \ sk.id = pnKod_id and nvl(pnU_typ, sk.t_tovaru) = u.id;\n\n3168: \n\n3169:         if pnRaise=1 then\n\n3170:\
    \           if nCennikID is null then\n\n3171:           -- kontrola na zadanie cennika fixnej ceny\n\n3172:\
    \             c_exc.raiseerrormsg(sExc||getres2('Nie je zadaný cenník fixnej ceny pre príjem.'||chr(13)||'(id\
    \ účtovného typu)'||c_const.t||'38915')||chr(13)\n\n3173:               ||'('||nU_typ||')');\n\n3174:      \
    \     elsif nCena is null then\n\n3175:           -- kontrola na null\n\n3176:             c_exc.raiseerrormsg(sExc||getres2('Nulová\
    \ cena. Skontrolujte parametre časového cenníka.'||chr(13)||'(id cenníka, sk.karta, u_typ, datum_ceny)'||c_const.t||'38916')||chr(13)\n\
    \n3177:               ||'('||nCennikID||', '||pnKod_id||', '||nU_typ||', '||to_char(pdtDatCeny,'DD.MM.YYYY')||')');\n\
    \n3178:           elsif nCena = 0 then\n\n3179:           -- kontrola na 0\n\n3180:             select 0 into\
    \ nCena from dual\n\n3181:               where c_cas_cennik_l.ExistsCena(pncennikid=>nCennikID, pdtdatceny=>pdtDatCeny,\
    \ pnkod_id=>pnKod_id)=1;\n\n3182:           end if;\n\n3183:         end if;\n\n3184: \n\n3185:         return\
    \ nCena;\n\n3186: \n\n3187:       exception when no_data_found then\n\n3188:         if pnRaise=1 then\n\n3189:\
    \           if nCena = 0 then\n\n3190:           -- kontrola na 0\n\n3191:             c_exc.raiseerrormsg(sExc||getres2('Skladová\
    \ karta nemá zadanú fixnú cenu pre zadefinovaný časový cenník.'||chr(13)||'(id cenníka, sk.karta, u_typ, datum_ceny)'||c_const.t||'38917')||chr(13)\n\
    \n3192:               ||'('||nCennikID||', '||pnKod_id||', '||nU_typ||', '||to_char(pdtDatCeny,'DD.MM.YYYY')||')');\n\
    \n3193:           else\n\n3194:             c_exc.raiseerrormsg(sExc||getres2('Skontrolujte stornovanie skladovej\
    \ karty alebo jej účtovného typu.'||chr(13)||'(sk.karta, u_typ)'||c_const.t||'38918')||chr(13)\n\n3195:    \
    \           ||'('||pnKod_id||','||pnU_typ||')');\n\n3196:           end if;\n\n3197:         end if;\n\n3198:\
    \     end;\n\n3199:   end if;\n\n3200: \n\n3201:   return null;\n\n3202: \n\n3203: end GetCenaFIX;\n\n3204:\
    \ \n\n3205: -- funkcia vrati tabulku pozicii celej vetvy stromu nahor od vstupnej zadanej pozicie\n\n3206: function\
    \ GetTovarTypPathOne(psTovarTyp varchar2) return MXTABLE pipelined\n\n3207: is\n\n3208:   sTyp varchar2(254);\n\
    \n3209:   ni number :=1;\n\n3210: begin\n\n3211:   sTyp := psTovarTyp;\n\n3212:   loop\n\n3213:     pipe row\
    \ (sTyp);\n\n3214:     ni:=length(sTyp)-2;\n\n3215:     sTyp := substr(sTyp, 1, ni);\n\n3216:     exit when\
    \ ni = 0;\n\n3217:   end loop;\n\n3218: end GetTovarTypPathOne;\n\n3219: \n\n3220: -- funkcia vrati tabulku\
    \ pozicii vsetkych vetiev stromu nahor od pozicii danych podmienkou na SK\n\n3221: function GetTovarTypPath(psTovarTypPodm\
    \ varchar2) return MXTABLE pipelined\n\n3222: is\n\n3223:   sTypT_Distinct varchar2(254);\n\n3224:   sTypT varchar2(254);\n\
    \n3225:   ni number;\n\n3226:   cx XC;\n\n3227: begin\n\n3228:   -- psTovarTypPodm je select v tvare (select\
    \ sk.sk_id from sklad_karta sk where 1=1  AND ...podmienka...)\n\n3229:   if psTovarTypPodm is null then return;\
    \ end if;\n\n3230:   dbms_output.put_line('psTovarTypPodm '||psTovarTypPodm);\n\n3231:   -- hladam strom podla\
    \ podmienky\n\n3232:   open cx for 'select distinct(skk.typ_t) from sklad_karta skk where skk.id in ('||psTovarTypPodm||')';\n\
    \n3233:   loop\n\n3234:     fetch cx into sTypT_Distinct;\n\n3235:     exit when cx%notfound;\n\n3236:     dbms_output.put_line('distinct\
    \ t_typ '||sTypT_Distinct);\n\n3237:     -- parsujem polozku stromu na jednotlive urovne\n\n3238:     sTypT\
    \ := sTypT_Distinct;\n\n3239:     loop\n\n3240:       dbms_output.put_line('Vkladam do tabulky ... '||sTypT);\n\
    \n3241:       pipe row (sTypT);\n\n3242:       ni:=length(sTypT)-2;\n\n3243:       exit when ni = 0;\n\n3244:\
    \       sTypT := substr(sTypT, 1, ni);\n\n3245:     end loop;\n\n3246:   end loop;\n\n3247:   close cx;\n\n\
    3248: end GetTovarTypPath;\n\n3249: \n\n3250: function GetPravoUzivatela(pnKodID number, pnUser number default\
    \ c_session.getuser) return number is\n\n3251: -- Funkcia vracia povolenie nad skladovou kartou aktuálnemu užívateľovi\
    \ na  2 - zápis, 1 - čítanie, 0 - zakázaný prístup (615 INI_SKLAD_KARTA_UROVEN_PROD_MAN)\n\n3252: begin\n\n\
    3253:   if g_nINI_UrovenProdManagera is null then\n\n3254:     g_nINI_UrovenProdManagera := c_ini.getininum(615);\n\
    \n3255:   end if;\n\n3256:   if g_nINI_UrovenProdManagera > 0 then\n\n3257:     if pnKodID!=g_nKodID or g_nKodID\
    \ is null then\n\n3258:       begin\n\n3259:         select id, id_prod_man, zastupca, c_user_vazba.JeNadriadeny\
    \ ( id_prod_man, pnUser, 0 ),\n\n3260:           c_user_vazba.JeNadriadeny ( zastupca, pnUser, 0 )\n\n3261:\
    \           into g_nKodID,g_nProductManager, g_nZastupca, g_nJeNadriadeny, g_nJeNadriadenyZ\n\n3262:       \
    \    from sklad_karta where id=pnKodID;\n\n3263:         exception when no_data_found then return 0;\n\n3264:\
    \       end;\n\n3265:     end if;\n\n3266:     if g_nProductManager = pnUser or g_nZastupca = pnUser or c_user.isadmin(pnUser)\
    \ > 0 or g_nJeNadriadeny = 1 or g_nJeNadriadenyZ = 1 then\n\n3267:       return 2;\n\n3268:     elsif g_nINI_UrovenProdManagera\
    \ = 1 then\n\n3269:       return 1;\n\n3270:     else\n\n3271:       return 0;\n\n3272:     end if;\n\n3273:\
    \   end if;\n\n3274:   return 2;\n\n3275: end GetPravoUzivatela;\n\n3276: \n\n3277: procedure ZmenaStavuSkladovejKarty(pnKodID\
