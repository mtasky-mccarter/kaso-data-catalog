    \n7572: \trPB.kamion := 24*rPB.paleta;\n\n7573: \n\n7574: \t-- nastav riadky pre konkretne balenia\n\n7575:\
    \ \tfor rTB in 1..6 loop\n\n7576: \t\tSetRowBalSK(pnTypBal=>rTB, prPB=>rPB, prPCT=>rPCT, pnKodID=>pnKOD_ID);\n\
    \n7577: \tend loop;\n\n7578: \n\n7579: \t-- hladam CT ktora vyhovuje pre balenie so vstupnym poctom\n\n7580:\
