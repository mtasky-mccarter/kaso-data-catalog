    \             return 0;\n\n3427:         end if;\n\n3428:     end NazovNemaMedzery;\n\n3429: \n\n3430: begin\n\
    \n3431:     --pnState := c_const.VALIDATION_State_NotSolved;\n\n3432:     pnState := c_const.VALIDATION_STATE_Ok;\n\
    \n3433:     if psFieldName = 'INT_KOD' then\n\n3434:         if psFieldValue is not null then\n\n3435:     \
    \        if ExistsIntKod(psFieldValue, to_number(psPK)) != 0 then\n\n3436:                 psMessage := 'Interný\
    \ kód ' || psFieldValue || ' je už raz zadaný !';\n\n3437:                 pnState := c_const.VALIDATION_STATE_Error;\n\
    \n3438:                 return;\n\n3439:             end if;\n\n3440:         else\n\n3441:             c_cis.getfieldvalue(psfieldname=>'DOD_KOD',\
    \ psvalues=>psFieldParams, pnexist=>nExist, psvalue=>sHodnota);\n\n3442:             if nExist != 0 then\n\n\
    3443:                 c_cis.SetValidTValue(psValues=>psFieldsSetup, psFieldName=>'INT_KOD', psFieldValue=>sHodnota,\
    \ pnNoValid=>0);\n\n3444:             end if;\n\n3445:         end if;\n\n3446:         pnState := c_const.VALIDATION_STATE_Ok;\n\
    \n3447:     elsif psFieldName = 'OBCH_ZNACKA' then\n\n3448:         if psFieldValue is not null then\n\n3449:\
    \             c_cis.getfieldvaluenum(psfieldname=>'VYROBCA', psvalues=>psFieldParams, pnexist=>nExist, pnvalue=>nVyrobca);\n\
