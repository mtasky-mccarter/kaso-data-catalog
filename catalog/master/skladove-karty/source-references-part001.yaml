    \    and ( sk.obch_znacka = decode('''||psObchZnacka||''', ''0000'', sk.obch_znacka, '''||psObchZnacka||''')\
    \ )\n\n5089:       and ( sk.cen_skupina = decode('||pnRabSkupina||', -1, sk.cen_skupina, '||pnRabSkupina||')\
    \ )\n\n5090:       and ( (sk.flags = nvl('''||psFlags||''', sk.flags)) or (sk.flags like '''||psFlags||'%''\
    \ ) )';\n\n5091:   end if;\n\n5092:   --dbms_output.put_line('sPodmSK: '||sPodmSK);\n\n5093:   return sPodmSK;\n\
    \n5094: end GetPodmSK;\n\n5095: \n\n5096: function JeZaradenaDoCasCennika(pnKodID number, pnCennik number, pdtDatumCeny\
