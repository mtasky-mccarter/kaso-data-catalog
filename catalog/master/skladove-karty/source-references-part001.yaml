    \ number;\n\n3385:     nPolicaPS number;\n\n3386:     nMinZasoba number;\n\n3387:     sPredSektor varchar2(254);\n\
    \n3388: \n\n3389:     nClo number;\n\n3390:     nPrirazka number;\n\n3391: \n\n3392:     cx XC;\n\n3393:   \
    \  nUrovenDph number;\n\n3394:     nDphPreSklad number;\n\n3395:     typ_ps varchar2(16);\n\n3396: \n\n3397:\
    \     function KontrolaExpPolohy(psExpPoloha varchar2, pnHlasit number default 1) return number is\n\n3398:\
    \         nKodId number;\n\n3399:         nSirkaVyuzita number;\n\n3400:         nSirkaPolohy number;\n\n3401:\
    \         nZostavaVolne number;\n\n3402:     begin\n\n3403:         select kod_id into nKodId from sk_log_udaje\
    \ where exp_poloha = psExpPoloha and exp_poloha != '219000000' and s_stamp ='0';\n\n3404: \n\n3405:        \
    \ select sirka_v, sirka_p, decode(sign(sirka_p-sirka_v),-1,0,sirka_p-sirka_v) into nSirkaVyuzita, nSirkaPolohy,\
    \ nZostavaVolne from (select\n\n3406:                     (select sum(lu.sirka_vyuzitia) from sk_log_udaje lu\
    \ where lu.exp_poloha=sp.rid and lu.s_stamp = '0') sirka_v,\n\n3407:                     (select nvl(sum(trm.sirka),0)\
    \ from typy_reg_modulov trm where trm.id = sp.typ_reg_modulu and trm.s_stamp = '0') sirka_p\n\n3408:       \
    \          from sklad_polohy sp where sp.s_stamp = '0' and sp.rid = psExpPoloha);\n\n3409: \n\n3410:       \
    \  if pnHlasit = 1 then\n\n3411:             c_exc.raiseerrormsgid(pnidmsg=>3279,psparams=>nKodId || ';' ||\
    \ nSirkaPolohy || ';' || nSirkaVyuzita || ';' || nZostavaVolne);\n\n3412:         end if;\n\n3413:         return\
    \ 0;\n\n3414: \n\n3415:         exception when no_data_found then\n\n3416:             return 1;\n\n3417:  \
    \   end KontrolaExpPolohy;\n\n3418: \n\n3419:     function NazovNemaMedzery return number is\n\n3420:      \
    \   nNemazMedzery number;\n\n3421:     begin\n\n3422:         nNemazMedzery := nvl(c_ini.GetIniNum(pid=>495),\
