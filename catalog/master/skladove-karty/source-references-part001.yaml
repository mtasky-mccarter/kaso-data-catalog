    3301:     end if;\n\n3302:     return 0;\n\n3303: end JeMnozstvoMVM;\n\n3304: \n\n3305: function JeVymenovanaSarza(pnKodID\
    \ number, psSarza varchar2 default null) return number is\n\n3306:   -- vymenovane sarze 0 - vypnute , 1 - zapnute\
    \ OK, 2 - zapnute CHYBA\n\n3307:   -- ak psSarza is null tak vratim stav vymenovane sarze (0 - vypnute, 1 -\
    \ zapnute)\n\n3308:   sSkala varchar2(16);\n\n3309:   nVymenSarza number;\n\n3310:   nExists number;\n\n3311:\
    \ begin\n\n3312: \n\n3313:   select skala, (select substr(u.flags_b,1,1) from ucty_sk u where u.id=sklad_karta.t_tovaru)\
    \ vymenovana_sarza,\n\n3314:     (select 1 from sklad_skaly_o where s_stamp='0' and rid_o = sklad_karta.skala\
    \ and psSarza is not null and nazov_s=psSarza and rownum=1) nExists\n\n3315:     into sSkala, nVymenSarza, nExists\
    \ from sklad_karta where id = pnKodID;\n\n3316:   -- vymenovane sarzovanie je vypnute\n\n3317:   if nVymenSarza\
    \ = 0 then\n\n3318:     return 0;\n\n3319:   -- vymenovane sarzovanie\n\n3320:   elsif psSarza is null then\n\
    \n3321:     return nVymenSarza;\n\n3322:   -- vymenovane sarzovanie je zapnute, ale sarza sa nenasla v zozname\n\
    \n3323:   elsif nExists is null then\n\n3324:     return 2;\n\n3325:   -- vymenovane sarzovanie je zapnute a\
    \ sarza sa nasla v zozname\n\n3326:   else\n\n3327:     return 1;\n\n3328:   end if;\n\n3329: \n\n3330: end\
    \ JeVymenovanaSarza;\n\n3331: \n\n3332: function DajVymenovaneSarze(pnKodID number) return varchar2 is\n\n3333:\
    \   -- vymenovane sarze (null - vypnute)\n\n3334:   sSkala varchar2(16);\n\n3335:   nVymenSarza number;\n\n\
    3336:   sSarze varchar2(2000);\n\n3337: begin\n\n3338: \n\n3339:   select skala, (select substr(u.flags_b,1,1)\
    \ from ucty_sk u where u.id=sklad_karta.t_tovaru) vymenovana_sarza,\n\n3340:     s2t('select nazov_s from sklad_skaly_o\
    \ where s_stamp=''0'' and rid_o = :x group by nazov_s order by min(poradie)',sklad_karta.skala,',') sarze\n\n\
    3341:     into sSkala, nVymenSarza, sSarze from sklad_karta where id = pnKodID;\n\n3342:   -- vymenovane sarzovanie\
    \ je vypnute\n\n3343:   if nVymenSarza = 0 then\n\n3344:     return null;\n\n3345:   -- vymenovane sarzovanie\
    \ je zapnute, vratim zoznam\n\n3346:   else\n\n3347:     return sSarze;\n\n3348:   end if;\n\n3349: \n\n3350:\
    \ end DajVymenovaneSarze;\n\n3351: \n\n3352: function GetSkladKartaZaSklad return number is\n\n3353:     nKartaZaSklad\
    \ number;\n\n3354: begin\n\n3355:     nKartaZaSklad := c_ini.getini_oldnum('SETUP', 'SKLAD_KARTA_ZA_SKLAD',\
    \ c_session.getlokacia);\n\n3356:     return nKartaZaSklad;\n\n3357: end GetSkladKartaZaSklad;\n\n3358: \n\n\
    3359: function ExistsIntKod(psIntKod varchar2, pnSkId number) return number is\n\n3360:     nExists number;\n\
    \n3361: begin\n\n3362:     if pnSkId is not null then\n\n3363:         SELECT count(*) into nExists FROM SKLAD_KARTA\
    \ WHERE INT_KOD = psIntKod AND ID != pnSkId AND SKLAD = trunc( pnSkId / C_SKLAD_KARTA.MAXID);\n\n3364:     else\n\
    \n3365:         SELECT count(*) into nExists FROM SKLAD_KARTA WHERE INT_KOD = psIntKod AND SKLAD = C_SKLAD_KARTA.GetSkladKartaZaSklad;\n\
    \n3366:     end if;\n\n3367: \n\n3368:     return nExists;\n\n3369: end ExistsIntKod;\n\n3370: \n\n3371: procedure\
    \ ValidT(pnState out number, psMessage out varchar2, psFieldName varchar2, psFieldValue varchar2, psPK varchar2,\
