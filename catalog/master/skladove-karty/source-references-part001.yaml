    \ psAliasTable=>'SK');\n\n3898: end HromadnaUpravaSK;\n\n3899: \n\n3900: procedure SetNavrhovanyDodavatel(pnVyber\
    \ number, pnCena number, pnDni number, pnUpred_Sklad number, pnUpred_Dod number, psPodmienka varchar2 default\
    \ null, psPK varchar2 default null) is\n\n3901:     sPodmienka varchar2(32000);\n\n3902:     cx xc;\n\n3903:\
    \     nSK_ID number;\n\n3904:     nOptDod number;\n\n3905: begin\n\n3906:     if pnVyber = 0 then\n\n3907: \
    \        sPodmienka := ' AND SK.ID in (' || psPK || ')';\n\n3908:     elsif pnVyber = 1 then\n\n3909:      \
    \   sPodmienka := psPodmienka;\n\n3910:     elsif pnVyber = 2 then\n\n3911:         sPodmienka := '';\n\n3912:\
    \     else\n\n3913:         c_exc.raiseerrormsg('Nesprávne zadaný výber!');\n\n3914:     end if;\n\n3915: \n\
    \n3916:     open cx for 'select ID from SKLAD_KARTA SK where 1 = 1 ' || sPodmienka;\n\n3917:     loop\n\n3918:\
    \         fetch cx into nSK_ID;\n\n3919:         exit when cx%notfound;\n\n3920:         nOptDod := C_SKLAD_KARTA.GetOptimalnyDodavatel\
    \ (pnKod_id=>nSK_ID, pnPouziCennik=>pnCena, pnCennikStarsiAkoDni=>pnDni, pnUprednostniSkladom=>pnUpred_Sklad,\n\
    \n3921:                 pnUprednostniTuzemskeho=>pnUpred_Dod);\n\n3922:         Update Sklad_karta Set dod_sk_n\
    \ = nOptDod Where ( dod_sk_n != nOptDod Or dod_sk_n Is Null )  And id = nSK_ID;\n\n3923:     end loop;\n\n3924:\
    \     close cx;\n\n3925: end SetNavrhovanyDodavatel;\n\n3926: \n\n3927: procedure SetHlavnyDodavatel(pnVyber\
    \ number,psPodmienka varchar2 default null, psPK varchar2 default null) is\n\n3928:     sPodmienka varchar2(32000);\n\
    \n3929:     sUpdate varchar2(32000);\n\n3930: begin\n\n3931:     if pnVyber = 0 then\n\n3932:         sPodmienka\
    \ := ' AND SK.ID in (' || psPK || ')';\n\n3933:     elsif pnVyber = 1 then\n\n3934:         sPodmienka := psPodmienka;\n\
    \n3935:     elsif pnVyber = 2 then\n\n3936:         sPodmienka := '';\n\n3937:     else\n\n3938:         c_exc.raiseerrormsg('Nesprávne\
    \ zadaný výber!');\n\n3939:     end if;\n\n3940: \n\n3941:     sUpdate := 'Update Sklad_karta sk Set dod_sk\
    \ = dod_sk_n  Where dod_sk != dod_sk_n ' || sPodmienka;\n\n3942:     execute immediate sUpdate;\n\n3943: end\
    \ SetHlavnyDodavatel;\n\n3944: \n\n3945: procedure PrepocitajCenniky(pnKodID number) is\n\n3946:   TYPE tXKoef\
    \ IS TABLE OF varchar2(254);\n\n3947:   rKoef tXKoef := tXKoef();\n\n3948:   TYPE tXCena IS TABLE OF number;\n\
    \n3949:   rCena tXCena := tXCena();\n\n3950: begin\n\n3951:   if pnKodID is null then\n\n3952:     c_exc.RaiseErrorMsgId(3544);\
    \ -- Nezadané parametre ! \\\\38731\n\n3953:   end if;\n\n3954:   rKoef.extend(7);\n\n3955:   rCena.extend(7);\n\
    \n3956:   --\n\n3957:   select rs.k_1, rs.k_2, rs.k_3, rs.k_4, rs.k_5, rs.k_6, rs.k_7\n\n3958:   into rKoef(1),\
    \ rKoef(2), rKoef(3), rKoef(4), rKoef(5), rKoef(6), rKoef(7) from sklad_cs rs\n\n3959:   where rs.id = (select\
    \ sk.cen_skupina from sklad_karta sk where sk.id = pnKodID);\n\n3960:   -- idem po cennikoch\n\n3961:   for\
    \ cennik in 1 .. 7 loop\n\n3962:     dbms_output.put_line('koef '||rKoef(cennik));\n\n3963:     if rKoef(cennik)\
    \ is null then\n\n3964:       rCena(cennik) := 0;\n\n3965:     else\n\n3966:       rCena(cennik) := cenotvorba.GetCenuExpresionC(p_sExpr=>rKoef(cennik),\
    \ p_nKodID=>pnKodID, p_sID_SZ=>C_CONST.NULA_SkladZasob,\n\n3967:         p_dtDatCeny=>trunc(sysdate), p_nVstupCena=>0,\
    \ p_bPodlaCennikaRound=>1);\n\n3968:     end if;\n\n3969:     dbms_output.put_line('Cena '||rCena(cennik));\n\
    \n3970:   end loop;\n\n3971:   --\n\n3972:   update sklad_karta set C_1 = rCena(1), C_2 = rCena(2), C_3 = rCena(3),\
    \ C_4 = rCena(4), C_5 = rCena(5), C_6 = rCena(6), C_7 = rCena(7) where id = pnKodID;\n\n3973: end PrepocitajCenniky;\n\
    \n3974: \n\n3975: function GetSkladVydaja(pnSklad number, pnKodID number, psSarza varchar2 default null, pnCheckLokaciu\
    \ number default 1) return number is\n\n3976:   nSkladV number;\n\n3977: begin\n\n3978: \tnSkladV := c_sk_log_udaj.GetSkladVydaja(pnKodID=>pnKodID,\
    \ pnSkladP=>pnSklad, psSarza=>psSarza);\n\n3979: \tif nSkladV is not null then\n\n3980: \t\tif pnCheckLokaciu\
    \ = 1 then\n\n3981: \t\t\tbegin\n\n3982: \t\t\t\tselect bp.id into nSkladV from bartex_pobocky bp where bp.id\
    \ = nSkladV and bp.s_stamp = '0'\n\n3983: \t      and bp.lokacia = c_session.getlokacia and bp.typ in ( 0, 1,\
    \ 2 );\n\n3984: \t\t\texception when no_data_found then\n\n3985: \t\t\t\tnSkladV := pnSklad;\n\n3986: \t\t\t\
    end;\n\n3987: \t\tend if;\n\n3988: \telse\n\n3989: \t\tnSkladV := pnSklad;\n\n3990: \tend if;\n\n3991: \t/*\n\
    \n3992:   begin\n\n3993:     -- hladam za pnSklad, pnKodID a psSarza\n\n3994:     select sklad_v into nSkladV\
