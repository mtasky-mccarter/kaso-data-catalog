    \n1492: \n\n1493: procedure GetInfoSK( pnKOD_ID number, psINT_KOD IN OUT varchar2, psNazov IN OUT varchar2,\
    \ psPomenovanie IN OUT varchar2)\n\n1494: is\n\n1495: begin\n\n1496:   select INT_KOD, NAZOV, POMENOVANIE into\
