    \ no_data_found then null;\n\n1499: end GetInfoSK;\n\n1500: \n\n1501: function GetTYP_PS( pnKOD_ID number) return\
    \ varchar2 is\n\n1502:   sRet varchar2(16);\n\n1503: begin\n\n1504:   select TYP_PS into sRet from SKLAD_KARTA\
    \ where id = pnKOD_ID;\n\n1505:   return sRet;\n\n1506: end GetTYP_PS;\n\n1507: \n\n1508: \n\n1509: function\
    \ NajdiSkupinyTP ( psID_TovarTyp varchar2 )return number is\n\n1510: sRID_SKUP varchar2(16);\n\n1511: bDEDIT\
    \ number;\n\n1512: sID_TovarTypParent varchar2(16);\n\n1513: nOk number;\n\n1514: \n\n1515: begin\n\n1516: \
    \  SELECT RID_STP, DEDIT INTO sRID_SKUP,  bDEDIT FROM TOVAR_TYP WHERE  ID = psID_TovarTyp ;\n\n1517:   sID_TovarTypParent\
    \ := substr( psID_TovarTyp, 1, Length( psID_TovarTyp) - 2 );\n\n1518:   -- ak mam dedit TP z parenta, pouzijem\
