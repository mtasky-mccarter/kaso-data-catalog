    \           psKOD_O=>psKOD_O);\n\n5665:             if pnCommit = 1 then\n\n5666:                 commit;\n\n\
    5667:             end if;\n\n5668:         end loop;\n\n5669:     end if;\n\n5670: end GenerujPriceProtecting;\n\
