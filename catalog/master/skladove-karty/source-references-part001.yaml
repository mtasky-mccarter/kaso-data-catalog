    \ where sk.id = :psPK' into sFlagDB, sFlagNew using psPK;\n\n7011: \t\t\tnFB_KontrolaVeku := GetFB_KontrolaVeku(psFlags_b=>sFlagNew);\n\
    \n7012: \t\t\tif nFB_KontrolaVeku <> to_number(sFlagDB) then\n\n7013: \t\t\t\tbZmenaFB_KontrolaVeku := true;\n\
    \n7014: \t\t\tend if;\n\n7015: \t\tend if;\n\n7016: \n\n7017:     if sValues is not null then\n\n7018:     \
