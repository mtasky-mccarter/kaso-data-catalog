    \n7724: \t\treturn;\n\n7725: \tend if;\n\n7726: \t--\n\n7727: \tif pnVytvorPrikaz = 1 then\n\n7728: \t\tc_stahovacka_que.VYTVORPRíKAZYOUT(prID=>\
