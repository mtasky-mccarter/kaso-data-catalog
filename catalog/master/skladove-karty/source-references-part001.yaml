    \ nIndex=>FLAGS_B_KontrolaVeku, psState=>'0')\n\n7035: \t\t\t\t\twhere sk.id = to_number(psPK) and GetFB_KontrolaVeku(psFLAGS_B=>sk.flags_b)\
    \ != 0;\n\n7036: \t\t\tend if;\n\n7037: \t\telse\n\n7038: \t\t\t-- menim flags_b 47. Kontrola veku +18\n\n7039:\
    \ \t\t\tif bZmenaFB_KontrolaVeku then\n\n7040: \t\t\t\tif nFB_KontrolaVeku = 1 then\n\n7041: \t\t\t\t\t-- zapinam\
    \ flags_b 47. Kontrola veku +18 => nastavim vek_hranica = 18\n\n7042: \t\t\t\t\tupdate sklad_karta sk set sk.vek_hranica\
    \ = 18 where sk.id = to_number(psPK) and sk.vek_hranica = 0;\n\n7043: \t\t\t\telse\n\n7044: \t\t\t\t\t-- vypinam\
    \ flags_b 47. Kontrola veku +18 => nastavim vek_hranica = 0\n\n7045: \t\t\t\t\tupdate sklad_karta sk set sk.vek_hranica\
    \ = 0 where sk.id = to_number(psPK) and sk.vek_hranica != 0;\n\n7046: \t\t\t\tend if;\n\n7047: \t\t\tend if;\n\
    \n7048: \t\tend if;\n\n7049: end UpdateT;\n\n7050: \n\n7051: \n\n7052: function GetDod_Kod(pnkod_id number,\
