    \ := psPODMIENKA;\n\n5645:         end if;\n\n5646:     elsif pnVyber = 2 then\n\n5647:         sPodmSk := '\
    \ SK.S_STAMP = ''0'' ';\n\n5648:     else\n\n5649:         c_exc.raiseerrormsg('Nesprávne zadaný výber!');\n\
