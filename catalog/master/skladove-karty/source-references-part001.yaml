    \ then\n\n1461:     -- ak bezim cez doklad, ktory prijima tovar\n\n1462:       If To_number( NVL(SUBSTR( psFlags_B_SZ,\
    \ 1, 1), '0')) = 1 Then\n\n1463:         Return 1;\n\n1464:       End If;\n\n1465:     End If;\n\n1466:    \
    \ -- Cez ID sz\n\n1467:     If psID_SZ != C_CONST.NULA_SkladZasob then\n\n1468:       open cVratnaZasoba;\n\n\
    1469:       fetch cVratnaZasoba into nVratnaSZ;\n\n1470:       close cVratnaZasoba;\n\n1471:       If nVratnaSZ\
    \ = 1 then\n\n1472:        Return 1;\n\n1473:       End If;\n\n1474:     End If;\n\n1475:   End IF;\n\n1476:\
    \ \n\n1477:   C_SER_CISLA_PRAVIDLA.GetPravidlo(pdtDATUM=>sysdate, pnKOD_ID=>pnSklad_karta, psID_SZ=>psID_SZ,\
    \ psRID_DOKLAD=>psRID,\n\n1478:     pnSPOSOB_EVIDENCIE=>nSposobEvidencie, psID_PRAVIDLA=>sID_Pravidla, pnTYP_SN=>nTypEvidencie,\n\
    \n1479:     pnSklad=> pnSklad, pnPartner=> pnPartner, psMiesto_dod=> psMiesto_dod, pnTyp_pohybu=>pnTyp_pohybu);\n\
    \n1480:   if nSposobEvidencie != c_ser_cislo.SPOSOB_EVID_Neevidovat then\n\n1481:     return 1;\n\n1482:   end\
    \ if;\n\n1483:   Return 0;\n\n1484: end GetEvidujSC;\n\n1485: \n\n1486: function GetInfo_SK( pnKOD_ID number)\
    \ return varchar2 is\n\n1487:   sRet varchar2(254);\n\n1488: begin\n\n1489:   select substr(INT_KOD||' - '||NAZOV,1,240)||'\
