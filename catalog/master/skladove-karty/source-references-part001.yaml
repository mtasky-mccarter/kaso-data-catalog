    \ c_var.GETVAR(psid=> 'SKPONUKA-KASA'), pnLeaveUnbinded=> 1, pnSetGlobalPar=> 1, psCustomParams=> 'SKLAD;'||pnSklad));\n\
    \n7893: \tend;\n\n7894: \n\n7895: end KontrolaKartyNaPredajMO;\n\n7896: \n\n7897: function GetFB_NaKarteSaEvidDatumExp(psFLAGS_B\
    \ varchar2 default null, pnID number default null) return number is\n\n7898: begin\n\n7899:   return GetValueFlags_b(psFLAGS_B=>psFLAGS_B,\
    \ pnID=>pnID, pnNameFlags_b=>FLAGS_B_NaKarteSaEvidDatumExp);\n\n7900: end GetFB_NaKarteSaEvidDatumExp;\n\n7901:\
    \ \n\n7902: procedure KontrolaDatumuExsp(pnKodID number, psFlagsB varchar2 default null, pdtDatumExsp date,\
    \ pnStav out number, pnRaise number default 1) is\n\n7903: begin\n\n7904: \tif pnKodID is null then\n\n7905:\
    \ \t\tc_exc.raiseerrormsgid(3406); -- Nie je zadaná skladová karta! \\\\37694\n\n7906: \tend if;\n\n7907: \n\
