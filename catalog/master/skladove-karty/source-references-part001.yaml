    \ skladovej karty',psDB_POLE=>'STAV',psHODNOTA_Z=>nStavOld,psHODNOTA_NA=>pnStav);\n\n3291:     end if;\n\n3292:\
    \ \n\n3293: end ZmenaStavuSkladovejKarty;\n\n3294: \n\n3295: function JeMnozstvoMVM(pnKodID number, pnMnozstvo\
