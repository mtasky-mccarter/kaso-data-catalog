    \n4978: procedure MozemZmenitMakro(pnKodID number, psMakro varchar2 default null)\n\n4979: is\n\n4980:   nVariantMakra\
    \ number := 0;\n\n4981:   nNevybPolozky number(1,0);\n\n4982: begin\n\n4983:   if psMakro is null or (psMakro\
    \ is not null and psMakro != 'NETESTUJ_MAKRO') then\n\n4984:     nVariantMakra := GetVariantMakra(pnKodID=>pnKodID,\
    \ psMakro=>psMakro);\n\n4985:   end if;\n\n4986: \n\n4987:   if nVariantMakra = c_makro.M_PREDAJNE then\n\n\
    4988:     MozemZmenitPredajneMakro(pnKodID=>pnKodID, psMakro=>psMakro, pnVariantMakra=>nVariantMakra);\n\n4989:\
    \   elsif nVariantMakra in (c_makro.M_LOGISTICKE, c_makro.M_VYDAJOVE)  then\n\n4990:      MozemZmenitLogVydMakro(pnKodID=>pnKodID,\
    \ psMakro=>psMakro, pnVariantMakra=>nVariantMakra);\n\n4991:   end if;\n\n4992: \n\n4993:   exception when no_data_found\
    \ then\n\n4994:     return;\n\n4995: end MozemZmenitMakro;\n\n4996: \n\n4997: procedure MozemZmenitPredajneMakro(pnKodID\
    \ number,\n\n4998:   psMakro varchar2 default null,\n\n4999:   pnVariantMakra number default null)\n\n5000:\
    \ is\n\n5001:   nNevybPolozky number(1,0);\n\n5002: begin\n\n5003:   if pnVariantMakra is not null and pnVariantMakra\
    \ != c_makro.M_PREDAJNE then\n\n5004:     return;   -- nieje to predajne makro => neni co riesit\n\n5005:  \
    \ elsif pnVariantMakra is null and (psMakro is null or (psMakro is not null and psMakro != 'NETESTUJ_MAKRO'))\
    \ then\n\n5006:     if JePredajneMakro(pnKodID=>pnKodID, psMakro=>psMakro) != 1 then\n\n5007:       return;\
    \ -- nieje to predajne makro => neni co riesit\n\n5008:     end if;\n\n5009:   end if;\n\n5010: \n\n5011:  \
    \ select 1 into nNevybPolozky from obj_odb_l l, obj_odb_o o where l.rid = o.rid_o and l.s_stamp = '0'\n\n5012:\
    \   and (o.pocet-o.p_del-o.p_del_dod-o.p_fak-o.p_vyd-o.p_obj) > 0 and o.kod_id = pnKodID\n\n5013:   and substr(l.flags_s,\
    \ 12, 1) != '2' and rownum = 1;\n\n5014:   -- Predajné makro (%s) je už na nevybavených objednávkach ! Operácia\
    \ nebude pokračovať ! \\\\40235\n\n5015:   c_exc.raiseerrormsgid(pnIdMsg=>3877, psParams=>pnKodID);\n\n5016:\
    \   exception when no_data_found then\n\n5017:     return;\n\n5018: end MozemZmenitPredajneMakro;\n\n5019: \n\
    \n5020: procedure MozemZmenitLogVydMakro(pnKodID number,\n\n5021:   psMakro varchar2 default null,\n\n5022:\
    \   pnVariantMakra number default null)\n\n5023: is\n\n5024:   nNevybPolozky number(1,0);\n\n5025:   nSklad\
    \ number;\n\n5026: begin\n\n5027:   if pnVariantMakra is not null and pnVariantMakra not in (c_makro.M_LOGISTICKE,\
    \ c_makro.M_VYDAJOVE) then\n\n5028:     return;   -- nieje to log. ani vyd. makro => neni co riesit\n\n5029:\
    \   elsif pnVariantMakra is null and (psMakro is null or (psMakro is not null and psMakro != 'NETESTUJ_MAKRO'))\
    \ then\n\n5030:     if GetVariantMakra(pnKodID=>pnKodID, psMakro=>psMakro) not in (c_makro.M_LOGISTICKE, c_makro.M_VYDAJOVE)\
    \ then\n\n5031:       return; -- nieje to predajne makro => neni co riesit\n\n5032:     end if;\n\n5033:   end\
    \ if;\n\n5034: \n\n5035:   --- kontrola na sklad. zasob\n\n5036:   select sklad into nSklad from sklad_zasob\
    \ where kod_id = pnKodID and p_2 > 0 and rownum = 1;\n\n5037:   if nSklad is not null then\n\n5038:     c_exc.raiseerrormsg('Logistické\
    \ alebo výdajové makro je v zásobe na sklade '||nSklad||'. Nie je možné ho modifikovať.');\n\n5039:   end if;\n\
    \n5040: \n\n5041:   exception when no_data_found then\n\n5042:     return;\n\n5043: end MozemZmenitLogVydMakro;\n\
    \n5044: \n\n5045: function JePredajneMakro(pnKodID number default null, psMakro varchar2 default null) return\
