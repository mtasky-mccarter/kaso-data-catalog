    \ \t\tc_stahovacka_que.VLOZPOZIADVKUOut(prid=> prID_SQ, pnkod_id=> r.id, pnsklad_kam=> pnSKLAD_KAM, pnsklad_odkial=>\
    \ pnSKLAD_ODKIAL, pnsposob=> pnSposob, pnpocet=> pnPOCET,\n\n7717: \t\t\tpspopis=> psPOPIS, pspozn=> psPOZN,\
    \ psrid_v=> r.rid, pnprikaz_iba_skladom=> pnPRIKAZ_IBA_SKLADOM, psDOVOD_RP=> psDOVOD_RP, pnPartner_Kam=> pnPartner_Kam,\n\
    \n7718: \t\t\tpnTYP_CENY=>pnTYP_CENY, pnCENA=>pnCENA);\n\n7719: \t\t--\n\n7720: \tend loop;\n\n7721: \t--\n\n\
    7722: \tif prID_SQ.count = 0 then\n\n7723: \t\tc_session.SETLASTMESSAGEFORM(psmessage=> 'Nevytvorilo žiadnu\
