    1523:   If sRID_SKUP != NULA_SkupTechParamL then\n\n1524:     rRid_Skup.nCounter := rRid_Skup.nCounter + 1;\n\
    \n1525:     return 1; --rRid_Skup.sRIDs(rRid_Skup.nCounter - 1)\n\n1526:   else\n\n1527:     return 0;\n\n1528:\
    \   end if;\n\n1529: end NajdiSkupinyTP;\n\n1530: \n\n1531: procedure NajdiZaznamyTP ( psRID_SKUP varchar2 ,\
    \ psNAZOV_SKUP_O varchar2, pnKOD_ID number, psOddelovac_1 varchar2, psOddelovac_2 varchar2, psOddelovac_3 varchar2,\
    \ psNazovParam in out varchar2, pnCounter in out number, pnID_R_OLD in out number, psRID_OLD in out varchar2,\
    \ pnVratNazvySkupin number ) is\n\n1532: sNAZOV varchar2(254);\n\n1533: sHODNOTA varchar2(254);\n\n1534: sNazovTP\
    \ varchar2(254);\n\n1535: sHodnotaTP varchar2(254);\n\n1536: nCounter number;\n\n1537: sNAZOV_SKUP_O varchar2(254);\n\
    \n1538: sID_TP varchar2(16);\n\n1539: sRID_SKUP varchar(16);\n\n1540: nDAVAJ_DO_NAZVU number;\n\n1541: sNazovParam\
    \ varchar2(2000);\n\n1542: sOddelovacTP_1 varchar2(1);\n\n1543: sOddelovacTP_2 varchar2(1);\n\n1544: sOddelovacTP_3\
    \ varchar2(1);\n\n1545: bRekurzia boolean;\n\n1546: nID_R number;\n\n1547: bNevracajNic boolean;\n\n1548: TP_Separator\
    \ constant varchar2(16) := 'prazdny';\n\n1549: cursor C1 is SELECT ID_R, ID_TP,  RID_STP, NAZOV, DAVAJ_DO_NAZVU\
    \  FROM SKUP_TECH_PARAM_O WHERE  RID_O = psRID_SKUP AND PORADIE > 0 ORDER BY PORADIE;\n\n1550: cursor C2 is\
    \ SELECT DAVAJ_DO_NAZVU  FROM SKUP_TECH_PARAM_O WHERE  RID_O = psRID_OLD AND ID_R = pnID_R_OLD AND PORADIE >\
    \ 0 ORDER BY PORADIE;\n\n1551: \n\n1552: begin\n\n1553:   -- Oddelovace\n\n1554:   if psOddelovac_1 is null\
    \ then\n\n1555:     sOddelovacTP_1 := TP_Separator_1;\n\n1556:   else\n\n1557:     sOddelovacTP_1 := psOddelovac_1;\n\
    \n1558:   end if;\n\n1559:   if psOddelovac_2 is null then\n\n1560:     sOddelovacTP_2 := TP_Separator_2;\n\n\
    1561:   else\n\n1562:     sOddelovacTP_2 := psOddelovac_2;\n\n1563:   end if;\n\n1564:   if psOddelovac_3 is\
    \ null then\n\n1565:     sOddelovacTP_3 := TP_Separator_3;\n\n1566:   else\n\n1567:     sOddelovacTP_3 := psOddelovac_3;\n\
    \n1568:   end if;\n\n1569:   bRekurzia := false;\n\n1570:   nCounter := 0;\n\n1571:   pnCounter := pnCounter\
    \ + 1;\n\n1572:   -- dotiahne nazov skupiny tech. param. z hlavicky\n\n1573:   SELECT NAZOV INTO sNAZOV FROM\
    \ SKUP_TECH_PARAM_L WHERE  RID = psRID_SKUP;\n\n1574:   -- az pri rekurzivnom volani (ide ces skupiny tech.\
    \ parametrov)\n\n1575:   If pnCounter > 1 then\n\n1576:     if psRID_OLD is null or pnID_R_OLD is null then\n\
    \n1577:       nDAVAJ_DO_NAZVU := 1;\n\n1578:    /*   psRID_OLD := psRID_SKUP;\n\n1579:     end if;\n\n1580:\
    \     if pnID_R_OLD is null then\n\n1581:       pnID_R_OLD := 1; */\n\n1582:     end if;\n\n1583:     open C2;\n\
    \n1584:       loop\n\n1585:         fetch C2 into nDAVAJ_DO_NAZVU;\n\n1586:         exit when C2%notfound;\n\
    \n1587:       end loop;\n\n1588:     close C2;\n\n1589:     sNazovTP := sNAZOV;\n\n1590:     If psNAZOV_SKUP_O\
    \ is not null then\n\n1591:       sNazovTP := psNAZOV_SKUP_O;\n\n1592:     end if;\n\n1593:       --sHodnotaTP\
    \ := TP_Separator;\n\n1594:       dbms_output.put_line(sNazovTP ||' '|| pnVratNazvySkupin ||' '|| nDAVAJ_DO_NAZVU);\n\
    \n1595:     if pnVratNazvySkupin = 1 then\n\n1596:      if nDAVAJ_DO_NAZVU = 1 then\n\n1597:        -- vyskladanie\
    \ nazvov skupin\n\n1598:        sNazovParam := sNazovTP || sOddelovacTP_3; --|| sHodnotaTP || psOddelovac_2;\n\
    \n1599:        psNazovParam := psNazovParam || sNazovParam;\n\n1600:        dbms_output.put_line(psNazovParam);\n\
    \n1601:      end if;\n\n1602:     end if;\n\n1603:   end if;\n\n1604: \n\n1605:   -- hladam technicke parametre\n\
    \n1606:   open C1;\n\n1607:     loop\n\n1608:       fetch C1 into nID_R, sID_TP, sRID_SKUP, sNAZOV_SKUP_O, nDAVAJ_DO_NAZVU;\n\
    \n1609:         exit when C1%notfound;\n\n1610:         bNevracajNic := false;\n\n1611:         --Iba skupina\
    \ -- idem cez skupiny rekurzivne cez list\n\n1612:         If sRID_SKUP != NULA_SkupTechParamL AND sID_TP =\
    \ NULA_ID_CIS then\n\n1613:           sNazovParam := null;\n\n1614:           pnID_R_OLD := nID_R;\n\n1615:\
    \           psRID_OLD := psRID_SKUP;\n\n1616: \n\n1617:           NajdiZaznamyTP( sRID_SKUP, sNAZOV_SKUP_O,\
    \ pnKOD_ID, psOddelovac_1, psOddelovac_2, psOddelovac_3, psNazovParam, pnCounter, pnID_R_OLD, psRID_OLD, pnVratNazvySkupin\
    \ );\n\n1618:           bRekurzia := true;\n\n1619:         -- Technicky parameter -- idem cez technicky parameter\
    \ cez obsah\n\n1620:         ElsIf sID_TP != NULA_ID_CIS AND sRID_SKUP = NULA_SkupTechParamL then\n\n1621: \
    \        -- ak nie je Nazov v obsahu, zoberiem ho tech_param\n\n1622:           If sNAZOV_SKUP_O is not null\
    \ then\n\n1623:             sNazovTP := sNAZOV_SKUP_O;\n\n1624:           Else\n\n1625:             select NAZOV\
    \ into sNazovTP from tech_param where id = sID_TP;\n\n1626:           end if;\n\n1627:           begin\n\n1628:\
    \           -- dotiahnem hodnotu\n\n1629:           SELECT HODNOTA INTO sHODNOTA FROM sk_tech_param WHERE  id_tp\
    \ = sID_TP AND kod_id = pnKOD_ID;\n\n1630:             exception when no_data_found then\n\n1631:          \
    \     SELECT DEF_VAL INTO sHODNOTA FROM tech_param WHERE id = sID_TP;\n\n1632:           end;\n\n1633:     \
    \      sHodnotaTP := sHODNOTA;\n\n1634:         -- ak je technicky parameter aj skupina nezadany\n\n1635:  \
    \     /*  ElsIf sID_TP = NULA_ID_CIS AND sRID_SKUP = NULA_SkupTechParamL then\n\n1636:           if sNAZOV_SKUP_O\
    \ is not null then\n\n1637:             sNazovTP := sNAZOV_SKUP_O;\n\n1638:           else\n\n1639:        \
    \     sNazovTP := TP_Separator;\n\n1640:           end if;\n\n1641:           sHodnotaTP := TP_Separator; */\n\
    \n1642:         -- ak je zadany aj tech. parameter aj skupina , tak nerob nic\n\n1643:         Else\n\n1644:\
    \           bNevracajNic := TRUE;\n\n1645:         end if;\n\n1646:         -- vyskladavanie nazvov parametrov\n\
    \n1647:         if not bRekurzia and not bNevracajNic then\n\n1648:           if nDAVAJ_DO_NAZVU = 1 then\n\n\
    1649:             sNazovParam := sNazovTP || sOddelovacTP_1 || sHodnotaTP || sOddelovacTP_2;\n\n1650:      \
    \       psNazovParam := psNazovParam || sNazovParam;\n\n1651:           end if;\n\n1652:         end if;\n\n\
    1653:         bRekurzia := false;\n\n1654:     end loop;\n\n1655:   close C1;\n\n1656: \n\n1657: end NajdiZaznamyTP;\n\
    \n1658: \n\n1659: function GetNazovTechParam( pnKOD_ID number, psOddelovac_1 varchar2, psOddelovac_2 varchar2,\
    \ psOddelovac_3 varchar2, pnVratNazvySkupin number ) return varchar2 is\n\n1660: sRID_SKUP varchar2(16);\n\n\
    1661: sNAZOV_SKUP_O varchar2(254);\n\n1662: sTYP_T varchar2(16);\n\n1663: sNazovParam varchar2(2000);\n\n1664:\
    \ nCounter number;\n\n1665: nID_R_OLD number;\n\n1666: sRID_OLD varchar2(16);\n\n1667: nI number;\n\n1668: nOK\
    \ number;\n\n1669: sOddelovacTP_2 varchar2(1);\n\n1670: begin\n\n1671:   rRid_Skup.nCounter := 0;\n\n1672: \
    \  nI := 0;\n\n1673:   nCounter := 0;\n\n1674:   -- Oddelovac kvoli odstrihnutiu ciarky na konci celeho stringu\n\
    \n1675:   if psOddelovac_2 is null then\n\n1676:     sOddelovacTP_2 := TP_Separator_2;\n\n1677:   else\n\n1678:\
    \     sOddelovacTP_2 := psOddelovac_2;\n\n1679:   end if;\n\n1680: \n\n1681:   select TYP_T into sTYP_T from\
    \ sklad_karta where SK_ID = pnKOD_ID;\n\n1682:   if sTYP_T is not null then\n\n1683:     nOk := NajdiSkupinyTP(\
    \ sTYP_T );\n\n1684:   end if;\n\n1685:   -- natahuje skupinu RID-ciek  ktore nasiel v NajdiSkupiny\n\n1686:\
    \   while nI < rRid_Skup.nCounter loop\n\n1687:     sRID_SKUP := rRid_Skup.sRIDs(nI);\n\n1688:     if sRID_SKUP\
    \ is not null then\n\n1689:       NajdiZaznamyTP( sRID_SKUP, null, pnKOD_ID, psOddelovac_1, psOddelovac_2, psOddelovac_3,\
    \ sNazovParam, nCounter, nID_R_OLD, sRID_OLD, pnVratNazvySkupin );\n\n1690:       nI := nI + 1;\n\n1691:   \
    \  end if;\n\n1692:   end loop;\n\n1693:   -- Kontrola ci navratova hodnota obsahuje na konci separator a jeho\
    \ odstrihnutie\n\n1694:   if instr( sNazovParam, sOddelovacTP_2, length(sNazovParam) ) != 0 then\n\n1695:  \
    \   return substr( sNazovParam, 1, length(sNazovParam)-1 ) ;\n\n1696:   else\n\n1697:     return sNazovParam;\n\
    \n1698:   end if;\n\n1699: end GetNazovTechParam;\n\n1700: \n\n1701: function GetOptimalnyDodavatel (pnKod_id\
    \ number, pnPouziCennik number, pnCennikStarsiAkoDni number, pnUprednostniSkladom number,\n\n1702:   pnUprednostniTuzemskeho\
    \ number) return number\n\n1703: is\n\n1704:   nDodavatelSK number;\n\n1705:   nDodavatel number;\n\n1706: \
    \  sPom varchar2(10);\n\n1707:   CX XC;\n\n1708:   sOrderSkladom varchar2(50);\n\n1709:   sOrderTuzemsky varchar2(50);\n\
    \n1710: \n\n1711:   sPodmDatum varchar2(100);\n\n1712: begin\n\n1713:   select substr(flags_b,27,1), c_sklad_karta.GetDodavatel(pnID=>ID,\
    \ pnDodavatel=>DOD_SK) into sPom, nDodavatelSK from sklad_karta where id=pnKod_id;\n\n1714:   IF sPom = '1'\
    \ THEN\n\n1715:     RETURN nDodavatelSK;\n\n1716:   END IF;\n\n1717: \n\n1718:   IF pnCennikStarsiAkoDni IS\
    \ NOT NULL AND pnPouziCennik != 0 THEN\n\n1719:     sPodmDatum := ' AND trunc(sd.datum)>=trunc(sysdate)-'||pnCennikStarsiAkoDni;\n\
    \n1720:   END IF;\n\n1721: \n\n1722:   IF pnUprednostniSkladom = 1 THEN\n\n1723:     sOrderSkladom := ' decode(sd.dod_skladom,0,0,1)\
    \ desc,';\n\n1724:   END IF;\n\n1725: \n\n1726:   IF pnUprednostniTuzemskeho = 1 THEN\n\n1727:     sOrderTuzemsky\
    \ := ' decode(op.krajina,'||nvl(c_session.GetDomovskaKrajina,1)||',1,0) desc,';\n\n1728:   END IF;\n\n1729:\
    \ \n\n1730: \n\n1731:   OPEN CX FOR 'SELECT OP.ID from obch_partneri op, sklad_dodavatel sd where sd.id_dodavatela=op.id\n\
    \n1732:   and sd.kod_id=:nKod_id and nvl(substr(op.flags_b,19,1),''0'')=''0'' '||sPodmDatum||\n\n1733:   ' and\
    \ sd.used=1 ORDER BY '||sOrderTuzemsky||sOrderSkladom||'\n\n1734:   ((C_SK_NAKL_POL.GetNaklHodnotyStlpec( sd.KOD_ID,\
    \ 1, (sd.CENA_M/sd.POCET) *\n\n1735:   C_MENA.GetObchodnyKurz( sd.MENA, SYSDATE ), sd.ID_DODAVATELA, -2 ) +\n\
    \n1736:   sd.DOPR_NAKLADY + sd.CENA_M/sd.POCET) * C_MENA.GetObchodnyKurz( sd.MENA, SYSDATE )) asc,\n\n1737:\
    \   decode(sd.dod_skladom,0,nvl(doba_dodania,1000),0) asc'\n\n1738:     using pnKod_id;\n\n1739:   FETCH CX\
    \ INTO nDodavatel;\n\n1740:   CLOSE CX;\n\n1741: \n\n1742:   IF nDodavatel IS NULL THEN\n\n1743:     nDodavatel\
    \ := nDodavatelSK;\n\n1744:   END IF;\n\n1745:   RETURN nDodavatel;\n\n1746: end GetOptimalnyDodavatel;\n\n\
    1747: \n\n1748: function GetPartnerskyKod(pnSklad_karta number, pnPartner number)return varchar2\n\n1749: is\n\
    \n1750: cursor c1 is select KOD_PARTNERA from SKLAD_PARTNER_KOD\n\n1751:   where kod_id = pnSklad_karta and\
    \ partner = pnPartner order by c_sklad.ISFromMLOKRank(lokacia);\n\n1752: sKOD_PARTNERA varchar2(100);\n\n1753:\
    \ begin\n\n1754:   open c1;\n\n1755:   fetch c1 into sKOD_PARTNERA;\n\n1756:   close c1;\n\n1757:   return sKOD_PARTNERA;\n\
    \n1758: end GetPartnerskyKod;\n\n1759: \n\n1760: function GetRoundPocet( pnKodId number, pnPocet number, pnSposobZaokruhlovania\
    \ number )return number\n\n1761: is\n\n1762:   nZlomky number;\n\n1763:   nZlomkySkala number;\n\n1764:   nTrunc\
    \ number;\n\n1765:   nMod number;\n\n1766: begin\n\n1767:   select zlomky, zlomky_skala into nZlomky, nZlomkySkala\
    \ from sklad_karta where id=pnKodId;\n\n1768: \n\n1769:   -- na desatinne miesta  nZlomkySkala - pocet desatinnych\
    \ miest\n\n1770:     IF nZlomky = 0 THEN\n\n1771:       -- roundujem na nZlomkySkala\n\n1772:       nTrunc :=\
    \ trunc((pnPocet*power(10,nZlomkySkala))/1);\n\n1773:       nMod := mod((pnPocet*power(10,nZlomkySkala)),1);\n\
    \n1774:       IF nMod = 0 THEN\n\n1775:         -- vyslo cele\n\n1776:         RETURN pnPocet;\n\n1777:    \
    \   ELSE\n\n1778:         case pnSposobZaokruhlovania\n\n1779:           when TYP_ZAOKRUHLOVANIA_NEZAOKRUHLI\
    \ then\n\n1780:             RETURN trunc( pnPocet, 3 );\n\n1781:           when TYP_ZAOKRUHLOVANIA_ARITMETICKY\
    \ then\n\n1782:             RETURN round( pnPocet, nZlomkySkala );\n\n1783:           when TYP_ZAOKRUHLOVANIA_VZDY_NAHOR\
    \ then\n\n1784:             RETURN ((nTrunc+1)/power(10,nZlomkySkala));\n\n1785:           when TYP_ZAOKRUHLOVANIA_VZDY_NADOL\
    \ then\n\n1786:             RETURN ((nTrunc)/power(10,nZlomkySkala));\n\n1787:         end case;\n\n1788:  \
    \     END IF;\n\n1789:     ELSE\n\n1790:       -- delim nZlomkySkala nZlomkySkala - menovatel\n\n1791:     \
    \  IF nZlomkySkala = 0 THEN\n\n1792:         nZlomkySkala := 1;\n\n1793:       END IF;\n\n1794:       nMod :=\
    \ mod(pnPocet,(1/nZlomkySkala));\n\n1795:       nTrunc := trunc(pnPocet/(1/nZlomkySkala));\n\n1796:       IF\
    \ nMod = 0 THEN\n\n1797:         -- vyslo cele\n\n1798:         RETURN pnPocet;\n\n1799:       ELSE\n\n1800:\
    \         case pnSposobZaokruhlovania\n\n1801:           when TYP_ZAOKRUHLOVANIA_NEZAOKRUHLI then\n\n1802: \
    \            RETURN trunc( pnPocet, 3 );\n\n1803:           when TYP_ZAOKRUHLOVANIA_ARITMETICKY then\n\n1804:\
    \             RETURN round((round(pnPocet*nZlomkySkala)*( 1/nZlomkySkala )),3);\n\n1805:           when TYP_ZAOKRUHLOVANIA_VZDY_NAHOR\
    \ then\n\n1806:             RETURN round(((nTrunc+1)*(1/nZlomkySkala)),3);\n\n1807:           when TYP_ZAOKRUHLOVANIA_VZDY_NADOL\
    \ then\n\n1808:             RETURN round(((nTrunc)*(1/nZlomkySkala)),3);\n\n1809:         end case;\n\n1810:\
    \       END IF;\n\n1811:     END IF;\n\n1812: \n\n1813: end GetRoundPocet;\n\n1814: \n\n1815: function GetTovarTypName(psTovarTyp\
    \ varchar2) return varchar2 is\n\n1816:   sTyp varchar2(300);\n\n1817:   sPom varchar2(254);\n\n1818:   sRet\
    \ varchar2(2000);\n\n1819: begin\n\n1820:   sTyp := psTovarTyp;\n\n1821:   loop\n\n1822:     if sTyp is null\
    \ then\n\n1823:       return sRet;\n\n1824:     end if;\n\n1825:     select NAZOV||'/' into sPom from TOVAR_TYP\
    \ where ID = sTyp;\n\n1826:     sRet := sPom|| sRet;\n\n1827:     sTyp := substr(sTyp, 1, length(sTyp)-2);\n\
    \n1828:   end loop;\n\n1829:   exception\n\n1830:     when no_data_found then\n\n1831:       return sRet;\n\n\
    1832: end GetTovarTypName;\n\n1833: \n\n1834: function GetTYP_EVIDENCIE( pnSklad_karta number) return number\n\
    \n1835: is\n\n1836:   nTypEvidencie number;\n\n1837: begin\n\n1838:   select TYP_EVIDENCIE into nTypEvidencie\
    \ from ucty_sk, sklad_karta where sklad_karta.id = pnSklad_karta and T_TOVARU =ucty_sk.id;\n\n1839:   return\
    \ nTypEvidencie;\n\n1840: end GetTYP_EVIDENCIE;\n\n1841: \n\n1842: function GetUcetDodavatela( pnKodID number,\
    \ psUcetExp varchar2) return number is\n\n1843:   cx XC;\n\n1844:   nRet number;\n\n1845: begin\n\n1846:   open\
    \ cx for 'SELECT '||psUcetExp||' FROM ucty_op UOP where ID = ( select OP.TYP_U\n\n1847:     from obch_partneri\
    \ OP, SKLAD_KARTA SK where OP.ID = c_sklad_karta.GetDodavatel(pnID=>SK.ID, pnDodavatel=>SK.DOD_SK) and SK.ID\
    \ = :nKodID)' using pnKodID;\n\n1848:   fetch cx into nRet;\n\n1849:   if cx%notfound then\n\n1850:     nRet\
    \ := 0;\n\n1851:   end if;\n\n1852:   close cx;\n\n1853:   return nvl(nRet,0);\n\n1854: end GetUcetDodavatela;\n\
    \n1855: \n\n1856: function GetZarukaEndParam( pdtDatStart date, pnZaruka number, pnObdobie number ) return date\
    \ is\n\n1857: begin\n\n1858:   if pnObdobie = 1 then\n\n1859:     return pdtDatStart + pnZaruka;\n\n1860:  \
    \ elsif pnObdobie = 30 then\n\n1861:     return add_months(pdtDatStart, pnZaruka);\n\n1862:   elsif pnObdobie\
    \ = 0 then\n\n1863:     return pdtDatStart + pnZaruka/24;\n\n1864:   else\n\n1865:     return add_months(pdtDatStart,\
    \ pnZaruka*12);\n\n1866:   end if;\n\n1867: end GetZarukaEndParam;\n\n1868: \n\n1869: function GetZarukaEndToken(\
    \ pdtDatStart date, psZaruka varchar2 ) return date is\n\n1870: begin\n\n1871:   return GetZarukaEndParam( pdtDatStart,\
    \ ppf.gettoken(psZaruka,1), ppf.gettoken(psZaruka,2));\n\n1872: end GetZarukaEndToken;\n\n1873: \n\n1874: function\
    \ GetZarukaTextParam( pnZaruka number, pnObdobie number ) return varchar2 is\n\n1875: begin\n\n1876:   return\
    \ pnZaruka||' '|| get_x_value(-1152, pnObdobie);\n\n1877: end GetZarukaTextParam;\n\n1878: \n\n1879: function\
    \ GetZarukaTextToken( psZaruka varchar2 ) return varchar2 is\n\n1880: begin\n\n1881:   return ppf.gettoken(psZaruka,1)||'\
    \ '|| get_x_value(-1152, ppf.gettoken(psZaruka,2));\n\n1882: end GetZarukaTextToken;\n\n1883: \n\n1884: function\
    \ GetZarukaToken( pnZaruka number, pnObdobie number ) return varchar2 is\n\n1885: begin\n\n1886:   return pnZaruka||c_const.T||\
    \ pnObdobie;\n\n1887: end GetZarukaToken;\n\n1888: \n\n1889: procedure HromadneZmen( psPodmSK varchar2, pnSposob\
    \ number, pnSK_ID number, psCopy varchar2, psNK varchar2,\n\n1890:   pnMnozstvo number, pnPercento number, psAliasTable\
    \ varchar2 default null) is\n\n1891:   cx xc;\n\n1892:   nSK_ID number;\n\n1893:   nRabSkup number;\n\n1894:\
    \   nDodSK number;\n\n1895:   nMenaDod number;\n\n1896:   nIneNaklDod number;\n\n1897:   cursor cNP_copy is\
    \ select NP.NK_ID, NP.MNOZSTVO, NP.PERCENTO, NK.TYP_UPL from SK_NAKL_POLOZKY NP, NAKL_KOEF NK where NP.KOD_ID\
    \ = pnSK_ID and NP.S_STAMP = '0' AND NP.NK_ID=NK.ID;\n\n1898:   cursor cNP_zrus(cpSK_ID number) is select ID\
    \ from SK_NAKL_POLOZKY where KOD_ID = cpSK_ID and NK_ID = psNK and\n\n1899:     S_STAMP = '0';\n\n1900:   cursor\
    \ cNP_zrus_vsetko(cpSK_ID number) is select ID from SK_NAKL_POLOZKY where KOD_ID = cpSK_ID and S_STAMP = '0';\n\
    \n1901:   nMnozstvo SK_NAKL_POLOZKY.MNOZSTVO%TYPE;\n\n1902:   nHmotnost SKLAD_KARTA.HMOTNOST%TYPE;\n\n1903:\
    \   nObjem SKLAD_KARTA.OBJEM%TYPE;\n\n1904:   nHmotnostSK SKLAD_KARTA.HMOTNOST%TYPE;\n\n1905:   nObjemSK SKLAD_KARTA.OBJEM%TYPE;\n\
    \n1906:   sAddPodm varchar2(100);\n\n1907: begin\n\n1908:   if pnSposob = 0 and instr(psCopy,'1') != 0 then\n\
    \n1909:     select CEN_SKUPINA, c_sklad_karta.GetDodavatel(pnID=>ID, pnDodavatel=>DOD_SK) into nRabSkup, nDodSK\
    \ from SKLAD_KARTA SK where ID = pnSK_ID;\n\n1910:     begin\n\n1911:       select MENA, DOPR_NAKLADY into nMenaDod,\
    \ nIneNaklDod from SKLAD_DODAVATEL SD\n\n1912:         where SD.kod_id = pnSK_ID and SD.ID_DODAVATELA = nDodSK\
    \ and SD.s_stamp = '0' and rownum < 2;\n\n1913:     exception when no_data_found then\n\n1914:       nMenaDod\
    \ := null;\n\n1915:     end;\n\n1916:   end if;\n\n1917: \n\n1918:   select nvl(HMOTNOST,0), nvl(OBJEM,0) INTO\
    \ nHmotnostSK, nObjemSK from SKLAD_KARTA where ID=pnSK_ID;\n\n1919:   if c_ini.getini(615) > 0 then\n\n1920:\
    \     sAddPodm := ' and (ID_PROD_MAN = '|| c_session.getuser ||' or ZASTUPCA = '|| c_session.getuser ||')';\n\
    \n1921:   end if;\n\n1922:   open cx for 'select ID, nvl(HMOTNOST,0), nvl(OBJEM,0) from SKLAD_KARTA '|| psAliasTable||\
    \ ' where 1 = 1 '|| psPodmSK || sAddPodm;\n\n1923:   loop\n\n1924:     fetch cx into nSK_ID, nHmotnost, nObjem;\n\
    \n1925:     exit when cx%notfound;\n\n1926:     if pnSposob = 0 then  -- kopirovanie z SK\n\n1927:       if\
    \ substr( psCopy, 1, 1 ) = '1' then -- Nakladove polozky\n\n1928:         IF nSK_ID != pnSK_ID THEN\n\n1929:\
    \           for rNP in cNP_zrus_vsetko( nSK_ID) loop\n\n1930:               c_sk_nakl_pol.StornoRIDC( rNP.ID\
    \ );\n\n1931:           end loop;\n\n1932:         END IF;\n\n1933:         for rNP in cNP_copy loop\n\n1934:\
    \           nMnozstvo := rNP.MNOZSTVO;\n\n1935:           IF rNP.TYP_UPL = 1 THEN\n\n1936:             -- OBJEM\n\
    \n1937:             IF nObjemSK = 0 THEN\n\n1938:               nMnozstvo := 0;\n\n1939:             ELSE\n\n\
    1940:               nMnozstvo := round((rNP.MNOZSTVO*nObjem)/nObjemSK, 10);\n\n1941:             END IF;\n\n\
    1942:           END IF;\n\n1943:           IF rNP.TYP_UPL = 2 THEN\n\n1944:             -- HMOTNOST\n\n1945:\
    \             IF nHmotnostSK = 0 THEN\n\n1946:               nMnozstvo := 0;\n\n1947:             ELSE\n\n1948:\
    \               nMnozstvo := round((rNP.MNOZSTVO*nHmotnost)/nHmotnostSK, 10);\n\n1949:             END IF;\n\
    \n1950:           END IF;\n\n1951:           c_sk_nakl_pol.VlozAleboZmenNP( nSK_ID, rNP.NK_ID, nMnozstvo, rNP.PERCENTO\
    \ );\n\n1952:         end loop;\n\n1953:       end if;\n\n1954:       if substr( psCopy, 2, 1 ) = '1' then --\
    \ Rabatova skupina\n\n1955:         update SKLAD_KARTA set CEN_SKUPINA = nRabSkup where ID = nSK_ID;\n\n1956:\
    \       end if;\n\n1957:       if ( substr( psCopy, 3, 1 ) = '1' Or substr( psCopy, 4, 1 ) = '1') and\n\n1958:\
    \         nMenaDod is not null then -- Mena a ine naklady hlavneho dodavatela\n\n1959:         update SKLAD_DODAVATEL\
    \ set MENA = decode( substr( psCopy, 3, 1 ), '1', nMenaDod, MENA),\n\n1960:           DOPR_NAKLADY = decode(\
    \ substr( psCopy, 4, 1 ), '1', nIneNaklDod, DOPR_NAKLADY)\n\n1961:           where s_stamp = '0' and KOD_ID\
    \ = nSK_ID and ID_DODAVATELA = (select c_sklad_karta.GetDodavatel(pnID=>SK.ID, pnDodavatel=>SK.DOD_SK) from\
    \ SKLAD_KARTA SK where SK.ID = nSK_ID);\n\n1962:       end if;\n\n1963:     elsif pnSposob = 1 then -- zrusenie\
    \ NK\n\n1964:       for rNP in cNP_zrus( nSK_ID) loop\n\n1965:         c_sk_nakl_pol.StornoRIDC( rNP.ID );\n\
    \n1966:       end loop;\n\n1967:     else  -- vloz alebo zmen\n\n1968:       c_sk_nakl_pol.VlozAleboZmenNP(\
    \ nSK_ID, psNK, pnMnozstvo, pnPercento );\n\n1969:     end if;\n\n1970:   end loop;\n\n1971:   close cx;\n\n\
    1972: end HromadneZmen;\n\n1973: \n\n1974: procedure HromadneZmenC_X( psPodmSK varchar2, pdtDatum date, pnAko\
    \ number) is\n\n1975:   cx xc;\n\n1976:   nSK_ID number;\n\n1977:   nC_X number;\n\n1978:   nDodSK number;\n\
    \n1979:   nC_XN number;\n\n1980:   nC_MN number;\n\n1981:   nMenaN number;\n\n1982:   sAddPodm varchar2(100);\n\
    \n1983: begin\n\n1984:   if c_ini.getini(615) > 0 then\n\n1985:     sAddPodm := ' and (ID_PROD_MAN = '|| c_session.getuser\
    \ ||' or ZASTUPCA = '|| c_session.getuser ||')';\n\n1986:   end if;\n\n1987:   open cx for 'select ID, C_X,\
    \ c_sklad_karta.GetDodavatel(pnID=>ID, pnDodavatel=>DOD_SK) from SKLAD_KARTA where 1 = 1 '|| psPodmSK || sAddPodm;\n\
    \n1988:   loop\n\n1989:     fetch cx into nSK_ID, nC_X, nDodSK;\n\n1990:     exit when cx%notfound;\n\n1991:\
    \     begin\n\n1992:       select nvl((CENA_M*c_mena.getobchodnykurz(MENA,pdtDatum) +\n\n1993:         C_SK_NAKL_POL.GetNaklHodnotyStlpec(\
    \ nSK_ID, 1, CENA_M*c_mena.getobchodnykurz(MENA,pdtDatum),\n\n1994:         ID_DODAVATELA, -2, pdtDatum ) +\n\
    \n1995:         SD.DOPR_NAKLADY),0), nvl(CENA_M,0), nvl((select MENA_V from MENY where ID = SD.MENA),0)\n\n\
    1996:         into nC_XN, nC_MN, nMenaN from SKLAD_DODAVATEL SD\n\n1997:         where SD.ID_DODAVATELA = nDodSK\
    \ and s_stamp = '0' and KOD_ID = nSK_ID and rownum < 2 order by 1 desc;\n\n1998:       if pnAko in (0,3) or\
    \ (pnAko = 1 and nC_XN < nC_X ) or (pnAko = 2 and nC_XN > nC_X) then\n\n1999:         update SKLAD_KARTA SK\n\
    \n2000:         Set C_X = nC_XN, C_STAMP='0'||substr(C_STAMP,2),  C_M = nC_MN, MENA_SK = nMenaN\n\n2001:   \
    \      where ID = nSK_ID;\n\n2002:       end if;\n\n2003:     exception when no_data_found then\n\n2004:   \
    \    null;\n\n2005:     end;\n\n2006:   end loop;\n\n2007:   close cx;\n\n2008: end HromadneZmenC_X;\n\n2009:\
    \ \n\n2010: procedure HromadneZmenCennik( psPodmSK varchar2, pdtDatum date, pnAko number, pnRozdiel number,\
    \ pnCennik number,\n\n2011:   pnPripCenu number, pnStav out number) is\n\n2012:   cx xc;\n\n2013:   cy xc;\n\
    \n2014:   nSK_ID number;\n\n2015:   nMena number;\n\n2016:   sVyraz varchar2(254);\n\n2017:   nCenaOld number;\n\
    \n2018:   nCenaNew number;\n\n2019:   nCenaZaokr number;\n\n2020:   sAddPodm varchar2(100);\n\n2021:   sFunkcia\
    \ varchar2(2000);\n\n2022:   nSDph number;\n\n2023:   nDph number;\n\n2024:   sTypZaokr varchar2(20);\n\n2025:\
    \   nPom number;\n\n2026:   nKIR number;\n\n2027:   nKurz number;\n\n2028: begin\n\n2029:   if not pnCennik\
    \ between 1 and 7 then\n\n2030:     pnStav := 0;\n\n2031:     return;\n\n2032:   end if;\n\n2033:   if c_ini.getini(615)\
    \ > 0 then\n\n2034:     sAddPodm := ' and (ID_PROD_MAN = '|| c_session.getuser ||' or ZASTUPCA = '|| c_session.getuser\
    \ ||')';\n\n2035:   end if;\n\n2036:   select cp.MENA, t.ID, t.funkcia, cp.s_dph into nMena, sTypZaokr, sFunkcia,\
    \ nSDph\n\n2037:   from CENNIKY_POPIS CP, typ_zaokr_ceny t where cp.ID = pnCennik\n\n2038:   and cp.typ_zaokr\
    \ = t.id;\n\n2039:   if nMena = -1 then\n\n2040:     nKurz := 1;\n\n2041:   else\n\n2042:     nKurz := c_mena.getobchodnykurz(nMena,pdtDatum);\n\
    \n2043:   end if;\n\n2044: \n\n2045:   open cx for 'select ID, (select decode(:pnCennik, 1, K_1, 2, K_2, 3,\
    \ K_3, 4, K_4, 5, K_5, 6, K_6, 7, K_7)\n\n2046:     from SKLAD_CS where ID = SKLAD_KARTA.CEN_SKUPINA), decode(:pnCennik,\
    \ 1, C_1, 2, C_2, 3, C_3, 4, C_4, 5, C_5, 6, C_6, 7, C_7),\n\n2047:     DPH, decode(:pnCennik, 1, KIR_1, 2,\
    \ KIR_2, 3, KIR_3, 4, KIR_4, 5, KIR_5, 6, KIR_6, 7, KIR_7)\n\n2048:     from SKLAD_KARTA where 1 = 1 '|| psPodmSK\
    \ || sAddPodm using pnCennik, pnCennik, pnCennik;\n\n2049:   loop\n\n2050:     fetch cx into nSK_ID, sVyraz,\
    \ nCenaOld, nDph, nKIR;\n\n2051:     exit when cx%notfound;\n\n2052:     if sVyraz is not null then\n\n2053:\
    \       /*if pnPripCenu = 1 then\n\n2054:         begin\n\n2055:           select cena into nCenaOld from CENY_BUFFER\
    \ where KOD_ID = nSK_ID and CENNIK_ID = pnCennik;\n\n2056:           nCenaOld := nCenaOld * nKurz;\n\n2057:\
    \         exception when no_data_found then\n\n2058:           nCenaOld := null;\n\n2059:         end;\n\n2060:\
    \       else\n\n2061:         nCenaOld := nCenaOld * nKurz;\n\n2062:       end if;*/\n\n2063:       nCenaOld\
    \ := nCenaOld * nKurz; -- zmenili sme takto\n\n2064: \n\n2065:       CENOTVORBA.GetCenuExpresion_T( sVyraz,\
    \ nSK_ID, c_const.NULA_SkladZasob, pdtDatum, nCenaOld, nCenaNew);\n\n2066:       if nCenaNew = -1 then\n\n2067:\
    \         pnStav := 0;\n\n2068:         return;\n\n2069:       end if;\n\n2070: \n\n2071:       if pnAko in\
    \ (0,3) or (pnAko = 1 and nCenaNew < nCenaOld ) or (pnAko = 2 and nCenaNew > nCenaOld) then\n\n2072:       \
    \  if pnRozdiel = 0 or ( abs(nCenaOld - nCenaNew) > abs(pnRozdiel)) Or nCenaOld is null then\n\n2073:      \
    \     --- zaokruhlenie ???\n\n2074:           nCenaZaokr := nKIR * nCenaNew/nKurz;\n\n2075:           nPom :=\
    \ nCenaZaokr;\n\n2076:           -- ak mam zaokruhlovat\n\n2077:           if pnPripCenu = 1 then\n\n2078: \
    \              nSDPH := 0;\n\n2079:           End If;\n\n2080: \n\n2081:           If sTypZaokr != CENOTVORBA.TYPZAOKR_Nezaokr\
    \ then\n\n2082:             open cy for 'select '|| sFunkcia ||' from dual ' using\n\n2083:               nPom,0,0,c_const.NULA_MiestaDodania,0,nSK_ID,nDph,'No',C_CONST.NULA_SkladZasob,\n\
    \n2084:               0,0,1,c_const.NULA_SposobObjednania,c_const.NULA_SposobKontaktu,C_session.getlokacia,\n\
    \n2085:               pdtDatum,pnCennik,nSDPH,0,C_CONST.NULA_RID,C_CONST.NULA_RID;\n\n2086:             fetch\
    \ cy into nCenaZaokr;\n\n2087:             close cy;\n\n2088:           End If;\n\n2089:           if pnPripCenu\
    \ = 1 then\n\n2090:             delete from CENY_BUFFER where KOD_ID = nSK_ID and CENNIK_ID = pnCennik;\n\n\
    2091:             insert into CENY_BUFFER (CENA, KOD_ID, CENNIK_ID) values (nCenaZaokr, nSK_ID, pnCennik);\n\
    \n2092:           else\n\n2093:             execute immediate 'update SKLAD_KARTA SK Set C_'||pnCennik||' =\
    \ :nCena, C_STAMP=substr(C_STAMP,1,'||pnCennik||')||''0''||substr(C_STAMP,'||pnCennik||'+2) where ID = :nID'\n\
    \n2094:               using nCenaZaokr, nSK_ID;\n\n2095:           end if;\n\n2096:         end if;\n\n2097:\
    \       end if;\n\n2098:     end if;\n\n2099:   end loop;\n\n2100:   close cx;\n\n2101:   pnStav := 1;\n\n2102:\
    \ end HromadneZmenCennik;\n\n2103: \n\n2104: procedure InsWWW(pnKladne number, psRID  in out C_RID.DT_RID, pnID\
    \  in out C_CIS.DT_ID, pnBALENIE DT_BALENIE,\n\n2105:  pnCEN_SKUPINA DT_CEN_SKUPINA, pnCOL_SADZBA DT_COL_SADZBA,\
    \ pnC_1 DT_C_1, pnC_2 DT_C_2,\n\n2106:  pnC_3 DT_C_3, pnC_4 DT_C_4, pnC_5 DT_C_5, pnC_EKV DT_C_EKV, pnC_M DT_C_M,\
    \ pnC_N DT_C_N,\n\n2107:  pdtDATUM_MINMAX DT_DATUM_MINMAX, psDOD_KOD DT_DOD_KOD, pnDOD_SK DT_DOD_SK, pnDPH DT_DPH,\n\
    \n2108:  psDRUH DT_DRUH, psFARBY DT_FARBY, psFLAGS DT_FLAGS, pnHMOTNOST DT_HMOTNOST, psINT_KOD DT_INT_KOD,\n\
    \n2109:  pnKALKUL_P DT_KALKUL_P, psMAKRO DT_MAKRO, pnMENA_SK DT_MENA_SK, psNAZOV DT_NAZOV, pnOBJEM DT_OBJEM,\n\
    \n2110:  pnODPIS_SK DT_ODPIS_SK, pnPAR_1 DT_PAR_1, pnPAR_2 DT_PAR_2, psPAR_STR_1 DT_PAR_STR_1,\n\n2111:  psPAR_STR_2\
    \ DT_PAR_STR_2, psPOLOHA DT_POLOHA, psPOMENOVANIE DT_POMENOVANIE,\n\n2112:  pnPREF_CENA DT_PREF_CENA, psP_JEDNOTKA\
    \ DT_P_JEDNOTKA, psSKALA DT_SKALA, pnSKLAD DT_SKLAD,\n\n2113:  pnSMER DT_SMER, psTECHINFO DT_TECHINFO, psTYP_T\
    \ DT_TYP_T, pnT_TOVARU DT_T_TOVARU,\n\n2114:  pnUSED DT_USED, pnVELKE_BAL DT_VELKE_BAL, pnVYROBCA DT_VYROBCA,\
    \ pdtZALOZENA DT_ZALOZENA,\n\n2115:  pnZARUKA DT_ZARUKA, pnZLAVA_ID DT_ZLAVA_ID, pnZLAVA_MIN_POC DT_ZLAVA_MIN_POC,\n\
    \n2116:  pnZLAVY DT_ZLAVY, pnZMENENE DT_ZMENENE, pnDOD_BAL DT_DOD_BAL, pnVRSTVA_BAL DT_VRSTVA_BAL,\n\n2117:\
    \  pnNAHRADA DT_NAHRADA, pnID_PROD_MAN DT_ID_PROD_MAN, pnZARUKA_OBD DT_ZARUKA_OBD, psURL DT_URL,\n\n2118:  pnKOD_ID_OBALU\
    \ DT_KOD_ID_OBALU, pnUROVEN_DPH DT_UROVEN_DPH/*, psSORT_SKUPINA DT_SORT_SKUPINA*/,\n\n2119:  pnPALETA_BAL DT_PALETA_BAL,\
    \ pnHLBKA DT_HLBKA, pnSIRKA DT_SIRKA, pnVYSKA DT_VYSKA, pnSTAV DT_STAV,\n\n2120:  pnMNOZSTVO_DMJ DT_MNOZSTVO_DMJ,\
    \ pnKRAJINA_P DT_KRAJINA_P, psPOZN C_CIS.DT_POZN,psFlagsB varchar2, pnMUSTRA_KOD_ID C_CIS.DT_ID,\n\n2121:  pnHmotnostNetto\
    \ DT_HMOTNOST_NETTO,pnObjemNetto DT_OBJEM_NETTO, pnMnozstvoAlk DT_MNOZSTVO_ALKOHOLU,\n\n2122:  pnMnozstvoCukr\
