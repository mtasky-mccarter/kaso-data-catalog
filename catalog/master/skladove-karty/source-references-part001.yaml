    \n2931:   return rObjMO.m_nMozeObjOdb;\n\n2932: end GetMozeObjednatOdb;\n\n2933: \n\n2934: function GetMozeObjednatOdb_WWW(pnKodID\
    \ number, pnSklad number default null, psSarza varchar2 default null) return number is\n\n2935: begin\n\n2936:\
    \   GetMozeObjednatOdb_Int(pnKodID=> pnKodID,pnSklad=> pnSklad,psSarza=> psSarza);\n\n2937:   return rObjMO.m_nMozeObjOdb_WWW;\n\
    \n2938: end GetMozeObjednatOdb_WWW;\n\n2939: \n\n2940: procedure GetSZParam(pnKodID number, psOut in out varchar2,\
    \ psSklad varchar2 default null,\n\n2941:   psNotInSklad varchar2 default null, psSarza varchar2 default null,\
    \ psPodm varchar2 default null) is\n\n2942:   sPodm varchar2(2000);\n\n2943: begin\n\n2944:   if psOut is null\
    \ then\n\n2945:     psOut := 'nvl(sum(sz.p_1),0)';\n\n2946:   end if;\n\n2947:   -- Podm\n\n2948:   if psSklad\
    \ is not null then\n\n2949:     sPodm := ' and sz.sklad in ('||psSklad||')';\n\n2950:   end if;\n\n2951:   if\
    \ psNotInSklad is not null then\n\n2952:     sPodm := sPodm || ' and sz.sklad not in ('||psNotInSklad||')';\n\
    \n2953:   end if;\n\n2954:   if psSarza is not null then\n\n2955:     sPodm := sPodm ;--|| ' and sz.sarza ='''||psSarza||'''';\n\
    \n2956:   end if;\n\n2957:   if psPodm is not null then\n\n2958:     sPodm := sPodm || psPodm;\n\n2959:   else\n\
    \n2960:     sPodm := sPodm || ' and c_sklad.GetLokaciaDBSPreLokaciu(sz.sklad)=c_session.getlokaciadbs and sz.p_1>0';\n\
    \n2961:   end if;\n\n2962:   --dbms_output.put_line('select '||psOut||' from sklad_zasob sz where sz.kod_id=:pnKodID'\
    \ || sPodm);\n\n2963:   execute immediate 'select '||psOut||' from sklad_zasob sz where sz.kod_id=:pnKodID'\
    \ || sPodm into psOut using pnKodID;\n\n2964: \n\n2965: end GetSZParam;\n\n2966: \n\n2967: function GetSZP1(pnKodID\
    \ number, psSklad varchar2 default null, psNotInSklad varchar2 default null,\n\n2968:   psSarza varchar2 default\
    \ null) return number is\n\n2969:   nP1 number;\n\n2970:   sOut varchar2(2000);\n\n2971: begin\n\n2972:   GetSZParam(pnKodID=>pnKodID,\
    \ psOut=>sOut, psSklad=>psSklad, psNotInSklad=>psNotInSklad, psSarza=>psSarza);\n\n2973:   return to_number(sOut);\n\
    \n2974: end GetSZP1;\n\n2975: \n\n2976: function GetSZVyraz(pnKodID number, psVyraz varchar2, psSklad varchar2\
    \ default null, psNotInSklad varchar2 default null,\n\n2977:   psSarza varchar2 default null, psPodm varchar2\
    \ default null) return varchar2 is\n\n2978:   nP1 number;\n\n2979:   sOut varchar2(2000) := psVyraz;\n\n2980:\
    \ begin\n\n2981:   GetSZParam(pnKodID=>pnKodID, psOut=>sOut, psSklad=>psSklad, psNotInSklad=>psNotInSklad, psSarza=>psSarza,\
    \ psPodm=>psPodm);\n\n2982:   return sOut;\n\n2983: end GetSZVyraz;\n\n2984: \n\n2985: procedure DelTovarTyp(psID\
    \ varchar2) is\n\n2986: begin\n\n2987:   c_tovar_typ.KontrolaNaVazbaPrisl(psID=>psID);\n\n2988:   DELETE FROM\
    \ TOVAR_TYP WHERE ID =  psID;\n\n2989:   exception\n\n2990:     when others then\n\n2991:       rollback;\n\n\
    2992:       raise;\n\n2993: end DelTovarTyp;\n\n2994: \n\n2995: function SetNakupcu(pnId number, pnTyp number,\
    \ pnUpdate number, pdtDate date default sysdate, pnCommit number default 1) return number is\n\n2996:  -- procedura\
    \ vyberie z ciselnika nakupcu/zastupcu a nastavi ho na skladovu kartu (pnId=null - všetky SK)\n\n2997:   nPom\
    \ number;\n\n2998:   nUserId number;\n\n2999:   sSql varchar2(3000);\n\n3000:   sOrder varchar2(1000);\n\n3001:\
    \   nKodId number;\n\n3002:   cSql sys_refcursor;\n\n3003: begin\n\n3004:   select c_ini.getini(PID=>1089) into\
    \ sOrder from dual;--cislo prepinaca pre zoradenie z tabulky sk_vazby\n\n3005: \n\n3006:   if sOrder is null\
    \ then\n\n3007:     sOrder:='sk_vazby.kod_id, sk_vazby.datum_od desc';\n\n3008:   end if;\n\n3009: \n\n3010:\
    \   sSql:='select * from ( select sk_vazby.user_id\n\n3011:       from sklad_karta, sk_vazby\n\n3012:      \
    \ where sk_vazby.s_stamp=''0'' and\n\n3013:         (sk_vazby.dodavatel is null or sk_vazby.dodavatel=c_sklad_karta.GetDodavatel(pnID=>sklad_karta.ID,\
    \ pnDodavatel=>sklad_karta.DOD_SK)) and\n\n3014:         (sk_vazby.vyrobca is null or sk_vazby.vyrobca=sklad_karta.vyrobca)\
    \ and\n\n3015:         (sk_vazby.strom is null or sklad_karta.typ_t like sk_vazby.strom||''%'') and\n\n3016:\
    \         (sk_vazby.kod_id is null or sk_vazby.kod_id = sklad_karta.id) and\n\n3017:         (sk_vazby.obch_znacka\
    \ is null or sk_vazby.obch_znacka = sklad_karta.obch_znacka) and\n\n3018:         (sk_vazby.typ in ('||pnTyp||'))\
    \ and\n\n3019:         (sk_vazby.datum_od <=trunc(:pdtDate)) and\n\n3020:         (sk_vazby.datum_do is null\
    \ or sk_vazby.datum_do>=trunc(:pdtDate)) and\n\n3021:         sklad_karta.id=:rSK_ID\n\n3022:       order by\
    \ sk_vazby.kod_id,'||sOrder||')\n\n3023:     where rownum=1';\n\n3024:   --dbms_output.put_line(sSql);\n\n3025:\
    \ \n\n3026:   for rSK in (select id, id_prod_man, zastupca from sklad_karta where s_stamp='0' and id=nvl(pnId,id))\n\
    \n3027:   loop\n\n3028:     open cSql for sSql using pdtDate,pdtDate,rSK.id ;\n\n3029:     --dbms_output.put_line('i'||rSK.id);\n\
    \n3030:     fetch cSql into nUserId;\n\n3031: \n\n3032:     if cSql%found then\n\n3033:       if pnTyp = c_sk_vazba.TYP_Nakupca\
    \ and rSK.id_prod_man!=nUserId then\n\n3034:         -- update\n\n3035:         if pnUpdate=1 then\n\n3036:\
    \           update sklad_karta set id_prod_man=nUserId where id=rSK.id;\n\n3037:         -- return nUserId\n\
    \n3038:         else\n\n3039:           close cSql; return nUserId;\n\n3040:         end if;\n\n3041: \n\n3042:\
    \         if pnCommit=1 then commit; end if;\n\n3043:         --dbms_output.put_line('m'||nUserId);\n\n3044:\
    \       elsif pnTyp = c_sk_vazba.TYP_Zastupca and rSK.zastupca!=nUserId then\n\n3045:         -- update\n\n\
    3046:         if pnUpdate=1 then\n\n3047:           update sklad_karta set zastupca=nUserId where id=rSK.id;\n\
    \n3048:         -- return nUserId\n\n3049:         else\n\n3050:           close cSql; return nUserId;\n\n3051:\
    \         end if;\n\n3052: \n\n3053:         if pnCommit=1 then commit; end if;\n\n3054:         --dbms_output.put_line('z'||nUserId);\n\
    \n3055:       end if;\n\n3056:     end if;\n\n3057: \n\n3058:     close cSql;\n\n3059:   end loop;\n\n3060:\
    \ \n\n3061:   return nUserId;\n\n3062: \n\n3063: end SetNakupcu;\n\n3064: \n\n3065: procedure NastavNakupcu(pnId\
    \ number default null, pnTyp number default c_sk_vazba.TYP_Nakupca, pnCommit number default 1) is\n\n3066: \
    \  nUserID number;\n\n3067: begin\n\n3068:   nUserID := SetNakupcu(pnId=>pnId, pnTyp=>pnTyp, pnUpdate=>1, pdtDate=>sysdate,\
    \ pnCommit=>pnCommit);\n\n3069: end NastavNakupcu;\n\n3070: \n\n3071: function GetNakupca(pnId number, pdtDate\
    \ date default sysdate) return number is\n\n3072: begin\n\n3073:   return SetNakupcu(pnId=>pnId, pnTyp=>c_sk_vazba.TYP_Nakupca,\
    \ pnUpdate=>0, pdtDate=>pdtDate);\n\n3074: end GetNakupca;\n\n3075: \n\n3076: function GetZastupca(pnId number,\
    \ pdtDate date default sysdate) return number is\n\n3077: begin\n\n3078:   return SetNakupcu(pnId=>pnId, pnTyp=>c_sk_vazba.TYP_Zastupca,\
    \ pnUpdate=>0, pdtDate=>pdtDate);\n\n3079: end GetZastupca;\n\n3080: \n\n3081: function GetNakupnaCena(pnKodID\
    \ number) return number is\n\n3082:   nCena number;\n\n3083: begin\n\n3084:   nCena := CENOTVORBA.GetCenuCSkladKarta(nPart=>0,\
    \ snMiestoD=>C_CONST.NULA_MiestaDodania, nDruhDop=>0, nKodID=>pnKodID,\n\n3085:     p_sSarza=>null, p_sID_SZ=>C_CONST.NULA_SkladZasob,\
    \ pnPocet=>1, nMenaIn=>0, nKurzIn=>1,\n\n3086:     snSposobObjednania=>C_CONST.NULA_SposobObjednania,\n\n3087:\
    \     snSposobKontaktu=>C_CONST.NULA_SposobKontaktu, p_nSkladDokladu=>c_session.getsklad, bPredplnPrefCenu=>1,\n\
    \n3088:     dtDat=>c_session.getdtsysdate, nCennik=>-8, bPredplnCennikCenu=>1, p_nSDPH=>0, p_nTypMOC=>0, p_nCenaVstup=>0,\n\
    \n3089:     pnDodSkladKarta=>0 );\n\n3090:   return nvl(nCena,0);\n\n3091:   exception when others then\n\n\
    3092:     dbms_output.put_line('error '||sqlerrm);\n\n3093:     return 0;\n\n3094: end GetNakupnaCena;\n\n3095:\
    \ \n\n3096: function GetVOCena(pnKodID number) return number is\n\n3097:   sZakladnyVOCennik varchar2(2000);\n\
    \n3098:   nCena number;\n\n3099: begin\n\n3100:   sZakladnyVOCennik := C_INI.GetINI(1047);\n\n3101:   dbms_output.put_line(sZakladnyVOCennik);\n\
    \n3102:   if sZakladnyVOCennik is not null then\n\n3103:     execute immediate 'select '||sZakladnyVOCennik||'\
    \ from sklad_karta sk where sk.s_stamp = ''0''\n\n3104:       and sk.id = '||pnKodID into nCena;\n\n3105:  \
    \ end if;\n\n3106:   return nvl(nCena,0);\n\n3107:   exception when others then\n\n3108:     dbms_output.put_line('error\
