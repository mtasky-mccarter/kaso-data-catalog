    \ 0 then\n\n6985:       KontrolaNahradzaKartu(pnID=>to_number(psPK), pnKodID_NK=>nKodID_NK, pnHlasit=>1, pnKodID=>nExist);\n\
    \n6986:     end if;\n\n6987: \n\n6988:    c_cis.GetFieldValue(psFieldName=>'POLOHA',psValues=>sValues, pnExist=>nExist,\
