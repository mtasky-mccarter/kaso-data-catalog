    6999:          sFlagNew := GetFB_PreberajLogParZArtSkup(psFLAGS_B=>sFlagNew);\n\n7000:          if sFlagNew\
    \ = 1 and sFlagDB = 0 then\n\n7001:            c_cis.RemoveField(psFieldName=>'TYP_PS', psValues=>sValues);\n\
    \n7002:          end if;\n\n7003:       end if;\n\n7004:     end if;\n\n7005: \n\n7006: \t\t-- menim flags_b\
