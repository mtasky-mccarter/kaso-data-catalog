    \n51:           psPomenovanie_new=>:new.pomenovanie,\n\n52:           psP_jednotka_new=>:new.p_jednotka,\n\n\
    53:           pnU_typ=>:new.t_tovaru,\n\n54:           pnTyp_KV=>null,\n\n55:           psInt_kod_old=>:old.int_kod,\n\
    \n56:           psNazov_old=>:old.nazov,\n\n57:           psPomenovanie_old=>:old.pomenovanie);\n\n58:     \
    \    exception when others then\n\n59:           debugpckerror('T_SKLAD_KARTA_AFTER_MC', 'UPD', :new.id, :old.int_kod,\
    \ :new.int_kod);\n\n60:           return;\n\n61:       end;\n\n62:     end if;\n\n63:   end if;\n\n64:     \
