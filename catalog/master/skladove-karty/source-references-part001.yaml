    \n5656:         if pnCommit = 1 then\n\n5657:             commit;\n\n5658:         end if;\n\n5659:     else\
    \ -- skupinove sklady / vsetky\n\n5660:         for r in (select id From bartex_pobocky where id >= 0 and lokacia\
    \ = c_session.GetLokacia and typ in (0, 1, 2) and s_stamp = '0'\n\n5661:           and c_sklad.IsSkladInSkupSklad(pnSklad=>id,\
    \ pnSkupSklad=>pnSklad)=1)\n\n5662:         loop\n\n5663:             d_rek_dod_l.GenerujPriceProtecting(psPodmSkladKarta=>sPodmSk,\
