    \ skladu\n\n2799:   if nZasobovaciSklad is null then\n\n2800:     -- ak nenajde ani zo skladu, tak beriem z\
    \ MD na sklade pole (vybavuje_sklad)\n\n2801:     select zasobovaci_sklad, (select vybavuje_sklad from miesta_dodania\
    \ where rid = miesto_dod)\n\n2802:     into nZasobovaciSklad, nVybavujeSklad from bartex_pobocky where id =\
    \ nvl(pnSklad, c_session.getsklad);\n\n2803:   end if;\n\n2804:   --\n\n2805:   return nvl(nZasobovaciSklad,\
    \ nVybavujeSklad);\n\n2806: end GetZasobovaciSklad;\n\n2807: \n\n2808: procedure GetObjednavaSa_Int(pnKodID\
    \ number, pnSklad number default null, psSarza varchar2 default null,\n\n2809:   pnObjDod out number, pnObjVO\
    \ out number) is\n\n2810:   nStav number;\n\n2811: begin\n\n2812:   if pnKodID = rObjZ.m_nKOD_ID\n\n2813:  \
    \   and ((pnSklad is not null and rObjZ.m_nSKLAD is not null and pnSklad = rObjZ.m_nSKLAD)\n\n2814:       or\
    \ (pnSklad is null and rObjZ.m_nSKLAD is null))\n\n2815:     and ((psSarza is not null and rObjZ.m_sSARZA is\
    \ not null and psSarza = rObjZ.m_sSARZA)\n\n2816:       or (psSarza is null and rObjZ.m_sSARZA is null))  then\n\
    \n2817:     pnObjDod := rObjZ.m_nObjSaZ_DOD;\n\n2818:     pnObjVO := rObjZ.m_nObjSaZ_VO;\n\n2819:     return;\
    \ -- vyskakujem, bic sa nezmenilo\n\n2820:   end if;\n\n2821: \n\n2822:   pnObjDod :=0; pnObjVO :=0;\n\n2823:\
    \   -- pozeram ci existuje zaznam v sk_log_udaje\n\n2824:   begin\n\n2825:     select stav_sk, ObjDod, ObjVO\
    \ into nStav, pnObjDod, pnObjVO\n\n2826:       from (select stav_sk, c_sk_log_udaj.GetFB_MozeSaObjNaDod(flags_b,\
    \ id) ObjDod,\n\n2827:       c_sk_log_udaj.GetFB_PobocMozeObjNaVO(flags_b, id) ObjVO from sk_log_udaje where\
    \ s_stamp = '0' and kod_id = pnKodID\n\n2828:       and sklad_p = nvl(pnSklad, c_session.getsklad) and (sarza\
    \ is null or sarza = psSarza)\n\n2829:       and (sort_skupina != C_Const.NULA_Sort_Skupina or exp_poloha !=\
    \ C_const.NULA_Poloha\n\n2830:       or typ_vp_polohy != C_Const.NULA_Typ_VP_Polohy or mnozstvo_exp_poloha !=\
    \ 0\n\n2831:       or sirka_vyuzitia != 0 or zasobovaci_sklad is not null or stav_sk is not null) order by sarza)\n\
    \n2832:     where rownum = 1;\n\n2833:     dbms_output.put_line('Prechadzam sk_log_udaj...');\n\n2834:     --\
    \ nasiel som log. udaj sk. --> testujem jeho nastavenie\n\n2835:     if pnObjDod = 0 and pnObjVO = 0 then\n\n\
    2836:      -- v nastaveni log.udaja nieje nic --> pozeram nastavenie na stave sk na log.udaji\n\n2837:     \
    \  if nStav is not null then\n\n2838:         select c_stav_sk.GetFB_MozeSaObjNaDod(flags_b, id), c_stav_sk.GetFB_PobocMozeObjNaVO(flags_b,\
    \ id) into pnObjDod, pnObjVO\n\n2839:         from stavy_sk where id = nStav;\n\n2840:         dbms_output.put_line('Prechadzam\
    \ stav na sk_log_udaj...'||pnObjDod||' '||pnObjVO);\n\n2841:       end if;\n\n2842:     end if;\n\n2843:   exception\
    \ when no_data_found then\n\n2844:     null; -- nenaslo log.udaj, riesim priamo skladovu kartu\n\n2845:   end;\n\
    \n2846: \n\n2847:   -- ak nenaslo nikde v log.udaji ani na jeho stave, hladam este v nastaveniach na skladovej\
    \ karte\n\n2848:   if pnObjDod = 0 and pnObjVO = 0 then\n\n2849:     select C_FLAGS.fgetflagsstate(flags_b,\
    \ 37), C_FLAGS.fgetflagsstate(flags_b, 34), stav into pnObjDod, pnObjVO, nStav\n\n2850:     from sklad_karta\
    \ where id = pnKodID;\n\n2851:     dbms_output.put_line('Prechadzam sklad_kartu...');\n\n2852:     -- naposledy\
    \ hladam este v stave skladovej karty (nepouzivam funkciu GetStavSkladovejKarty ale konkretny stav sk )\n\n\
    2853:     if pnObjDod = 0 and pnObjVO = 0 then\n\n2854:       select c_stav_sk.GetFB_MozeSaObjNaDod(flags_b,\
    \ id), c_stav_sk.GetFB_PobocMozeObjNaVO(flags_b, id) into pnObjDod, pnObjVO\n\n2855:       from stavy_sk where\
    \ id = nStav;\n\n2856:       dbms_output.put_line('Prechadzam stav na sklad_karta...');\n\n2857:     end if;\n\
    \n2858:   end if;\n\n2859:   -- nastavim globalne premenne\n\n2860:   rObjZ.m_nObjSaZ_DOD := pnObjDod;\n\n2861:\
    \   rObjZ.m_nObjSaZ_VO := pnObjVO;\n\n2862:   rObjZ.m_nKOD_ID := pnKodID;\n\n2863:   rObjZ.m_nSKLAD := pnSklad;\n\
    \n2864:   rObjZ.m_sSARZA := psSarza;\n\n2865: end GetObjednavaSa_Int;\n\n2866: \n\n2867: function GetObjednavaSaZ_DOD(pnKodID\
    \ number, pnSklad number default null, psSarza varchar2 default null) return number is\n\n2868:   nObjD number;\n\
    \n2869:   nObjVO number;\n\n2870: begin\n\n2871:   GetObjednavaSa_Int(pnKodID=>pnKodID, pnSklad=>pnSklad, psSarza=>psSarza,\
    \ pnObjDod=>nObjD, pnObjVO=>nObjVO);\n\n2872:   return nObjD;\n\n2873: end GetObjednavaSaZ_DOD;\n\n2874: \n\n\
    2875: function GetObjednavaSaZ_VO(pnKodID number, pnSklad number default null, psSarza varchar2 default null)\
    \ return number is\n\n2876:   nObjD number;\n\n2877:   nObjVO number;\n\n2878: begin\n\n2879:   GetObjednavaSa_Int(pnKodID=>pnKodID,\
    \ pnSklad=>pnSklad, psSarza=>psSarza, pnObjDod=>nObjD, pnObjVO=>nObjVO);\n\n2880:   return nObjVO;\n\n2881:\
    \ end GetObjednavaSaZ_VO;\n\n2882: \n\n2883: procedure GetMozeObjednatOdb_Int(pnKodID number, pnSklad number\
    \ default null, psSarza varchar2 default null) is\n\n2884:   nMozeObjO number; nMozeObjO_WWW number; nStav number;\n\
    \n2885: begin\n\n2886:   if pnKodID = rObjMO.m_nKOD_ID\n\n2887:     and ((pnSklad is not null and rObjMO.m_nSKLAD\
    \ is not null and pnSklad = rObjMO.m_nSKLAD)\n\n2888:       or (pnSklad is null and rObjMO.m_nSKLAD is null))\n\
    \n2889:     and ((psSarza is not null and rObjMO.m_sSARZA is not null and psSarza = rObjMO.m_sSARZA)\n\n2890:\
    \       or (psSarza is null and rObjMO.m_sSARZA is null))  then\n\n2891:     return;\n\n2892:     -- vyskakujem,\
    \ bic sa nezmenilo\n\n2893:   end if;\n\n2894: \n\n2895:   -- pozeram ci existuje zaznam v sk_log_udaje\n\n\
    2896:   begin\n\n2897:     select stav_sk into nStav\n\n2898:       from (select stav_sk from sk_log_udaje where\
    \ s_stamp = '0' and kod_id = pnKodID\n\n2899:       and sklad_p = nvl(pnSklad, c_session.getsklad) and (sarza\
    \ is null or sarza = psSarza)\n\n2900:       and (sort_skupina != C_Const.NULA_Sort_Skupina or exp_poloha !=\
    \ C_const.NULA_Poloha\n\n2901:       or typ_vp_polohy != C_Const.NULA_Typ_VP_Polohy or mnozstvo_exp_poloha !=\
    \ 0\n\n2902:       or sirka_vyuzitia != 0 or zasobovaci_sklad is not null or stav_sk is not null) order by sarza)\n\
    \n2903:     where rownum = 1;\n\n2904:     -- nasiel som log. udaj sk. --> testujem jeho nastavenie\n\n2905:\
    \     -- pozeram nastavenie na stave sk na log.udaji\n\n2906:     if nStav is not null then\n\n2907:       select\
    \ c_stav_sk.GetFB_MozeObjOdb(flags_b, id), c_stav_sk.GetFB_MozeObjOdb_WWW(flags_b, id) into nMozeObjO, nMozeObjO_WWW\
    \ from stavy_sk where id = nStav;\n\n2908:     end if;\n\n2909:   exception when no_data_found then\n\n2910:\
    \     null; -- nenaslo log.udaj, riesim priamo skladovu kartu\n\n2911:   end;\n\n2912: \n\n2913:   -- ak nenaslo\
    \ nikde v log.udaji ani na jeho stave, hladam este v nastaveniach na skladovej karte\n\n2914:   if nMozeObjO\
    \ is null then\n\n2915:     -- naposledy hladam este v stave skladovej karty (nepouzivam funkciu GetStavSkladovejKarty\
    \ ale konkretny stav sk )\n\n2916:     select c_stav_sk.GetFB_MozeObjOdb(flags_b, id), c_stav_sk.GetFB_MozeObjOdb_WWW(flags_b,\
    \ id) into nMozeObjO, nMozeObjO_WWW from stavy_sk\n\n2917:       where id = (select sk.stav from sklad_karta\
    \ sk where sk.id = pnKodID);\n\n2918:     --dbms_output.put_line('Prechadzam stav na sklad_karta...');\n\n2919:\
    \   end if;\n\n2920:   -- nastavim globalne premenne\n\n2921:   rObjMO.m_nMozeObjOdb := nMozeObjO;\n\n2922:\
    \   rObjMO.m_nMozeObjOdb_WWW := nMozeObjO_WWW;\n\n2923:   rObjMO.m_nKOD_ID := pnKodID;\n\n2924:   rObjMO.m_nSKLAD\
    \ := pnSklad;\n\n2925:   rObjMO.m_sSARZA := psSarza;\n\n2926: end GetMozeObjednatOdb_Int;\n\n2927: \n\n2928:\
    \ function GetMozeObjednatOdb(pnKodID number, pnSklad number default null, psSarza varchar2 default null) return\
