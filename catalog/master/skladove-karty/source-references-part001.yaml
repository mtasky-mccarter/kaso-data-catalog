    \ pcIDs, pstart=> null, pend=> ',');\n\n7745: \tVytvorStahovackuOut(prID=> rID, pnSKLAD_KAM=> pnSKLAD_KAM, pnSKLAD_ODKIAL=>\
    \ pnSKLAD_ODKIAL, pnSposob=> pnSposob, pnpocet=> pnPOCET,\n\n7746: \t\tpspopis=> psPOPIS,pnVytvorPrikaz=> pnVytvorPrikaz,\
    \ psPOZN=> psPOZN, pnPRIKAZ_IBA_SKLADOM=> pnPRIKAZ_IBA_SKLADOM, prRidPrikaz=> rRIDPrikaz, prID_SQ=> rID_SQ,\n\
    \n7747: \t\tpsDOVOD_RP=> psDOVOD_RP, pnPartner_Kam=> pnPartner_Kam, pnTYP_CENY=>pnTYP_CENY, pnCENA=>pnCENA);\n\
    \n7748: end VytvorStahovacku;\n\n7749: \n\n7750: \n\n7751: function getPredajSektorBySK_ID(pnSK_ID number, pnFlag\
    \ number default null) return varchar2 is\n\n7752:  sPS  varchar2(16);\n\n7753: begin\n\n7754:  begin\n\n7755:\
    \   with SkladKarta as (select sk.typ_ps, sk.art_skup, nvl(pnFlag, substr(flags_b, c_sklad_karta.FLAGS_B_PreberajLogParZArtSkup,1))sk_flag\
    \ from sklad_karta sk where sk.id = pnSK_ID),\n\n7756:       art_skup as (select a.typ_ps, substr(a.flags_b,1,1)\
    \ as_flag, a.id_kat_s  from art_skupiny a, SkladKarta sk where a.id = sk.art_skup  ),\n\n7757:       kat_sort\
    \ as ( select k.typ_ps from sklad_kat_s k, art_skup a where  k.id = a.id_kat_s)\n\n7758:   select decode(s.sk_flag,\
    \ 0, s.typ_ps, decode(a.as_flag, 0, a.typ_ps, k.typ_ps)) into sPS from SkladKarta s left join art_skup a on\
    \ (1=1) left join kat_sort k on (1=1);\n\n7759:  exception when no_data_found then sPS := null;\n\n7760:  end;\n\
    \n7761:  return sPS;\n\n7762: end;\n\n7763: \n\n7764: function GetCenaSklad(pnID number, pnC_M number default\
    \ null, pnCenaS number, pdtDatum date default c_session.getdtsysdate) return number is\n\n7765: \tnCenaS number\
    \ := pnCenaS;\n\n7766: \tnC_M number := pnC_M;\n\n7767: begin\n\n7768: \tif nCenaS is null then\n\n7769: \t\t\
    nCenaS := c_cennik_popis.getcenucennika_c(pnIDCennik=>0, p_nKodId=>pnID, p_sID_SZ=>'0000', p_dtDatCeny=>pdtDatum,\
    \ pr_nMenaIn=>0, p_nKurzIn=>1, p_bPodlaCennikaRound=>1, p_bPodlaCennikaSDPH=>0, pnDodavatel=>null);\n\n7770:\
    \ \t\tif nCenaS = 0 then\n\n7771: \t\t\tif nC_M is null then\n\n7772: \t\t\t\tselect sk.c_m into nC_M from sklad_karta\
    \ sk where sk.id = pnID;\n\n7773: \t\t\tend if;\n\n7774: \t\t\tnCenaS := nC_M;\n\n7775: \t\tend if;\n\n7776:\
    \ \tend if;\n\n7777: \treturn nCenaS;\n\n7778: end GetCenaSklad;\n\n7779: \n\n7780: function ValidujPocet(pnKOD_ID\
    \ number,pnPOCET number,pnLEN_KLADNE number default 0,pnLEN_NENULOVE number default 0,psRID_V varchar2 default\
    \ null,pnRaiseError number default 1) return varchar2\n\n7781: is\n\n7782: sRET varchar2(500);\n\n7783: begin\n\
    \n7784: \tif(pnPOCET is null)then\n\n7785: \t\treturn null;\n\n7786: \tend if;\n\n7787: \tif( pnLEN_NENULOVE\
    \ = 1 AND pnPOCET=0) then\n\n7788: \t\t\tsRET := 'Počet' || pnPOCET || ' musí byť nenulový';\n\n7789: \telsif(\
    \ pnLEN_KLADNE = 1 AND pnPOCET<0) then\n\n7790: \t\t\tsRET := 'Počet ' || pnPOCET || ' musí byť kladný.';\n\n\
    7791: \telse\n\n7792: \t\tSELECT 'Počet ' || pnPOCET || ' nie je možné zadať. Tovar sa eviduje na ' || SK.ZLOMKY_SKALA\
    \ || ' des. miest.' INTO sRET\n\n7793: \t\t\tFROM SKLAD_KARTA SK WHERE ID=pnKOD_ID AND C_SKLAD_KARTA.GetRoundPocet(pnKODID=>SK.ID,pnPOCET=>\
    \ pnPOCET,pnsposobzaokruhlovania=>C_SKLAD_KARTA.TYP_ZAOKRUHLOVANIA_ARITMETICKY)<>pnPOCET;\n\n7794: \tend if;\n\
    \n7795: \tif(sRET is not null AND pnRaiseError = 1) then\n\n7796: \t\tc_Exc.RAISEERRORMSG(sRET,psPK=>pnKOD_ID);\n\
    \n7797: \tend if;\n\n7798: \treturn sRET;\n\n7799: exception when no_Data_found then\n\n7800: \treturn null;\n\
    \n7801: end ValidujPocet;\n\n7802: \n\n7803: procedure ZmenUctovnyTypSK(pcKOD_ID clob, pnUCT_TYP number, pnOTAZKA_POKRACOVAT\
    \ number default null) is\n\n7804: \tsKarty varchar2(10000);\n\n7805: \ttxKOD_ID num_pole;\n\n7806: \ttxHodnota\
    \ num_pole;\n\n7807: begin\n\n7808: \tif pcKOD_ID is null then\n\n7809: \t\tc_exc.raiseerrormsgid(4503); --\
    \ Nie je zadaný identifikátor skladovej karty ! \\\\45911\n\n7810: \telsif pnUCT_TYP is null then\n\n7811: \t\
    \tc_exc.raiseerrormsgid(4504); -- Nie je zadaný účtovný typ skladovej karty ! \\\\45912\n\n7812: \tend if;\n\
    \n7813: \n\n7814: \t-- naplnim si pole kartami/hodnotami kariet, ktore vyzaduju potvrdenie hlasky lebo maju\
    \ nejaku nenulovu hodnotu na skladoch\n\n7815: \tif pnOTAZKA_POKRACOVAT is null then\n\n7816: \t\tselect id,\
    \ hodnota bulk collect into txKOD_ID, txHodnota from (\n\n7817: \t\t\tselect sk.id as id,\tnvl((select sum(sz.p_2*sz.c_p)\
    \ from sklad_zasob sz where sz.kod_id = sk.id), 0) as hodnota\n\n7818: \t\t\tfrom sklad_karta sk where sk.id\
    \ in (select column_value as kod_id from table(ppf.GetClobTokensTbl(pcKOD_ID, ',') ))\n\n7819: \t\t) where hodnota\
    \ > 0;\n\n7820: \n\n7821: \t\tif txKOD_ID.count > 0 then\n\n7822: \t\t\tfor i in 1..txKOD_ID.count loop\n\n\
    7823: \t\t\t\tsKarty := sKarty || c_const.CRLF || c_rid.GetCis_Link(psPK=>txKOD_ID(i), psCisId=>CIS_SKLAD_KARTA)||\
    \ c_const.CRLF ||'Hodnota: '||to_char(txHodnota(i),'FM99999999999990.00')||'€';\n\n7824: \t\t\t\tif i = 3 and\
    \ txKOD_ID.count > 3 then -- max 3 karty zobrazim\n\n7825: \t\t\t\t\tsKarty := sKarty || chr(10) || '...';\n\
    \n7826: \t\t\t\t\texit;\n\n7827: \t\t\t\tend if;\n\n7828: \t\t\tend loop;\n\n7829: \t\t\t-- Na skladoch sa momentálne\
    \ nachádzajú nasledujúce skladové karty (%s) vo vyčíslených hodnotách: %s\n\n7830: \t\t\t-- V prípade, že sa\
    \ s účtovným typom skladovej karty zmenia aj skladové účty, \\nbude nutné túto hodnotu ručne preúčtovať !\n\n\
    7831: \t\t\t-- Chcete pokračovať ? \\\\45913\n\n7832: \t\t\tc_exc.RaiseActionMsg(pnIdMsg=>4505, psActionYes=>'R:pnOTAZKA_POKRACOVAT;1;OTAZKA_POKRACOVAT;1',\n\
    \n7833: \t\t\t\t\t\t    psActionNo=>'', psNParams=>null, psMsgParams=>null, psMsgP1=>txKOD_ID.count, psMsgP2=>sKarty,\n\
    \n7834: \t\t\t\t\t\t    psFormQuestion=>null, psTextYes=>'Pokračuj', psTextNo=>'Koniec');\n\n7835: \t\tend if;\n\
    \n7836: \telsif pnOTAZKA_POKRACOVAT != 1 then\n\n7837: \t\treturn; -- toto by nemalo nastat (je mozne len null/1)\n\
    \n7838: \tend if;\n\n7839: \n\n7840: \t-- zmena uctovneho typu\n\n7841: \tfor rSK in (select sk.id, sk.t_tovaru\
    \ as uct_typ_old\n\n7842: \t\tfrom sklad_karta sk where sk.id in (select column_value as kod_id from table(ppf.GetClobTokensTbl(pcKOD_ID,\
    \ ',') ) ) ) loop\n\n7843: \t\tif rSK.uct_typ_old != pnUCT_TYP then\n\n7844: \t\t\tupdate sklad_karta set t_tovaru\
    \ = pnUCT_TYP where id = rSK.id;\n\n7845: \t\t\t--\n\n7846: \t\t\tinsert into zmeny_dokladov (id_d, druh_d,\
    \ datum, id_u, typ_zmeny) values (rSK.id, cis_sklad_karta, sysdate, c_session.getuser, 1);\n\n7847: \t\tend\
    \ if;\n\n7848: \tend loop;\n\n7849: end ZmenUctovnyTypSK;\n\n7850: \n\n7851: function GetFB_ZadavatExpPriVyskl(psFLAGS_B\
    \ varchar2 default null, pnID number default null)return number is\n\n7852: \tsFlags_b varchar2(254) := psFLAGS_B;\n\
    \n7853: begin\n\n7854: \tif psFLAGS_B is null then\n\n7855: \t\tif pnID is null then\n\n7856: \t\t\tc_exc.raiseerrormsg('Nezadané\
