    \  nNahrada number;\n\n2128:  sIdHist varchar2(16);\n\n2129:  nVazeny number(1,0);\n\n2130:  nKodId number;\n\
    \n2131:  begin\n\n2132: \n\n2133: -- overime unicitu DOD_KODu\n\n2134: \n\n2135: begin\n\n2136:  SELECT ID INTO\
    \ nKodId FROM SKLAD_KARTA WHERE c_sklad_karta.GetDodavatel(pnID=>ID, pnDodavatel=>DOD_SK)=pnDOD_SK AND DOD_KOD=psDOD_KOD\
    \ AND ROWNUM=1;\n\n2137:  raise_application_error(-20001,'Už máte zaevidovaný produkt s dodav. kódom <B><A href=\"\
    #\" onClick=\"Detail(9050,''PK;' || nKodId || ''')\">detail...</A></B>');\n\n2138: exception\n\n2139:      when\
    \ no_data_found then\n\n2140:         nKodId := null;\n\n2141: end;\n\n2142: \n\n2143: \n\n2144: -- vygenerujeme\
    \ IntKod/BobiKod\n\n2145:     if( pnIdLevel is not null ) then\n\n2146:         -- vygenerujeme IntKod/BobiKod\n\
    \n2147:           sIntKod :=   GetBobiCode(pnIdLevel);\n\n2148:     else\n\n2149:            sIntKod := psINT_KOD;\n\
    \n2150:     end if;\n\n2151: \n\n2152: \n\n2153:   Copy(pnMUSTRA_KOD_ID,pnNewKodID,sIntKod,psNazov,pnSklad);\n\
    \n2154: \n\n2155:   nNahrada := NVL(pnNAHRADA,0);\n\n2156: \n\n2157:   if( pnIdLevel = 1 ) then\n\n2158:   \
    \  nVazeny :=1;\n\n2159:   else\n\n2160:     nVazeny := 0;\n\n2161:   end if;\n\n2162: \n\n2163:    UPDATE SKLAD_KARTA\
    \ SET BALENIE=pnBALENIE,CEN_SKUPINA=pnCEN_SKUPINA,COL_SADZBA=pnCOL_SADZBA,C_1=pnC_1,\n\n2164:     C_2=pnC_2,C_3=pnC_3,C_4=pnC_4,C_5=pnC_5,C_EKV=pnC_EKV,C_M=pnC_M,C_N=pnC_N,DATUM_MINMAX=pdtDATUM_MINMAX,\n\
    \n2165:     DOD_KOD=psDOD_KOD,DOD_SK=pnDOD_SK,DPH=pnDPH,DRUH=psDRUH,FARBY=psFARBY,FLAGS=psFLAGS,HMOTNOST=pnHMOTNOST,\n\
    \n2166:     KALKUL_P=pnKALKUL_P,MAKRO=psMAKRO,MENA_SK=pnMENA_SK,NAZOV=psNAZOV,ODPIS_SK=pnODPIS_SK,\n\n2167:\
    \     PAR_1=pnPAR_1,PAR_2=pnPAR_2,PAR_STR_1=psPAR_STR_1,PAR_STR_2=psPAR_STR_2,POLOHA=psPOLOHA,POMENOVANIE=psPOMENOVANIE,\n\
    \n2168:     PREF_CENA=pnPREF_CENA,P_JEDNOTKA=psP_JEDNOTKA,SKALA=psSKALA,SKLAD=pnSKLAD,SMER=pnSMER,TECHINFO=psTECHINFO,\n\
    \n2169:     TYP_T=psTYP_T,T_TOVARU=pnT_TOVARU,USED=pnUSED,VELKE_BAL=pnVELKE_BAL,VYROBCA=pnVYROBCA,ZALOZENA=pdtZALOZENA,\n\
    \n2170:     ZARUKA=pnZARUKA,ZLAVA_ID=pnZLAVA_ID,ZLAVA_MIN_POC=pnZLAVA_MIN_POC,ZLAVY=pnZLAVY,ZMENENE=pnZMENENE,\n\
    \n2171:     DOD_BAL=pnDOD_BAL,VRSTVA_BAL=pnVRSTVA_BAL,NAHRADA=nNAHRADA,ID_PROD_MAN=pnID_PROD_MAN,ZARUKA_OBD=pnZARUKA_OBD,\n\
    \n2172:     URL=psURL,KOD_ID_OBALU=pnKOD_ID_OBALU,UROVEN_DPH=pnUROVEN_DPH/*,SORT_SKUPINA=psSORT_SKUPINA*/,PALETA_BAL=pnPALETA_BAL,\n\
    \n2173:     HLBKA=pnHLBKA,SIRKA=pnSIRKA,VYSKA=pnVYSKA,STAV=pnSTAV,MNOZSTVO_DMJ=pnMNOZSTVO_DMJ,KRAJINA_P=pnKRAJINA_P,POZN=psPOZN,\n\
    \n2174:     HMOTNOST_NETTO =  pnHmotnostNetto,OBJEM_NETTO = pnObjemNetto , MNOZSTVO_ALKOHOLU = pnMnozstvoAlk\
    \ ,\n\n2175:     MNOZSTVO_CUKRU =  pnMnozstvoCukr , DOBA_NAK = pnDobaNak ,OBJEM = pnOBJEM,\n\n2176:     KIR_1=pnKIR1,KIR_2=pnKIR2,KIR_3=pnKIR3,KIR_4=pnKIR4,KIR_5=pnKIR5,\n\
    \n2177:     FLAGS_B = SUBSTR(psFlagsB,1,5) || nVazeny || SUBSTR(psFlagsB,7)\n\n2178:     WHERE ID=pnNewKodID;\n\
    \n2179: \n\n2180:     pnID := pnNewKodID;\n\n2181:      SELECT RID INTO psRID FROM SKLAD_KARTA WHERE ID=pnNewKodID;\n\
    \n2182: \n\n2183:      if( pnIdLevel is not null ) then\n\n2184:      --  C_MANAGER_HIST.insc(1,sIdHist,null,pnsklad,null,psRid,'zaevidovanie',MHT_ZaevidovanieSK,'0');\n\
    \n2185:        C_MANAGER_HIST.InsT(pnkladne=>1,psid=>sIdHist,pnsklad=>pnSklad,psmanager=>psRid,pspopis=>'zaevidovanie',\n\
    \n2186:         pstyp=>MHT_ZaevidovanieSK,psx_stamp=>'0');\n\n2187:      end if;\n\n2188: \n\n2189: \n\n2190:\
    \ end InsWWW;\n\n2191: \n\n2192: function MozemMenitObal (pnKarta number, pnObal number) return number\n\n2193:\
    \ is\n\n2194:   nPom number;\n\n2195: begin\n\n2196:   -- funkcia vrati 1 ak je dostatok obalov inac 0\n\n2197:\
    \   select count(*) into nPom from\n\n2198:   (select sklad, sum(p_1) K,\n\n2199:   (select nvl(sum(szo.p_1),0)\
    \ from sklad_zasob szo where sz.sklad=szo.sklad and szo.kod_id=pnObal) O\n\n2200:   from sklad_zasob sz where\
    \ kod_id in\n\n2201:   (select sk.id from sklad_karta sk where sk.kod_id_obalu=pnObal or sk.id =pnKarta )\n\n\
    2202:   group by sklad) s where s.o<s.k;\n\n2203: \n\n2204:   IF nPom > 0 THEN\n\n2205:     RETURN 0;\n\n2206:\
    \   ELSE\n\n2207:     RETURN 1;\n\n2208:   END IF;\n\n2209: end MozemMenitObal;\n\n2210: \n\n2211: procedure\
    \ NastavC_Stamp (pnKod_id number)\n\n2212: is\n\n2213:   nSwapOld number;\n\n2214: begin\n\n2215:   nSwapOld\
    \ := C_Session.GetSwap;\n\n2216:   C_Session.SetSwap(2);\n\n2217:   -- koli tomu aby som vedel osetrit trigger\
    \ na zmenu U_STAMP\n\n2218:   update sklad_karta set C_Stamp = '1'||substr(C_STAMP,2) where id=pnKod_id;\n\n\
    2219:   C_Session.SetSwap(nSwapOld);\n\n2220: end NastavC_Stamp;\n\n2221: \n\n2222: procedure NastavC_Stamp_ZmenaKurzu\
    \ (pnMena number)\n\n2223: is\n\n2224:   /*\n\n2225:   CURSOR cDod is select  distinct d.kod_id from sklad_dodavatel\
    \ d, sklad_karta sk where mena=pnMena AND\n\n2226:   sk.dod_sk=d.id_dodavatela AND sk.id=d.kod_id AND d.used=1;\n\
    \n2227: \n\n2228:   CURSOR cNK is select distinct np.kod_id from sk_nakl_polozky np, nakl_koef nk\n\n2229: \
    \  where np.nk_id=nk.id and np.s_stamp='0' and nk.mena=pnMena;\n\n2230:   */\n\n2231: \n\n2232:   CURSOR cAll\
    \ IS select distinct kod_id from (\n\n2233:   select /*+INDEX (d x_sklad_dodavatel_mena)*/ d.kod_id from sklad_dodavatel\
    \ d, sklad_karta sk where mena=pnMena AND\n\n2234:   c_sklad_karta.GetDodavatel(pnID=>SK.ID, pnDodavatel=>SK.DOD_SK)=d.id_dodavatela\
    \ AND sk.id=d.kod_id AND d.s_stamp = '0' union all\n\n2235:   select np.kod_id from sk_nakl_polozky np, nakl_koef\
    \ nk\n\n2236:   where np.nk_id=nk.id and np.s_stamp='0' and nk.mena=pnMena);\n\n2237: begin\n\n2238:   -- spusta\
    \ ak sa zmeni kurz na obchodnej kurzovej sade\n\n2239: \n\n2240:   /*\n\n2241:   -- treba prejst vsetky dod\
    \ ceny\n\n2242:   FOR R IN cDod LOOP\n\n2243:     NastavC_Stamp(R.KOD_ID);\n\n2244:   END LOOP;\n\n2245:   --\
    \ teraz prezrem vsetky nakl. koef\n\n2246:   FOR R IN cNK LOOP\n\n2247:     NastavC_Stamp(R.KOD_ID);\n\n2248:\
    \   END LOOP;\n\n2249:   */\n\n2250: \n\n2251:   FOR R IN cAll LOOP\n\n2252:     NastavC_Stamp(R.KOD_ID);\n\n\
    2253:   END LOOP;\n\n2254: end NastavC_Stamp_ZmenaKurzu;\n\n2255: \n\n2256: procedure NastavC_Stamp_ZmenaNaklKoef\
    \ (sNaklKoef varchar2)\n\n2257: is\n\n2258:   CURSOR cSK_N_P IS select kod_id from SK_NAKL_POLOZKY where NK_ID=sNaklKoef\
    \ and S_Stamp='0';\n\n2259: begin\n\n2260:   -- spusta sa ak sa meni nakladovy koeficient\n\n2261:   FOR R IN\
    \ cSK_N_P LOOP\n\n2262:     NastavC_Stamp(R.KOD_ID);\n\n2263:   END LOOP;\n\n2264: end NastavC_Stamp_ZmenaNaklKoef;\n\
    \n2265: \n\n2266: procedure NastavCN_Stamp (pnKod_id number, pnCena number)\n\n2267: is\n\n2268:   nSwapOld\
    \ number;\n\n2269: begin\n\n2270:   IF pnCena in (1,2,3,4,5) THEN\n\n2271:     nSwapOld := C_Session.GetSwap;\n\
    \n2272:     C_Session.SetSwap(2);\n\n2273:     -- koli tomu aby som vedel osetrit trigger na zmenu U_STAMP\n\
    \n2274:     update sklad_karta set C_Stamp = substr(C_Stamp,1,pnCena)||'1'||substr(C_Stamp,pnCena+2) where id=pnKod_id;\n\
    \n2275:     C_Session.SetSwap(nSwapOld);\n\n2276:   END IF;\n\n2277: end NastavCN_Stamp;\n\n2278: \n\n2279:\
    \ procedure NastavCN_Stamp_CenSkupina (pnCen_Skupina number, pnCena number)\n\n2280: is\n\n2281:   cursor C\
    \ is select id from sklad_karta where cen_skupina=pnCen_Skupina;\n\n2282: begin\n\n2283:   FOR R IN C LOOP\n\
    \n2284:     NastavCN_Stamp(R.ID, pnCena);\n\n2285:   END LOOP;\n\n2286: end NastavCN_Stamp_CenSkupina;\n\n2287:\
    \ \n\n2288: procedure NastavUkoncenyPredaj (psPodmSkladZasob varchar2)\n\n2289: is\n\n2290: begin\n\n2291: \
    \  --4 na 8 ak nie je na sklade\n\n2292:   execute immediate 'UPDATE SKLAD_KARTA SK SET STAV=8 WHERE STAV=4\
    \ AND '||\n\n2293:   '(select nvl(sum(sz.p_2),0) from sklad_zasob sz where sz.kod_id=sk.id AND '\n\n2294:  \
    \ ||nvl(psPodmSkladZasob,'1=1')||') = 0';\n\n2295: end NastavUkoncenyPredaj;\n\n2296: \n\n2297: procedure PrepocitajCenuZMakra\
    \ (pnSK_ID number)\n\n2298: is\n\n2299:   nDodavatel number;\n\n2300:   nCenaNew number;\n\n2301:   nPom number;\n\
    \n2302: begin\n\n2303:   begin\n\n2304:     select c_sklad_karta.GetDodavatel(pnID=>ID, pnDodavatel=>DOD_SK)\
    \ into nDodavatel from sklad_karta where ID=pnSK_ID and c_sklad_karta.getvarianttypumakra(makro) > 0;\n\n2305:\
    \   exception when no_data_found then\n\n2306:     return; -- nie je co ratat, nie je to makor karta\n\n2307:\
    \   end;\n\n2308:   UPDATE MAKRO_OBSAH SET C_X=(SELECT C_X FROM SKLAD_KARTA WHERE ID = KOD_SK) where KOD_M =\
    \ pnSK_ID;\n\n2309: \n\n2310:   select sum(m.C_X*m.pocet), count(*) into nCenaNew, nPom from makro_obsah m,\
    \ sklad_karta sk where\n\n2311:   m.kod_m=pnSK_ID and m.kod_sk=sk.id and m.def_val=1 and m.S_STAMP = '0';\n\n\
    2312: \n\n2313:   IF nPom = 0 THEN\n\n2314:     RETURN; -- nie je obsah makra\n\n2315:   END IF;\n\n2316: \n\
    \n2317:   -- zmenit dodavatelsku cenu\n\n2318:   UPDATE SKLAD_DODAVATEL SET CENA_M=nCenaNew, MENA=0 WHERE KOD_ID=pnSK_ID\
    \ AND ID_DODAVATELA=nDodavatel AND s_stamp = '0';\n\n2319:   update SKLAD_KARTA set C_X = nCenaNew where ID\
    \ = pnSK_ID;\n\n2320: end PrepocitajCenuZMakra;\n\n2321: \n\n2322: function PristupUseraNaOP(pnKodID number,\
    \ pnUser number) return number is\n\n2323:   nPM number;\n\n2324:   nZ number;\n\n2325: begin\n\n2326:   select\
    \ ID_PROD_MAN, ZASTUPCA into nPM, nZ from SKLAD_KARTA where ID = pnKodID;\n\n2327:   if pnUser = nPM or pnUser\
    \ = nZ  then return 1; end if;\n\n2328:   if (c_user_vazba.JeNadriadeny( nPM, pnUser, 0)=1 or c_user_vazba.JeNadriadeny(\
    \ nZ, pnUser, 0)=1) then return 1; end if;\n\n2329:   return 0;\n\n2330: end PristupUseraNaOP;\n\n2331: \n\n\
    2332: procedure ZapisPripCenyNaSK( pnIDCennik number, pnKodID number, pnCena in out number, pbZapisOK in out\
    \ number ) is\n\n2333: \n\n2334:   cursor cCena is SELECT CENA FROM CENY_BUFFER WHERE KOD_ID = pnKodID AND CENNIK_ID\
    \ = pnIDCennik;\n\n2335: begin\n\n2336:   pbZapisOK := 0;\n\n2337:   for rC in cCena loop\n\n2338:     execute\
    \ immediate 'UPDATE SKLAD_KARTA SET C_'||pnIDCennik||' = '||rC.CENA||' WHERE SK_ID = '||pnKodID ;\n\n2339: \
    \    DELETE CENY_BUFFER WHERE CENNIK_ID = pnIDCennik AND KOD_ID = pnKodID;\n\n2340:     pnCena := round(rC.CENA,\
    \ 10);\n\n2341:     pbZapisOK := 1;\n\n2342:     commit;\n\n2343:   end loop;\n\n2344: end ZapisPripCenyNaSK;\n\
    \n2345: \n\n2346: procedure ZrusCN_Stamp (pnKod_id number, pnCena number)\n\n2347: is\n\n2348:   nSwapOld number;\n\
    \n2349: begin\n\n2350:   IF pnCena in (1,2,3,4,5) THEN\n\n2351:     nSwapOld := C_Session.GetSwap;\n\n2352:\
    \     C_Session.SetSwap(2);\n\n2353:     -- koli tomu aby som vedel osetrit trigger na zmenu U_STAMP\n\n2354:\
    \     update sklad_karta set C_Stamp = substr(C_Stamp,1,pnCena)||'0'||substr(C_Stamp,pnCena+2) where id=pnKod_id;\n\
    \n2355:     C_Session.SetSwap(nSwapOld);\n\n2356:   END IF;\n\n2357: end ZrusCN_Stamp;\n\n2358: \n\n2359: procedure\
    \ ZrusStareNovinky (pnPocetDni number)\n\n2360: is\n\n2361: begin\n\n2362:   -- procedura Zrusi na kartach stav\
    \ novinka ak su novinky starsie ako pnPocetDni\n\n2363:   UPDATE SKLAD_KARTA SET STAV=2 WHERE STAV=1 AND N_Stamp!='0'\
    \ AND C_STAMP.GetDatumC(N_Stamp)<trunc(sysdate)-pnPocetDni;\n\n2364: end ZrusStareNovinky;\n\n2365: \n\n2366:\
    \ \n\n2367: procedure ZmenPredajnyVariant(pnSK_ID number, pnTovarPolozka number, pnAko number)\n\n2368: is\n\
    \n2369:   nNahrada number;\n\n2370:   nPocetNahrad number;\n\n2371:   nID number;\n\n2372: begin\n\n2373:  \
    \ If pnTovarPolozka = pnSK_ID then\n\n2374:     update sklad_karta set hlavna_tp = id, flags_b = c_flags.fsetflagsstate(flags_b,41,1)\
    \ where id = pnSK_ID;\n\n2375:     return;\n\n2376:   end if;\n\n2377: \n\n2378:   -- pnAko: 0 zrusit   1 preniest\n\
    \n2379: \n\n2380:   If pnAko = 0 then\n\n2381:     update sklad_karta set hlavna_tp = pnTovarPolozka, flags_b\
    \ = c_flags.fsetflagsstate(flags_b,41,0) where id = pnSK_ID;\n\n2382:     update sklad_karta set hlavna_tp =\
    \ id,flags_b = c_flags.fsetflagsstate(flags_b,41,1) where hlavna_tp = pnSK_ID;\n\n2383:   Elsif pnAko = 1 then\n\
    \n2384:     update sklad_karta set hlavna_tp = pnTovarPolozka,flags_b = c_flags.fsetflagsstate(flags_b,41,0)\
    \ where id = pnSK_ID or hlavna_tp = pnSK_ID;\n\n2385:   end if;\n\n2386: \n\n2387:   -- Ekvivalent\n\n2388:\
    \   select nahrada into nNahrada from sklad_karta where id = pnSK_ID;\n\n2389:   If nNahrada = pnSK_ID then\n\
    \n2390:     select count(*) into nPocetNahrad from sklad_karta where nahrada = nNahrada and id != pnSK_ID;\n\
    \n2391:     If nPocetNahrad > 0 then\n\n2392:       select id into nID from sklad_karta where nahrada = pnSK_ID\
    \ and id != pnSK_ID and rownum = 1;\n\n2393:       update sklad_karta set nahrada = nID where nahrada = pnSK_ID\
    \ and id != pnSK_ID;\n\n2394:     end if;\n\n2395:   end if;\n\n2396:   update sklad_karta set nahrada = pnSK_ID\
    \ where id = pnSK_ID;\n\n2397: \n\n2398: end ZmenPredajnyVariant;\n\n2399: \n\n2400: \n\n2401: procedure RozpisBaleniaOut(\
    \ pnKodID number, pnPocet number, psBalenie out varchar2, pnP_kusy out number, pnP_Bal out number ) is\n\n2402:\
    \   nZvysok number;\n\n2403:   sRet varchar2(254);\n\n2404: begin\n\n2405:   pnP_kusy := 0; pnP_Bal := 0;\n\n\
    2406:   for rSK in (select sk.mvm_bal, sk.velke_bal, sk.dod_bal, sk.vrstva_bal, sk.paleta_bal, nvl(substr(sk.flags_b,2,1),0)\
    \ bmd,\n\n2407:     (case when  upper(sk.nazov) like upper('%prepravk%') and substr(sk.flags_b,1,1) = '1' then\
    \  1 else 0 end) je_prep\n\n2408:     from sklad_karta sk where sk.id = pnKodID) loop\n\n2409:     --\n\n2410:\
    \     nZvysok := pnPocet;\n\n2411:     if nZvysok >= rSK.paleta_bal and rSK.paleta_bal>1 then\n\n2412:     \
    \  sRet := to_char(trunc(nZvysok/rSK.paleta_bal))||' PAL ('||to_char(rSK.paleta_bal)||')';\n\n2413:       pnP_Bal\
    \ := pnP_Bal + trunc(nZvysok/rSK.paleta_bal);\n\n2414:       nZvysok := mod(nZvysok,rSK.paleta_bal);\n\n2415:\
    \     end if;\n\n2416:     if nZvysok >= rSK.vrstva_bal and rSK.vrstva_bal>1 then\n\n2417:       if sRet is\
    \ not null then\n\n2418:         sRet := sRet||' + ';\n\n2419:       end if;\n\n2420:       sRet := sRet||to_char(trunc(nZvysok/rSK.vrstva_bal))||'\
    \ VRS ('||to_char(rSK.vrstva_bal)||')';\n\n2421:       pnP_Bal := pnP_Bal + trunc(nZvysok/rSK.vrstva_bal);\n\
    \n2422:       nZvysok := mod(nZvysok,rSK.vrstva_bal);\n\n2423:     end if;\n\n2424:     if nZvysok >= rSK.dod_bal\
    \ and rSK.dod_bal>1 then\n\n2425:       if sRet is not null then\n\n2426:         sRet := sRet||' + ';\n\n2427:\
    \       end if;\n\n2428:       sRet := sRet||to_char(trunc(nZvysok/rSK.dod_bal))||' KRT ('||to_char(rSK.dod_bal)||')';\n\
    \n2429:       pnP_Bal := pnP_Bal + trunc(nZvysok/rSK.dod_bal);\n\n2430:       nZvysok := mod(nZvysok,rSK.dod_bal);\n\
    \n2431:     end if;\n\n2432:     if nZvysok >= rSK.velke_bal and rSK.velke_bal>1 then\n\n2433:       if sRet\
