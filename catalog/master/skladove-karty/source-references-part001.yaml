    \n13:    \n\n14:   if inserting /*and :new.t_tovaru in (1,2,3,5,7,8,13,14)*/ then\n\n15:     -- ak je nastaveny\
    \ typ polozky vyroby na uctovnom type - prenasa sa\n\n16:     select typ_vyr into nTyp_vyr from ucty_sk where\
    \ id = :new.t_tovaru;\n\n17:     if nTyp_vyr is not null then \n\n18:       /*vlozenie skladovej karty do katalogu\
    \ vyroby*/\n\n19:       begin\n\n20:         mccarter_vyr.AktualizujKatalogVyroby(\n\n21:           pnAfterInsert=>1,\n\
    \n22:           pnKod_id=>:new.id,\n\n23:           psInt_kod_new=>:new.int_kod,\n\n24:           psNazov_new=>:new.nazov,\n\
    \n25:           psPomenovanie_new=>:new.pomenovanie,\n\n26:           psP_jednotka_new=>:new.p_jednotka,\n\n\
    27:           pnU_typ=>:new.t_tovaru,\n\n28:           pnTyp_KV=>null,\n\n29:           psInt_kod_old=>null,\n\
    \n30:           psNazov_old=>null,\n\n31:           psPomenovanie_old=>null);\n\n32:         exception when\
    \ others then\n\n33:           debugpckerror('T_SKLAD_KARTA_AFTER_MC', 'INS', :new.id, :new.int_kod);\n\n34:\
    \           return;\n\n35:       end;      \n\n36:     end if;\n\n37:   end if;\n\n38:   \n\n39:   if updating\
