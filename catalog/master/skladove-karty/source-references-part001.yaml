    \ and o.s_stamp = '0' and l.id > 0 and rownum = 1;\n\n5113:   return 1;\n\n5114: exception when no_data_found\
    \ then\n\n5115:   return 0;\n\n5116: end JePlatnaVCasCenniku;\n\n5117: \n\n5118: function GetPredavaSa_MO(pnKodID\
    \ number, pnSklad number default null, psSarza varchar2 default null) return number is\n\n5119:   nPredavaMO\
