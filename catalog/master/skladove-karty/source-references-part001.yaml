  - "1: TRIGGER T_MC_SKLAD_KARTA\n\n2:  BEFORE \n\n3:  UPDATE\n\n4:  ON SKLAD_KARTA\n\n5:  REFERENCING OLD AS OLD\
    \ NEW AS NEW\n\n6:  FOR EACH ROW \n\n7: declare\n\n8: sMail varchar2(2000);\n\n9: sPredmet varchar2(2000);\n\
    \n10: sbody varchar2(2000);\n\n11: sOdosielatel varchar2(30);\n\n12: \n\n13: begin\n\n14: sMail:='balaz@mccarter.sk;tillnerova@mccarter.sk;mazurova@mccarter.sk;vician@mccarter.sk;kurinec@mccarter.sk';\n\
    \n15: sPredmet:='null';\n\n16: sbody:='null';\n\n17: sOdosielatel:='zakaznickyservis@mccarter.sk';\n\n18: \n\
    \n19: for r in (select C_CIS.GetX( 'select kod_id from VYR_KATALOG where id=:xx',o.ID_VYR) kod_id, C_CIS.GetX(\
    \ 'SELECT INT_KOD ||'', ''|| VARIANT ||'', ''|| NAZOV FROM VYR_KATALOG WHERE ID=:xxxx',l.ID_VYR) vyr_pol from\
    \ VYR_KUSOVNIKY_O o,VYR_KUSOVNIKY_L l where l.s_stamp='0' and substr(l.flags,1,1)='1' and l.rid=o.rid_o and\
    \ C_CIS.GetX( 'select kod_id from VYR_KATALOG where id=:xxxx', o.ID_VYR)!=0 and  o.s_stamp='0') loop\n\n20:\
    \     if :old.DOD_SK!=:new.DOD_SK and r.kod_id=:new.id then\n\n21:     sPredmet:='Zmena dodavateľa - privátnej\
    \ značky na na skladovej karte'||r.vyr_pol;\n\n22:     sbody:='Nastala zmena dodávateľa pre surovinu '||:new.int_kod||'\
    \ - '||:new.nazov||', ktora vstupuje do receptúry privátnej značky';\n\n23:     pck_comm.mail_to(psE_mail =>sMail,psSubject=>sPredmet,\
    \ psBody =>sbody,psFLAGS_S =>'H',psOdosielatel=>sOdosielatel);\n\n24:     end if;\n\n25: end loop;\n\n26: end;"
