    \ C_5, C_6, C_7 into nC_1, nC_2, nC_3, nC_4, nC_5, nC_6, nC_7 from sklad_karta where id = pnKOD_ID;\n\n7146:\
    \     if psValues is null then\n\n7147:         update sklad_karta set C_1 = nC_1, C_2 = nC_2, C_3 = nC_3, C_4\
    \ = nC_4, C_5 = nC_5, C_6 = nC_6, C_7 = nC_7 where id = pnKOD_ID_NEW;\n\n7148:     else\n\n7149:         sCommand\
    \ := 'DECLARE ';\n\n7150:         sCommand := sCommand || 'nC_1 number := :pnC1;';\n\n7151:         sCommand\
    \ := sCommand || 'nC_2 number := :pnC2;';\n\n7152:         sCommand := sCommand || 'nC_3 number := :pnC3;';\n\
    \n7153:         sCommand := sCommand || 'nC_4 number := :pnC4;';\n\n7154:         sCommand := sCommand || 'nC_5\
    \ number := :pnC5;';\n\n7155:         sCommand := sCommand || 'nC_6 number := :pnC6;';\n\n7156:         sCommand\
