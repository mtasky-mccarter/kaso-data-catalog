    \         end if;\n\n6974:             if substr(r.HODNOTA, 1, 1) = '''' and substr(r.HODNOTA, -1) = '''' then\n\
    \n6975:                 r.HODNOTA := substr(r.HODNOTA, 2, length(r.HODNOTA) - 2);\n\n6976:             end if;\n\
    \n6977: \n\n6978:             c_sk_tech_param.NastavHodnotu(pnKOD_ID=>ToNumber(psPK), psID_TP=>substr(r.NAZOV,\
    \ 10), psHODNOTA=>r.HODNOTA);\n\n6979:             c_cis.RemoveField(psFieldName=>r.NAZOV, psValues=>sValues);\n\
    \n6980:         end loop;\n\n6981:     end if;\n\n6982: \n\n6983:     c_cis.GetFieldValue(psFieldName=>'NAHRADZA_KARTU',psValues=>sValues,\
