    \     select GetVariantTypuMakra(sk.makro) into nVariantMakra from sklad_karta sk where sk.id = pnKodID and\
    \ sk.makro is not null;\n\n5050:   else\n\n5051:     nVariantMakra := GetVariantTypuMakra(psMakro);\n\n5052:\
    \   end if;\n\n5053:   if nVariantMakra = c_makro.M_PREDAJNE then\n\n5054:     return 1;\n\n5055:   end if;\n\
    \n5056:   return 0;\n\n5057:   exception when no_data_found then\n\n5058:     return 0;\n\n5059: end JePredajneMakro;\n\
    \n5060: \n\n5061: \n\n5062: function GetVariantMakra(pnKodID number default null, psMakro varchar2 default null)\
    \ return number\n\n5063: is\n\n5064:   nVariantMakra number(2,0);\n\n5065: begin\n\n5066:   if psMakro is null\
    \ then\n\n5067:     select GetVariantTypuMakra(sk.makro) into nVariantMakra from sklad_karta sk where sk.id\
    \ = pnKodID and sk.makro is not null;\n\n5068:   else\n\n5069:     nVariantMakra := GetVariantTypuMakra(psMakro);\n\
    \n5070:   end if;\n\n5071:   return nVariantMakra;\n\n5072:   exception when no_data_found then\n\n5073:   \
    \  return 0;\n\n5074: end GetVariantMakra;\n\n5075: -----------------------------------------------------------------------------\n\
    \n5076: \n\n5077: function GetPodmSK (pnKodID number default 0, pnDodavatel number default 0, pnVyrobca number\
