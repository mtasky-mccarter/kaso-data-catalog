    \  pnID, FLAGS_B_PovolenaZapozicka);\n\n7645: end GetFB_PovolenaZapozicka;\n\n7646: \n\n7647: function GetFB_PovolenaPlatbaGastro(psFLAGS_B\
    \ varchar2 default null, pnID number default null) return number is\n\n7648: begin\n\n7649: \treturn GetValueFlags_b(psFLAGS_B,\
    \  pnID, FLAGS_B_PovolenaPlatbaGastro);\n\n7650: end GetFB_PovolenaPlatbaGastro;\n\n7651: \n\n7652: \n\n7653:\
    \ procedure GenerujCisTree is\n\n7654: nId number;\n\n7655: begin\n\n7656: /*\n\n7657: pp 02.2024\n\n7658: vymaze\
    \ a znovu naplni cis_tree pre skladove karty podla tovar_typ\n\n7659: o synchro sa stara trigger  t_sklad_karta_id_tree\n\
    \n7660: */\n\n7661: \n\n7662:  c_pom.setc_session;\n\n7663:  c_session.setprogram('0001');\n\n7664:  c_session.SetPovoleneVlozenieStromu(1);\n\
    \n7665: \n\n7666:     --vymazem vsetko v cis tree okrem root vetvy pre skladove karty\n\n7667:     delete from\
    \ cis_tree where id_cis=C_SKLAD_KARTA.CIS_SKLAD_KARTA and id>0;\n\n7668: \n\n7669:     --generujem novy strom\
    \ podla stareho stromu\n\n7670:     for rr in(select tt.id,tt.skratka,tt.nazov from tovar_typ tt  order by length(tt.id),tt.id)\n\
    \n7671:     loop\n\n7672: \n\n7673:              nId:=null;\n\n7674:              C_CIS_TREE.InsC(PNID=>nId,\n\
    \n7675:                              PNCISDEF=>C_SKLAD_KARTA.CIS_SKLAD_KARTA,\n\n7676:                     \
    \         PNPARENT=>-C_SKLAD_KARTA.CIS_SKLAD_KARTA,\n\n7677:                              PSNAZOV=>rr.nazov,\n\
    \n7678:                              PSSKRATKA=>rr.skratka,\n\n7679:                              PNPORADIE=>to_number(substr(rr.id,-2)),\n\
    \n7680:                              PSTREE=>rr.id);\n\n7681: \n\n7682:              --poznacim novy strom na\
    \ karty\n\n7683:              update sklad_karta sk set sk.id_tree=nId where sk.typ_t=rr.id;\n\n7684: \n\n7685:\
    \     end loop;\n\n7686: \n\n7687:     --poznacim podla stareho stromu parentov do noveho stromu\n\n7688:  \
    \   update cis_tree l\n\n7689:     set l.parent= nvl((select o.id from cis_tree o where o.id_cis=C_SKLAD_KARTA.CIS_SKLAD_KARTA\n\
    \n7690:                     and o.s_stamp='0' and o.tree=substr(l.tree,1,length(l.tree)-2) ),C_SKLAD_KARTA.CIS_SKLAD_KARTA)\n\
    \n7691:     where l.id_cis=C_SKLAD_KARTA.CIS_SKLAD_KARTA and l.s_stamp='0' and parent is not null;\n\n7692:\
    \ \n\n7693: end;\n\n7694: \n\n7695: \n\n7696: procedure DajAktualnyMontaznyPlan(pnKOD_ID number,psRID_MPL out\
    \ varchar2) is\n\n7697: begin\n\n7698: \tnull;\n\n7699: end DajAktualnyMontaznyPlan;\n\n7700: \n\n7701: function\
