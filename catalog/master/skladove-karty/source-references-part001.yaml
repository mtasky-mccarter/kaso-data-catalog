    \ na '||prID_SQ.count||' položiek.');\n\n7731: \tend if;\n\n7732: end VytvorStahovackuOut;\n\n7733: \n\n7734:\
    \ procedure VytvorStahovacku(pcIDs clob, pnSKLAD_KAM number, pnSKLAD_ODKIAL number, pnSposob number, pnVytvorPrikaz\
