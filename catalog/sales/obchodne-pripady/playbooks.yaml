    reference; v aktualnom MC profile bol bez vyuzitia, ale source flow je potvrdený. | P_REZ_PL je explicitne spojene
    s supplier delivery/prepravný-list coverage a môže menit SPOSOB_VYBAVENIA. | Detail OBJ_D_NAVRH/OBJD_* lifecycle
    patri do purchasing dokumentu.
  does_not_prove_sk: Current snapshot nenahrádza kompletnú event históriu; interpretovať iba v rozsahu schválených
    poznámok.
  next_step_sk: P_OBJ_D je purchasing coverage, nie supplier PO quantity source of truth. | RID_N je purchasing
    proposal reference; v aktualnom MC profile bol bez vyuzitia, ale source flow je potvrdený. | P_REZ_PL je explicitne
    spojene s supplier delivery/prepravný-list coverage a môže menit SPOSOB_VYBAVENIA. | Detail OBJ_D_NAVRH/OBJD_*
    lifecycle patri do purchasing dokumentu.
- playbook_id: odb.playbook.doc_281
  symptom_sk: 7.8 Objednavka je v nespravnom stave / nejde uzavrieť
  first_sql_ref: odb.sql.doc_281_1
  proves_sk: TYP_CIS a FLAGS_S[20] su rozne osi; neporovnavat ako 1:1 ekvivalenciu. | DATUM_OK IS NOT NULL nie je
    autoritativny completion status. | Header state vzdy porovnat s line-level quantity stavom a critical trigger
    guardmi. | Ak je editacia blokovaná, preverit zámok na obsluhu a relevantne session bypass mechanizmy.
  does_not_prove_sk: Current snapshot nenahrádza kompletnú event históriu; interpretovať iba v rozsahu schválených
    poznámok.
