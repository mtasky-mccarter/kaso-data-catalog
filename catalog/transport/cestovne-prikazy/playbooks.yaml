  does_not_prove_sk: Transition stampy nie sú current state.
  next_step_sk: Porovnaj raw STAV, FLAGS_B a effective state.
  temporal_boundary_sk: Current snapshot oddeľ od selective history/transition audit.
  proves_sk: Current raw L.STAV, FLAGS_B, effective state a vybrané transition stampy.
