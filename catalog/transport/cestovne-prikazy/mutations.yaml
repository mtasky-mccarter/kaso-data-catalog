  writer_role: CORE DOMAIN
  event_sk: Header transport cost flow
  direct_mutations_sk: D_CPR_L/cost flow patrí medzi potvrdené writery header nákladov.
  side_effects_sk: C_CP_VYUCT_PREPRAVY a C_CESTOVNE_PR_TRASA sú ďalšie potvrdené cost-domain writery/boundaries.
  diagnostic_meaning_sk: Header náklad má viac writerov; diagnostika musí pokračovať do cost/settlement domény a nesmie zamieňať NAKL_P s NAKL_S.
  status: POTVRDENÉ
  evidence_refs:
  - cp.evidence.b2.core_source
  - cp.evidence.d.accepted_contract

- mutation_id: cp.mutation.bridge_cost
  target_refs:
  - mc.field.cestovne_pr_o.nakl
  writer_ref: mc.oracle.mc_c_cestovne_pr_trasa.package_body
  writer_role: DIRECT WRITER
  event_sk: Route/cost calculation
  direct_mutations_sk: Route/cost calculation zapisuje riadkový O.NAKL; T_CESTOVNE_PR_O_NAKLADY ho pri nepodporovanom document type môže nulovať.
  side_effects_sk: T_CESTOVNE_PR_O_NAKLADY môže pri podporovanom VYD/transfer flow propagovať náklad do VYD_L.SUMA_DN a označiť faktúru na prepočet.
  diagnostic_meaning_sk: O.NAKL nie je univerzálny pre všetky polymorfné RID_V targety.
  status: POTVRDENÉ
  evidence_refs:
  - cp.evidence.b2.core_source

- mutation_id: cp.mutation.route_stop_fields
  target_refs:
  - mc.field.cestovne_pr_o.poradie
  - mc.field.cestovne_pr_o.poradie_2
  - mc.field.cestovne_pr_o.id_tr_od
  - mc.field.cestovne_pr_o.id_tr_do
  writer_ref: mc.oracle.mc_d_cpr_o
  writer_role: CORE DOMAIN
  event_sk: PoznacID_TR_OD / PoznacID_TR_DO
  condition_sk: Overload cez RID_CP+RID_V aktualizuje iba aktívne bridge riadky STAV<>5.
  direct_mutations_sk: Aktualizuje ID_TR_OD/ID_TR_DO a voliteľne PORADIE/PORADIE_2.
  side_effects_sk: C_ROZVOZ_DAVKA, C_CESTOVNE_PR_TRASA a optimization patria do ďalšieho route writer surface.
  diagnostic_meaning_sk: PORADIE/PORADIE_2 je mutable route output, nie technická identita bridge riadku.
  status: POTVRDENÉ
  evidence_refs:
  - cp.evidence.b2.d_cpr_o
  - cp.evidence.b2.core_source

