  - mc.field.cestovne_pr_o.stav
  writer_ref: mc.oracle.mc_d_cpr_l
  writer_role: CORE DOMAIN
  event_sk: Add/remove/status sync
  direct_mutations_sk: VyradDoklad môže STAV=5 alebo fyzický DELETE podľa lifecycle; UpdateStavCP mení nezrušené bridge.
  side_effects_sk: C_ROZVOZ_QUE, C_DOKL_OBAL a HANDYGO patria do ďalšieho writer/caller surface podľa source.
  diagnostic_meaning_sk: O.STAV môže byť pred/za header stavom; STAV=5 neznamená, že každý historicky vyradený bridge zostane fyzicky zachovaný.
  status: POTVRDENÉ
  evidence_refs:
  - cp.evidence.b2.core_source
  - cp.evidence.b2.d_cpr_o

