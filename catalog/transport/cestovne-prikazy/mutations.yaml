  - mc.field.cestovne_pr_l.flags_b
  writer_ref: mc.oracle.mc_d_cpr_l
  writer_role: CORE DOMAIN
  event_sk: Lifecycle transition
  direct_mutations_sk: UpdateStavCP synchronizuje štandardný O.STAV a L.STAV; fiktívny stav zapisuje FLAGS_B.
  side_effects_sk: WMS/tracktrace/obaly podľa konkrétneho prechodu.
  diagnostic_meaning_sk: Current stav čítaj z L.STAV a pri extended stave cez D_CPR_L.GetStavCPZlozExt; transition stampy nie sú current-state flagy.
