  watched_field_refs: []
  session_or_bypass_sk: SKLAD závisí od INI 144 a session lokácie/skladu.
  business_effect_sk: Dopĺňa SKLAD/POBOC/VYSTAVIL, číselníkový RID, flags a tree defaults.
  diagnostic_meaning_sk: Insert defaults nemožno interpretovať bez session/INI kontextu.
  evidence_refs:
