- flow_id: cp.flow.t_cestovne_pr_l_tracktrace
  trigger_or_procedure_ref: mc.oracle.mc_t_cestovne_pr_l_tracktrace
  event_sk: UPDATE; lifecycle prechod pod 2 -> 2/3/4
  watched_field_refs:
  - mc.field.cestovne_pr_l.stav
  session_or_bypass_sk: Používa D_CPR_L.dajPlatne_Vyd_CP.
  business_effect_sk: Track&trace požiadavky; rollback recall.
  diagnostic_meaning_sk: Transition side effect; nie samostatná autorita current state.
  evidence_refs:
  - cp.evidence.a.physical
  - cp.evidence.b2.core_source
  calls:
  - callee_ref: mc.oracle.mc_d_cpr_l
    condition_sk: Výber platných výdajok cez D_CPR_L.dajPlatne_Vyd_CP.
    sequence: 1
  direct_mutations: []
  side_effects:
  - description_sk: Vkladá track&trace požiadavky pre platné výdajky; pri rollbacku nastaví recall.
    scope_refs:
    - mc.oracle.mc_tracktrace_que_l
  exceptions: []
- flow_id: cp.flow.t_cestovne_pr_l_wms_oue
  trigger_or_procedure_ref: mc.oracle.mc_t_cestovne_pr_l_wms_oue
  event_sk: UPDATE; lifecycle prechod <1 -> >=1
  watched_field_refs:
  - mc.field.cestovne_pr_l.stav
  condition_sk: Pri reopen môže INI 1473 blokovať zrušenie uzavretia, ak sa CP už balí.
  session_or_bypass_sk: Správanie reopen je podmienené INI 1473.
  business_effect_sk: Zakladá WMS_QUE pre CP; prepočíta WMS palety/doklady.
  diagnostic_meaning_sk: UI problém s reopen môže byť WMS guard, nie poškodený L.STAV.
  evidence_refs:
  - cp.evidence.a.physical
  - cp.evidence.b2.core_source
  calls: []
  direct_mutations: []
  side_effects:
  - description_sk: Zakladá alebo synchronizuje WMS execution boundary pre cestovný príkaz a prepočítava WMS palety/doklady.
    scope_refs:
    - mc.oracle.mc_wms_que
  exceptions:
  - description_sk: INI 1473 môže blokovať reopen, ak WMS už vykonáva balenie.
