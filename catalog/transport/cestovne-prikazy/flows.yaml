  - mc.field.cestovne_pr_o.adresa
  - mc.field.cestovne_pr_o.rid_adr_dod
  session_or_bypass_sk: RID_ADR_DOD má dual target address logic.
  business_effect_sk: I_STAMP/U_STAMP; RID_ADR_DOD normalizácia.
  diagnostic_meaning_sk: RID_ADR_DOD sa nesmie interpretovať ako jeden enforced FK target.
