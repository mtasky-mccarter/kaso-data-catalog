    - mc.field.cestovne_pr_l.sklad
    - mc.field.cestovne_pr_l.poboc
    - mc.field.cestovne_pr_l.vystavil
    description_sk: Dopĺňa lokáciu/pobočku/vystavujúceho používateľa podľa session a konfigurácie.
  - scope_refs:
    - mc.field.cestovne_pr_l.rid
    - mc.field.cestovne_pr_l.flags
    - mc.field.cestovne_pr_l.flags_b
    - mc.field.cestovne_pr_l.id_tree
    description_sk: Dopĺňa technické identifikačné a default hodnoty podľa trigger source.
  side_effects: []
  exceptions:
