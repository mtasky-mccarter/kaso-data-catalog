  business_effect_sk: Exportné dávky, emaily a tlač podľa FLAGS/DOPRAVA.
  diagnostic_meaning_sk: Ide o aplikačný side-effect trigger, nie autoritu business významu jednotlivých FLAGS bitov.
  evidence_refs:
  - cp.evidence.a.physical
  - cp.evidence.b2.core_source
  calls: []
  direct_mutations: []
  side_effects:
  - description_sk: Generuje McCarter-specific exportné dávky, emaily a tlač podľa source podmienok FLAGS/DOPRAVA.
  exceptions: []
