- flow_id: cp.flow.t_cestovne_pr_o_after
  trigger_or_procedure_ref: mc.oracle.mc_t_cestovne_pr_o_after
  event_sk: INSERT OR UPDATE OR DELETE
  watched_field_refs:
  - mc.field.cestovne_pr_o.rid_v
  - mc.field.cestovne_pr_o.stav
  session_or_bypass_sk: Celý blok sa preskočí pri C_SESSION.GetReplikacia=1.
  business_effect_sk: Pre 029 synchronizuje WMS RID_CP; pre 319 synchronizuje DOCASNY_ROZVOZ Zavezeny/Nevybaveny.
  diagnostic_meaning_sk: Replikačný update môže mať iný side-effect surface než bežný aplikačný update.
  evidence_refs:
  - cp.evidence.a.physical
  - cp.evidence.b2.core_source
  calls: []
  direct_mutations: []
  side_effects:
  - description_sk: Pre RID_V prefix 029 synchronizuje WMS väzbu RID_CP.
    scope_refs:
    - mc.oracle.mc_wms_que.field.rid_cp
  - description_sk: Pre RID_V prefix 319 synchronizuje DOCASNY_ROZVOZ stav Zavezeny/Nevybaveny.
    scope_refs:
    - mc.oracle.mc_docasny_rozvoz.field.zavezeny
    - mc.oracle.mc_docasny_rozvoz.field.nevybaveny
  exceptions:
  - description_sk: C_SESSION.GetReplikacia=1 preskočí WMS a DOCASNY_ROZVOZ side effects.
- flow_id: cp.flow.t_cestovne_pr_o_naklady
  trigger_or_procedure_ref: mc.oracle.mc_t_cestovne_pr_o_naklady
  event_sk: UPDATE NAKL
  watched_field_refs:
  - mc.field.cestovne_pr_o.nakl
  - mc.field.cestovne_pr_o.rid_v
  session_or_bypass_sk: Nepodporovaný document type -> NAKL NULL.
  business_effect_sk: Pri podporovanom VYD/transfer flow prenáša náklad do výdajky a môže označiť faktúru na prepočet.
  diagnostic_meaning_sk: O.NAKL nie je univerzálna alokácia pre všetky polymorfné typy RID_V.
  evidence_refs:
  - cp.evidence.a.physical
  - cp.evidence.b2.core_source
  calls: []
  direct_mutations:
  - scope_refs:
    - mc.field.cestovne_pr_o.nakl
    description_sk: Pri nepodporovanom document type trigger nastavuje O.NAKL na NULL.
  side_effects:
  - description_sk: Pri manuálnom cenníku podporovaného VYD/319->VYD flow prenáša náklad do VYD_L.SUMA_DN a môže
      označiť faktúru na prepočet.
    scope_refs:
    - mc.oracle.mc_vyd_l.field.suma_dn
  exceptions:
  - description_sk: RID_V prefix 319 sa pre cost routing mapuje na VYD cez ROZVOZ_QUE; negarantovať DOCASNY_ROZVOZ.RID_D
      ako underlying join.
