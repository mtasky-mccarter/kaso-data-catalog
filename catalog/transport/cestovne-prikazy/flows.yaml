- flow_id: cp.flow.t_s_cestovne_pr_l
  trigger_or_procedure_ref: mc.oracle.mc_t_s_cestovne_pr_l
  event_sk: UPDATE OR DELETE
  watched_field_refs:
  - mc.field.cestovne_pr_l.stav
  - mc.field.cestovne_pr_l.poznamka
  - mc.field.cestovne_pr_l.pozn
  - mc.field.cestovne_pr_l.stav_ext_opt
  session_or_bypass_sk: Rollback lifecycle stampy nemaže.
  business_effect_sk: Pri UPDATE udržiava U_STAMP, transition stampy, POZNAMKA/POZN a EXT_OPT_STAMP synchronizáciu;
    trigger je deklarovaný aj pre DELETE.
  diagnostic_meaning_sk: Transition stamp je auditná stopa prechodu, nie current-state flag.
  evidence_refs:
  - cp.evidence.a.physical
  - cp.evidence.b2.core_source
  calls: []
  direct_mutations:
  - scope_refs:
    - mc.field.cestovne_pr_l.u_stamp
    description_sk: Aktualizuje technický U_STAMP pri update.
  - scope_refs:
    - mc.field.cestovne_pr_l.uzavrel_stamp
    - mc.field.cestovne_pr_l.odchod_stamp
    - mc.field.cestovne_pr_l.prichod_stamp
    - mc.field.cestovne_pr_l.vybavil_stamp
    - mc.field.cestovne_pr_l.s_stamp
    description_sk: Zapisuje transition stamp podľa lifecycle prechodu do stavov 1 až 5; rollback tieto stampy nemaže.
  - scope_refs:
    - mc.field.cestovne_pr_l.poznamka
    - mc.field.cestovne_pr_l.pozn
    description_sk: Synchronizuje POZNAMKA/POZN podľa trigger source.
  - scope_refs:
    - mc.field.cestovne_pr_l.ext_opt_stamp
    description_sk: Udržiava EXT_OPT_STAMP pri relevantnej zmene external-optimization stavu.
  side_effects: []
  exceptions:
  - description_sk: Lifecycle rollback nemaže už zapísané transition stampy.
- flow_id: cp.flow.t_s_cestovne_pr_l_ins
