name: Validate KASO catalog

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - codex/schema-v1.0

permissions:
  contents: read

concurrency:
  group: catalog-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate catalog bundle
        run: python tools/validate_catalog.py

      - name: Run validator tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
