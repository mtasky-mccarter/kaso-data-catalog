name: Validate KASO catalog

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - codex/schema-v1.0

permissions:
  contents: read

concurrency:
  group: catalog-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Plan validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          python tools/plan_change_validation.py --base "$BASE_SHA" --head HEAD --github-output "$GITHUB_OUTPUT"

      - name: Enforce publication integrity and version history
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: python tools/check_publication_governance.py --base "$BASE_SHA"

      - name: Validate catalog bundle
        run: python tools/validate_catalog.py

      - name: Run validator tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Check deterministic publications
        if: steps.scope.outputs.publication_check == 'true'
        run: python tools/generate_publication.py all --check
