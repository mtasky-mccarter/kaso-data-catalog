name: Validate KASO catalog

on:
  push:
    branches:
      - main
      - codex/schema-v1.0
      - pilot/cp-v1.1-machine-readable
  pull_request:
    branches:
      - main
      - codex/schema-v1.0

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Materialize staged CP pilot bundle
        run: |
          if [ -f .staging/cp/part-00 ]; then
            cat .staging/cp/part-* > tools/bootstrap_cp_pilot.py
            python tools/bootstrap_cp_pilot.py
          fi

      - name: Validate catalog bundle
        run: python tools/validate_catalog.py

      - name: Run validator tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
