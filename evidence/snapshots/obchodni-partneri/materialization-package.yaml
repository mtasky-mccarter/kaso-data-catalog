canonical_sql:
- sql_id: op.sql.partner_current_by_id
  file: sql/diagnostic/obchodni-partneri/partner-current-by-id.sql
  read_only: true
  sql_client: SQL Navigator 5.5.4.847
  oracle_server_version: null
  text: '-- Grain: exactly one OBCH_PARTNERI row when :partner_id exists in MC.

    -- Limit: current master snapshot; not historical partner truth.

    SELECT p.*

    FROM mc.obch_partneri p

    WHERE p.id = :partner_id;

    '
- sql_id: op.sql.partner_current_enriched
  file: sql/diagnostic/obchodni-partneri/partner-current-enriched.sql
  read_only: true
  sql_client: SQL Navigator 5.5.4.847
  oracle_server_version: null
  text: "-- Grain: one OBCH_PARTNERI row; only 1:1 / identity lookups.\n-- Do not add target S_STAMP='0' to JOINs;\
    \ expose target lifecycle separately.\nSELECT\n p.id AS partner_id, p.rid AS partner_rid, p.nazov AS partner_name,\
    \ p.s_stamp AS partner_s_stamp,\n p.krajina AS country_id, k.nazov AS country_name, k.nazov_m AS country_name_intl,\n\
    \ k.iso_nkod AS country_iso_num_raw, k.iso_alpha_3 AS country_iso_alpha3, k.s_stamp AS country_s_stamp,\n p.id_mesto\
    \ AS city_id, m.nazov AS city_name, m.psc AS city_postal_code, m.krajina AS city_country_id,\n mk.nazov AS city_country_name,\
    \ m.s_stamp AS city_s_stamp,\n p.mena_p AS currency_id, me.skratka AS currency_code, me.nazov AS currency_name_raw,\
    \ me.s_stamp AS currency_s_stamp,\n p.stav AS partner_state_id, sop.nazov AS partner_state_name, sop.s_stamp\
    \ AS state_s_stamp,\n p.typ_cis AS partner_type_id, tc.nazov_zoznam AS partner_type_name, tc.s_stamp AS type_s_stamp,\n\
    \ p.typ_uhrady AS payment_type_id, tu.nazov AS payment_type_name, tu.splatnost AS payment_due_days,\n tu.sposob_uhr\
    \ AS payment_method_id, ku.nazov AS payment_method_name, tu.s_stamp AS payment_type_s_stamp,\n p.obch_skupina\
    \ AS business_group_id, pos.nazov AS business_group_name, pos.s_stamp AS business_group_s_stamp,\n p.segment_trhu\
    \ AS market_segment_rid, seg.nazov AS market_segment_name, seg.s_stamp AS segment_s_stamp,\n p.zlava AS price_list_id,\
    \ cp.nazov AS price_list_name, cp.s_stamp AS price_list_s_stamp,\n p.sklad AS warehouse_id, bp.nazov AS warehouse_name,\
    \ bp.s_stamp AS warehouse_s_stamp,\n p.typ_el_kom AS ecomm_format_id, ek.nazov AS ecomm_format_name, ek.s_stamp\
    \ AS ecomm_format_s_stamp,\n p.zastupca AS rep_user_id, zu.meno AS rep_first_name, zu.priezvisko AS rep_last_name,\n\
    \ zu.funkcia AS rep_function, zu.el_mail AS rep_email, zu.tel_mb AS rep_mobile, zu.s_stamp AS rep_user_s_stamp,\n\
    \ p.nakupca AS buyer_id_raw, nu.id AS buyer_user_match_id, nu.meno AS buyer_first_name, nu.priezvisko AS buyer_last_name\n\
    FROM mc.obch_partneri p\nLEFT JOIN mc.krajiny k ON k.id=p.krajina\nLEFT JOIN mc.mesta m ON m.id=p.id_mesto\n\
    LEFT JOIN mc.krajiny mk ON mk.id=m.krajina\nLEFT JOIN mc.meny me ON me.id=p.mena_p\nLEFT JOIN mc.stavy_op sop\
    \ ON sop.id=p.stav\nLEFT JOIN mc.typy_cis tc ON tc.id=p.typ_cis\nLEFT JOIN mc.typy_uhrady tu ON tu.id=p.typ_uhrady\n\
    LEFT JOIN mc.kasy_sposob_uhrad ku ON ku.id=tu.sposob_uhr\nLEFT JOIN mc.partner_os pos ON pos.id=p.obch_skupina\n\
    LEFT JOIN mc.segmenty seg ON seg.rid=p.segment_trhu\nLEFT JOIN mc.cenniky_popis cp ON cp.id=p.zlava\nLEFT JOIN\
    \ mc.bartex_pobocky bp ON bp.id=p.sklad\nLEFT JOIN mc.el_kom_formaty ek ON ek.id=p.typ_el_kom\nLEFT JOIN mc.b_users\
    \ zu ON zu.id=p.zastupca\nLEFT JOIN mc.b_users nu ON nu.id=p.nakupca\nWHERE p.id = :partner_id;\n"
- sql_id: op.sql.partner_representative
  file: sql/diagnostic/obchodni-partneri/partner-representative.sql
  read_only: true
  sql_client: SQL Navigator 5.5.4.847
  oracle_server_version: null
  text: "-- Grain: one partner row. ZASTUPCA is partner-level representative, not delivery-place dealer.\nSELECT\
    \ p.id AS partner_id, p.nazov AS partner_name, p.zastupca AS rep_user_id,\n u.meno AS rep_first_name, u.priezvisko\
    \ AS rep_last_name, u.titul AS rep_title,\n u.funkcia AS rep_function, u.el_mail AS rep_email, u.tel_mb AS rep_mobile,\
    \ u.s_stamp AS rep_user_s_stamp\nFROM mc.obch_partneri p\nLEFT JOIN mc.b_users u ON u.id=p.zastupca\nWHERE p.id=:partner_id;\n"
- sql_id: op.sql.partner_search_ico_dic
  file: sql/diagnostic/obchodni-partneri/partner-search-ico-dic.sql
  read_only: true
  sql_client: SQL Navigator 5.5.4.847
  oracle_server_version: null
  text: "-- Returns ALL current matches; do not add ROWNUM=1. ICO/DIC are not unique identity.\nSELECT p.id AS partner_id,\
    \ p.rid AS partner_rid, p.nazov AS partner_name, p.ico, p.dic, p.dic_new, p.s_stamp\nFROM mc.obch_partneri p\n\
    WHERE p.s_stamp='0'\n  AND (p.ico=:ico OR p.dic=:dic OR p.dic_new=:dic_new)\nORDER BY p.id;\n"
- sql_id: op.sql.partner_state_role
  file: sql/diagnostic/obchodni-partneri/partner-state-role.sql
  read_only: true
  sql_client: SQL Navigator 5.5.4.847
  oracle_server_version: null
  text: "-- S_STAMP, STAV and TYP_CIS are separate axes.\nSELECT p.id AS partner_id, p.nazov AS partner_name, p.s_stamp\
    \ AS partner_s_stamp,\n p.stav AS partner_state_id, s.nazov AS partner_state_name,\n p.typ_cis AS partner_type_id,\
    \ t.nazov_zoznam AS partner_type_name\nFROM mc.obch_partneri p\nLEFT JOIN mc.stavy_op s ON s.id=p.stav\nLEFT\
    \ JOIN mc.typy_cis t ON t.id=p.typ_cis\nWHERE p.id=:partner_id;\n"
- sql_id: op.sql.partner_reference_quality
  file: sql/diagnostic/obchodni-partneri/partner-reference-quality.sql
  read_only: true
  sql_client: SQL Navigator 5.5.4.847
  oracle_server_version: null
  text: '-- Grain: one row per relationship quality summary.

    SELECT ''KRAJINA'' AS rel_name, COUNT(*) AS src_rows, SUM(CASE WHEN k.id IS NULL THEN 1 ELSE 0 END) AS no_match

    FROM mc.obch_partneri p LEFT JOIN mc.krajiny k ON k.id=p.krajina

    UNION ALL

    SELECT ''ID_MESTO'', COUNT(*), SUM(CASE WHEN m.id IS NULL THEN 1 ELSE 0 END)

    FROM mc.obch_partneri p LEFT JOIN mc.mesta m ON m.id=p.id_mesto

    UNION ALL

    SELECT ''ZASTUPCA'', COUNT(*), SUM(CASE WHEN u.id IS NULL THEN 1 ELSE 0 END)

    FROM mc.obch_partneri p LEFT JOIN mc.b_users u ON u.id=p.zastupca

    UNION ALL

    SELECT ''NAKUPCA_SOFT'', COUNT(*), SUM(CASE WHEN p.nakupca<>0 AND u.id IS NULL THEN 1 ELSE 0 END)

    FROM mc.obch_partneri p LEFT JOIN mc.b_users u ON u.id=p.nakupca

    ORDER BY 1;

    '
- sql_id: op.sql.partner_delivery_dealer_boundary
  file: sql/diagnostic/obchodni-partneri/partner-delivery-dealer-boundary.sql
  read_only: true
  sql_client: SQL Navigator 5.5.4.847
  oracle_server_version: null
  text: "-- BOUNDARY helper only. Grain: one partner x current delivery place.\n-- Full MIESTA_DODANIA semantics\
    \ belong to its separate master mapping.\nSELECT p.id AS partner_id, p.nazov AS partner_name, md.rid AS delivery_place_rid,\
    \ md.nazov AS delivery_place_name,\n md.dealer AS dealer_user_id, u.meno AS dealer_first_name, u.priezvisko\
    \ AS dealer_last_name,\n u.funkcia AS dealer_function, u.el_mail AS dealer_email, u.s_stamp AS dealer_user_s_stamp\n\
    FROM mc.obch_partneri p\nJOIN mc.miesta_dodania md ON md.id_partner=p.id AND md.s_stamp='0'\nLEFT JOIN mc.b_users\
    \ u ON u.id=md.dealer\nWHERE p.id=:partner_id\nORDER BY md.rid;\n"
